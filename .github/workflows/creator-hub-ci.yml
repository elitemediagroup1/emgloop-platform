name: creator-hub-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/creator/**'
      - 'apps/web/src/app/app/creator/**'
      - 'apps/web/src/app/api/creator/**'
      - 'apps/web/src/app/app/admin/creator-hub/**'
      - 'apps/web/src/workspaces/**'
      - 'apps/web/src/app/loop-os.css'
      - 'packages/database/src/creator/**'
      - 'packages/database/test/creator-*.test.ts'
      - 'packages/database/test/managed-creator-mail.test.ts'
      - 'packages/database/prisma/**'
      - 'packages/shared/src/creator/**'
      - 'apps/web/test/creator-*.test.tsx'
      - 'apps/web/test/tiktok-login-kit.test.tsx'
      - 'apps/web/src/meta/**'
      - 'apps/web/test/meta-*.test.tsx'
      - 'apps/connections-worker/src/meta-analytics-host.ts'
      - 'apps/web/src/app/api/integrations/meta/**'
      - 'packages/providers/src/meta/**'
      - 'packages/database/src/services/meta/**'
      - 'packages/database/src/repositories/meta-connection.repository.ts'
      - 'packages/database/test/meta-*.test.ts'
      - 'packages/shared/src/ai/creator-brand-update.ts'
      - '.github/workflows/creator-hub-ci.yml'

permissions:
  contents: read

jobs:
  creator-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
      LOOP_EVENT_SECRET: 'ci-not-a-real-secret'
      TSX_TSCONFIG_PATH: 'apps/web/tsconfig.test.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Creator UI and access contracts
        run: node --import tsx --test apps/web/test/creator-*.test.tsx apps/web/test/one-loop-shell.test.tsx apps/web/test/tiktok-login-kit.test.tsx apps/web/test/meta-*.test.tsx

      - name: Creator Gmail synthesis and publication contracts
        run: node --import tsx --test packages/database/test/managed-creator-mail.test.ts packages/database/test/creator-brand-mail.test.ts packages/database/test/creator-domain-discovery.test.ts packages/shared/test/creator-brand-update.test.ts packages/shared/test/ai-capacity.test.ts

  creator-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: creator_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d creator_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable runner-local database only. No production secrets or seed data.
      DATABASE_URL: 'postgresql://ci:ci@127.0.0.1:5432/creator_hub?schema=public'
      LOOP_TEST_POSTGRES_URL: 'postgresql://ci:ci@127.0.0.1:5432/creator_hub?schema=public'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply migrations to disposable database
        run: npm run -w @emgloop/database migrate:deploy
      - name: Creator production lifecycle and isolation
        run: node --import tsx --test packages/database/test/creator-production.postgres.test.ts

      - name: Meta OAuth isolation and lifecycle
        run: node --import tsx --test packages/database/test/meta-*.test.ts packages/providers/test/meta-api.test.ts
