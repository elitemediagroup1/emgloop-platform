name: creator-hub-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/creator/**'
      - 'apps/web/src/app/app/creator/**'
      - 'apps/web/src/app/app/admin/creator-hub/**'
      - 'apps/web/src/workspaces/**'
      - 'apps/web/src/app/loop-os.css'
      - 'packages/database/src/creator/**'
      - 'packages/shared/src/creator/**'
      - 'apps/web/test/creator-*.test.tsx'
      - '.github/workflows/creator-hub-ci.yml'

permissions:
  contents: read

jobs:
  creator-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci?schema=public'
      LOOP_EVENT_SECRET: 'ci-not-a-real-secret'
      TSX_TSCONFIG_PATH: 'apps/web/tsconfig.test.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Creator UI and access contracts
        run: node --import tsx --test apps/web/test/creator-*.test.tsx apps/web/test/one-loop-shell.test.tsx
