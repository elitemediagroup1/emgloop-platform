# Read stored reconciliation evidence.
#
# READ-ONLY. This job prints rows that already exist in
# provider_reconciliation_days. It writes nothing, contacts no provider, holds no
# provider credential, and running it twice changes nothing twice.
#
# WHY IT EXISTS. `reconcileDay` stores, for every date it ran, a block of counts
# describing how trustworthy the comparison was -- how many local rows it
# scanned, how many fell inside the day, how many carried no resolvable
# occurrence, how many carried no identity, and whether the provider read was
# truncated. `Reconcile Provider Days` prints the verdict and the set arithmetic
# and does not print that block, so the evidence has been in production since the
# first run and has never been read.
#
# THE QUESTION IT ANSWERS. The 2026-08-06 to 2026-08-19 evidence pass found three
# consecutive days -- 08-11, 08-12, 08-13 -- where the provider held 9,984 call
# identities and Loop held none. Two very different faults produce that zero:
#
#   localRowsScanned = 0                     nothing was ever received. The
#                                            deliveries did not arrive, or were
#                                            rejected before a row was written.
#   localRowsScanned > 0, localInWindow = 0  rows arrived, and something about
#                                            them kept them out of the day.
#
# One is an ingestion outage and the other is a data defect. They need opposite
# responses, and the number that separates them is already stored.
#
# WHAT IT CANNOT DO. It cannot reconcile, certify, ingest, recover, sync, replay,
# declare an expectation, declare an authority, register a source, measure or
# produce a Headline. Its two seams are one organization lookup and one scoped
# stored-row read, neither of which has a write method -- and the safety suite
# that proves the runner names none of that machinery runs BEFORE the database
# credential is used.
#
# A FINDING IS NOT A FAILURE. A stored state of UNKNOWN_EXPECTATION or
# INCONCLUSIVE is exactly what this job exists to show, and a date with no row at
# all is reported as MISSING rather than skipped. Both leave the run green. Only
# a precondition failure -- unknown organization, an invalid date, a missing
# credential -- is red. An inspection tool that went red on a finding would be a
# gate wearing an inspector's name, and people stop running those.
#
# NO SCHEDULE, NO PUSH, NO PULL_REQUEST, NO WORKFLOW_CALL. Reading production is
# still touching production, and a human should be the one asking.

name: Read Reconciliation Evidence

on:
  workflow_dispatch:
    inputs:
      organization_slug:
        description: 'Organization slug'
        required: true
        type: string
      dates:
        description: 'Eastern business dates, comma-separated (e.g. 2026-08-11,2026-08-12,2026-08-13)'
        required: true
        type: string

# Do NOT add push:, pull_request:, schedule: or workflow_call: triggers here.

permissions:
  contents: read

# Two readers cannot corrupt each other, but two runs printing into one Actions
# view is noise nobody asked for.
concurrency:
  group: read-reconciliation-evidence
  cancel-in-progress: false

jobs:
  read:
    name: Read reconciliation evidence
    runs-on: ubuntu-latest
    # Bounded by one database round trip per date.
    timeout-minutes: 15

    steps:
      - name: Fail closed when the database credential is missing
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Name only. The value is never echoed, never printed and never written
          # to the step summary. NO PROVIDER CREDENTIAL IS REQUESTED: this job
          # reads stored rows and never contacts CallGrid.
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret: DIRECT_DATABASE_URL"
            exit 1
          fi
          echo "The required secret is present."

      - name: Validate the requested input
        env:
          # Through the environment, never interpolated into the script body: a
          # ${{ }} expansion inside `run` is pasted as literal shell text, which
          # is how an input becomes a command.
          ORG_SLUG: ${{ inputs.organization_slug }}
          DATES: ${{ inputs.dates }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "${ORG_SLUG}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::organization_slug must be lowercase letters, digits and hyphens."
            exit 1
          fi
          count=0
          IFS=',' read -ra PARTS <<< "${DATES}"
          for raw in "${PARTS[@]}"; do
            d="$(printf '%s' "${raw}" | tr -d '[:space:]')"
            [ -z "${d}" ] && continue
            if ! printf '%s' "${d}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::Not a business date: ${d} (expected YYYY-MM-DD)"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "::error::No dates supplied."
            exit 1
          fi
          echo "Validated ${count} date(s) for organization ${ORG_SLUG}."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prove the runner cannot write anything
        # RUN BEFORE THE DATABASE CREDENTIAL IS USED, and deliberately blocking.
        # These suites read the runner's own source and fail if it names
        # reconciliation, certification, ingestion, recovery, sync, replay, a
        # declaration, a provider adapter, fetch, raw SQL or a Prisma delegate. A
        # red step here means the read boundary moved, and no connection is
        # opened.
        run: |
          set -euo pipefail
          npm run test:operations
          npm test --workspace=@emgloop/database

      - name: Read
        env:
          # DIRECT, non-pooled, matching the sibling operations workflows. No
          # CALLGRID_API_KEY: this job has no provider read to make.
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          ORG_SLUG: ${{ inputs.organization_slug }}
          DATES: ${{ inputs.dates }}
        run: |
          set -euo pipefail
          npm run read:reconciliation-evidence -- \
            --organization "${ORG_SLUG}" \
            --dates "${DATES}"

      - name: How to read the output
        if: always()
        run: |
          echo "### Reconciliation evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Nothing was written.** This job only prints stored rows." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=DAY_EVIDENCE rowFound=false\` - that date was **never reconciled**. Not a finding about the data." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=DAY_LOCAL_EVIDENCE\` is the block this job exists for:" >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`localRowsScanned=0\` - **nothing was received** in the scan window. Deliveries did not arrive, or were rejected before a row was written. That is an ingestion question, not a data question." >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`localRowsScanned>0\` with \`localInWindow=0\` - rows **did** arrive and none belonged to this day. Read \`localUnresolvedOccurrence\` and \`localMissingIdentity\` next." >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`truncated=true\` - the provider read hit its page budget, so the comparison is a lower bound and the difference is not a measurement." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=MEMBER_EVIDENCE\` names which campaign carried the absences and what was declared about it on that date." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A red run means a precondition failed - unknown organization, an invalid date, or a missing credential. A finding never makes this job red." >> "$GITHUB_STEP_SUMMARY"
