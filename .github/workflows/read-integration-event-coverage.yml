# Read integration event coverage.
#
# READ-ONLY, COUNTS ONLY. This job reads CallGrid IntegrationEvent rows for one
# organization over an explicit range of delivery dates and prints aggregates. It
# writes nothing, contacts no provider, holds no provider credential, imports
# nothing and recovers nothing.
#
# THE QUESTION IT ANSWERS. Reconciliation selects local rows by DELIVERY time --
# receivedAt within two days of the business date -- and judges them by
# OCCURRENCE. That is right for live traffic and has one blind spot: a call that
# occurred on the 11th and was delivered on the 20th sits outside every band the
# 11th ever scans, so it is invisible to reconciliation whether or not the row
# exists.
#
# The 2026-08-11 to 2026-08-13 evidence read showed thousands of rows scanned,
# zero in window, zero with an unresolvable occurrence, and scanned totals that
# were exactly the neighbouring days' known populations -- no residue at all. That
# proves nothing occurred on those dates WITHIN the two-day band, and it cannot
# see outside it. This can:
#
#   occurrence buckets empty across a wide range  -> the rows are not here at all
#   occurrence buckets populated, delivery later  -> they arrived late, and
#                                                    reconciliation could never
#                                                    have counted them
#
# Those need opposite responses. Nothing else in the platform can tell them apart.
#
# COUNTS ONLY, ENFORCED BY SHAPE. Every row is reduced to a delivery date, an
# occurrence date and a status the instant it is read. No payload, external id,
# label, phone number, name or email survives that reduction, so no later line
# could print one by accident.
#
# THE ONLY THING IT BORROWS FROM THE PROVIDER PACKAGE is `resolveCallOccurrence`,
# the canonical pure occurrence resolver reconciliation itself uses. A second
# resolver here would eventually disagree with the first about exactly the rows
# being investigated. It is a pure function over a payload: no client, no
# credential, no network.
#
# WHAT IT CANNOT DO. It cannot ingest, recover, import, backfill, sync, replay,
# reconcile, certify, declare an expectation or an authority, register a source,
# measure or produce a Headline. Its three seams are one organization lookup, one
# batched scoped event read and one pure resolver, none of which has a write
# method -- and the safety suite that proves the runner names none of that
# machinery runs BEFORE the database credential is used.
#
# NO SCHEDULE, NO PUSH, NO PULL_REQUEST, NO WORKFLOW_CALL. Reading production is
# still touching production, and a human should be the one asking.

name: Read Integration Event Coverage

on:
  workflow_dispatch:
    inputs:
      organization_slug:
        description: 'Organization slug'
        required: true
        type: string
      from_date:
        description: 'INCLUSIVE first Eastern business date of delivery (YYYY-MM-DD)'
        required: true
        type: string
      to_date:
        description: 'INCLUSIVE last Eastern business date of delivery (YYYY-MM-DD). Its whole Eastern day is covered.'
        required: true
        type: string

# Do NOT add push:, pull_request:, schedule: or workflow_call: triggers here.

permissions:
  contents: read

concurrency:
  group: read-integration-event-coverage
  cancel-in-progress: false

jobs:
  read:
    name: Read integration event coverage
    runs-on: ubuntu-latest
    # A wide range is a batched scan of a busy table. Bounded, so a runaway read
    # cannot hold a runner indefinitely.
    timeout-minutes: 30

    steps:
      - name: Fail closed when the database credential is missing
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Name only. The value is never echoed, never printed and never written
          # to the step summary. NO PROVIDER CREDENTIAL IS REQUESTED.
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret: DIRECT_DATABASE_URL"
            exit 1
          fi
          echo "The required secret is present."

      - name: Validate the requested input
        env:
          # Through the environment, never interpolated into the script body: a
          # ${{ }} expansion inside `run` is pasted as literal shell text, which
          # is how an input becomes a command.
          ORG_SLUG: ${{ inputs.organization_slug }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "${ORG_SLUG}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::organization_slug must be lowercase letters, digits and hyphens."
            exit 1
          fi
          for d in "${FROM_DATE}" "${TO_DATE}"; do
            if ! printf '%s' "${d}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "::error::Not a business date: ${d} (expected YYYY-MM-DD)"
              exit 1
            fi
          done
          # `to_date` is INCLUSIVE, so equal bounds are a legitimate single-day
          # question. Only an inverted range describes no day at all.
          if [ "${TO_DATE}" \< "${FROM_DATE}" ]; then
            echo "::error::to_date is INCLUSIVE and must not be earlier than from_date."
            exit 1
          fi
          echo "Validated ${FROM_DATE}..${TO_DATE} (inclusive) for organization ${ORG_SLUG}."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prove the runner cannot write anything
        # RUN BEFORE THE DATABASE CREDENTIAL IS USED, and deliberately blocking.
        # These suites read the runner's own source and fail if it names
        # ingestion, recovery, import, backfill, sync, replay, reconciliation,
        # certification, a declaration, a provider client, fetch, raw SQL or a
        # Prisma delegate. A red step here means the read boundary moved, and no
        # connection is opened.
        run: |
          set -euo pipefail
          npm run test:operations
          npm test --workspace=@emgloop/database

      - name: Read
        env:
          # DIRECT, non-pooled, matching the sibling operations workflows. No
          # CALLGRID_API_KEY: this job has no provider read to make.
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          ORG_SLUG: ${{ inputs.organization_slug }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          set -euo pipefail
          npm run read:event-coverage -- \
            --organization "${ORG_SLUG}" \
            --from "${FROM_DATE}" \
            --to "${TO_DATE}"

      - name: How to read the output
        if: always()
        run: |
          echo "### Integration event coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Nothing was written.** This job prints aggregate counts of rows that already exist." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`from_date\` and \`to_date\` are **both inclusive Eastern business dates**: the range opens at the start of \`from_date\`'s Eastern day and closes at the END of \`to_date\`'s." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=OCCURRENCE_DAY\` - how many delivered rows describe a call that OCCURRED on that date. **If 2026-08-11, 08-12 and 08-13 are absent here over a wide range, Loop never persisted those calls at all.**" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=CROSS_TIMING\` - the line that separates the two explanations. A row reading \`occurrenceDate=2026-08-11 receivedDate=2026-08-20\` means the call arrived LATE, and reconciliation could never have counted it: it selects by delivery time within two days of the business date." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=RECEIVED_AT_DAY\` - deliveries per day, split by status. A day with rows in \`FAILED\` was received and failed downstream; a day with no line at all received nothing." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`event=QUALITY\` - \`unresolvedOccurrence\` rows could not be dated at all. \`missingIdentity\` is counted over **every scanned row** here, unlike reconciliation's counter which is evaluated after its in-window filter." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "An empty result is an answer, not a failure. A red run means a precondition failed: unknown organization, an invalid or inverted range, or a missing credential." >> "$GITHUB_STEP_SUMMARY"
