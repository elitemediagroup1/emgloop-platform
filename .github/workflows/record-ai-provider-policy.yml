# Record AI Provider Policy -- activation gate G2. Manual, approved, one stage per run.
#
# Records (or KILLS) one AI provider's data-class policy in the chosen stage's database: a stored
# control in `ai_controls` (scope PROVIDER_POLICY) naming the HIGHEST sensitivity class Loop may send
# that provider, with the operator's reason, recorded as actor OPERATIONS with this run as its
# reference. The gateway refuses every call to a provider without a current ACTIVE policy whose
# ceiling reaches the task's own (POLICY_DENIED + PROVIDER_POLICY_*). Nothing else can stand in for
# this record: LOOP_AI_PROVIDER_TERMS_CONFIRMED is no longer read, and the connections stack no
# longer sets it (docs/architecture/loop-ai-runtime.md, G2; 2026-09-24).
#
# WHAT TELEGRAM TRIAGE NEEDS. telegram.content.triage sends COMMUNICATION_CONTENT. Its primary is
# anthropic, so staging needs: provider=anthropic, ceiling=COMMUNICATION_CONTENT, state=ACTIVE. (The
# openai fallback is only used where the deployment lists it; it needs its own record to serve.)
#
# HOW IT REACHES THE DATABASE. Exactly the way the migration workflows do: the connections-<stage>
# GitHub environment (the environment name is part of the OIDC trust), a short-lived OIDC credential
# for that stage's migrations role, and the one secret that role may read,
# loop/connections/<stage>/database-url. The accounts are pinned below -- staging 065148797865,
# production 080891698678 -- the credentials are bounded to the chosen one and checked again with STS
# before the secret is read. The DATABASE_URL is masked and never printed.
#
# DRY RUN FIRST, THEN THE WRITE. The job prints the current policies, then what it would record, then
# records it, then prints the policies again. The write names the version it read, so a policy that
# somebody else moved in between is refused (STALE) rather than overwritten.
#
# The stage and the confirmation are shell comparisons over the event payload, never `if:`
# expressions: text pasted into the dispatch form arrives padded, and an expression gate compares
# bytes. The phrase is `record ai-provider-policy <stage>`; only surrounding and invisible
# whitespace, repeated inner whitespace and letter case are forgiven, and a refusal prints what
# arrived. Every other input is read from the payload in a shell step too, and validated again by
# the script.
#
# It cannot run until the stage's migrations identity exists (infra/connections/access/
# github-migrate-access.yaml) and its role ARN is set on the connections-<stage> environment
# (CONNECTIONS_STAGING_MIGRATE_ROLE_ARN / CONNECTIONS_PRODUCTION_MIGRATE_ROLE_ARN, and for production
# CONNECTIONS_PRODUCTION_ACCOUNT_ID) -- the same prerequisites as the migration workflows.
#
# NO SCHEDULE, NO PUSH, NO PULL_REQUEST, NO WORKFLOW_CALL. Approving a provider is a human act.

name: Record AI Provider Policy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage: staging or production'
        required: true
        type: choice
        options:
          - staging
          - production
      provider:
        description: 'Provider'
        required: true
        type: choice
        options:
          - anthropic
          - openai
      ceiling:
        description: 'Highest sensitivity class the provider may receive (telegram triage needs COMMUNICATION_CONTENT)'
        required: true
        type: choice
        options:
          - OPERATIONAL
          - CONTACT_IDENTIFIER
          - COMMUNICATION_CONTENT
          - WORKFORCE_PII
      state:
        description: 'ACTIVE records the approval; KILLED withdraws it'
        required: true
        type: choice
        options:
          - ACTIVE
          - KILLED
      reason:
        description: 'Why: which data terms were reviewed (training, retention, region), by whom, when. One line, at most 500 characters.'
        required: true
        type: string
      confirm:
        description: 'Type exactly: record ai-provider-policy <stage>'
        required: true
        type: string

# Do NOT add push:, pull_request:, schedule: or workflow_call: triggers here.

permissions:
  contents: read
  id-token: write

concurrency:
  group: record-ai-provider-policy
  cancel-in-progress: false

jobs:
  confirm:
    name: Confirm the stage and the phrase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.confirm.outputs.stage }}
    steps:
      - name: Confirm
        id: confirm
        shell: bash
        run: |
          set -euo pipefail
          # Inputs are read from the event payload file, not declared as step env and never
          # interpolated into this script: a declared env value is printed in the step header
          # before the script runs, and an interpolated one is script injection.
          STAGE_IN="$(jq -r '.inputs.stage // ""' "${GITHUB_EVENT_PATH}")"
          CONFIRM="$(jq -r '.inputs.confirm // ""' "${GITHUB_EVENT_PATH}")"
          # Strip leading/trailing whitespace, including the invisible kinds a copy-paste carries:
          # NBSP (U+00A0), zero-width space/joiners (U+200B..U+200D), BOM (U+FEFF), CR.
          trim() {
            local v="$1"
            v="${v//$'\xc2\xa0'/ }"
            v="${v//$'\xe2\x80\x8b'/}"; v="${v//$'\xe2\x80\x8c'/}"; v="${v//$'\xe2\x80\x8d'/}"; v="${v//$'\xef\xbb\xbf'/}"
            v="${v//$'\r'/}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            printf '%s' "$v"
          }
          stage="$(trim "${STAGE_IN}")"
          stage="${stage,,}"
          case "${stage}" in
            staging|production) ;;
            *) echo "::error::stage must be staging or production (received $(printf '%q' "${STAGE_IN}"))."; exit 1 ;;
          esac
          REQUIRED="record ai-provider-policy ${stage}"
          normalized="$(trim "${CONFIRM}" | tr -s '[:space:]' ' ')"
          normalized="${normalized,,}"
          if [ "${normalized}" != "${REQUIRED}" ]; then
            echo "::error::This records an AI provider policy in ${stage}. Confirmation text required: ${REQUIRED}"
            # The phrase is not a secret; show exactly what arrived so the next attempt can be fixed.
            echo "Received $(printf '%s' "${CONFIRM}" | wc -c | tr -d ' ') bytes; with whitespace made visible: $(printf '%q' "${CONFIRM}")"
            exit 1
          fi
          echo "stage=${stage}" >> "$GITHUB_OUTPUT"
          echo "Confirmed for ${stage}."

  record:
    name: Record the provider policy
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment name is part of the OIDC trust: only this environment can reach the stage's role.
    environment: connections-${{ needs.confirm.outputs.stage }}
    env:
      STAGE: ${{ needs.confirm.outputs.stage }}
      # The two workload accounts, as literals: the chosen stage selects one, the credentials are
      # bounded to it, and STS must agree with it before any secret is read.
      STAGING_ACCOUNT: '065148797865'
      PRODUCTION_ACCOUNT: '080891698678'
      STAGING_ROLE_VAR: ${{ vars.CONNECTIONS_STAGING_MIGRATE_ROLE_ARN }}
      PRODUCTION_ROLE_VAR: ${{ vars.CONNECTIONS_PRODUCTION_MIGRATE_ROLE_ARN }}
      PRODUCTION_ACCOUNT_ID_VAR: ${{ vars.CONNECTIONS_PRODUCTION_ACCOUNT_ID }}
    steps:
      # Fail closed before any credential is requested: the stage names its pinned account, its
      # migrations role must be a role in that account, and production's environment must agree.
      - name: The stage names its account, and the migrate role lives in it
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
          case "${STAGE}" in
            staging)
              account="${STAGING_ACCOUNT}"
              role="$(trim "${STAGING_ROLE_VAR}")"
              ;;
            production)
              account="${PRODUCTION_ACCOUNT}"
              role="$(trim "${PRODUCTION_ROLE_VAR}")"
              if [ "$(trim "${PRODUCTION_ACCOUNT_ID_VAR}")" != "${PRODUCTION_ACCOUNT}" ]; then
                echo "Refusing: CONNECTIONS_PRODUCTION_ACCOUNT_ID is not the production workload account ${PRODUCTION_ACCOUNT}"
                exit 1
              fi
              ;;
            *) echo "Refusing: unknown stage"; exit 1 ;;
          esac
          case "${role}" in
            "arn:aws:iam::${account}:role/"?*) ;;
            *) echo "Refusing: the ${STAGE} migrate role is not a role in ${account}"; exit 1 ;;
          esac
          if [[ "${role}" =~ [[:space:]] ]]; then echo "Refusing: the role ARN contains whitespace"; exit 1; fi
          echo "account=${account}" >> "$GITHUB_OUTPUT"
          echo "role_arn=${role}" >> "$GITHUB_OUTPUT"
          echo "DB_SECRET=loop/connections/${STAGE}/database-url" >> "$GITHUB_ENV"
          echo "EXPECTED_ACCOUNT=${account}" >> "$GITHUB_ENV"

      - name: Validate the requested policy
        shell: bash
        run: |
          set -euo pipefail
          # Read from the event payload file (see the Confirm step for why).
          input() { jq -r --arg k "$1" '.inputs[$k] // ""' "${GITHUB_EVENT_PATH}"; }
          trim() { local s="$1"; s="${s//$'\r'/}"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
          provider="$(trim "$(input provider)")"
          ceiling="$(trim "$(input ceiling)")"
          state="$(trim "$(input state)")"
          reason="$(trim "$(input reason)")"
          case "${provider}" in anthropic|openai) ;; *) echo "::error::provider must be anthropic or openai."; exit 1 ;; esac
          case "${ceiling}" in OPERATIONAL|CONTACT_IDENTIFIER|COMMUNICATION_CONTENT|WORKFORCE_PII) ;; *) echo "::error::unknown ceiling."; exit 1 ;; esac
          case "${state}" in ACTIVE|KILLED) ;; *) echo "::error::state must be ACTIVE or KILLED."; exit 1 ;; esac
          case "${reason}" in *$'\n'*) echo "::error::reason must be one line."; exit 1 ;; esac
          if [ -z "${reason}" ] || [ "${#reason}" -gt 500 ]; then echo "::error::reason is required, at most 500 characters."; exit 1; fi
          # The reason travels to the script through a file, so no quoting or delimiter in it can
          # reach a shell or GITHUB_ENV.
          printf '%s' "${reason}" > "${RUNNER_TEMP}/policy-reason.txt"
          {
            echo "POLICY_PROVIDER=${provider}"
            echo "POLICY_CEILING=${ceiling}"
            echo "POLICY_STATE=${state}"
          } >> "$GITHUB_ENV"
          echo "Recording ${provider} ${state} ceiling=${ceiling} in ${STAGE} (reason: ${#reason} characters)."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # A dummy URL is enough for `prisma generate` at install; it never connects.
        env:
          DATABASE_URL: 'postgresql://localhost:5432/ci?schema=public'
        run: npm install --no-audit --no-fund

      # Pinned to the v6.3.0 commit. With OIDC it sends no session tags; allowed-account-ids refuses a
      # credential for any other account before a single call is made with it.
      - name: AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.guard.outputs.role_arn }}
          aws-region: us-east-1
          role-session-name: record-ai-provider-policy-${{ github.run_id }}
          allowed-account-ids: ${{ steps.guard.outputs.account }}

      - name: The credentials are for the stage's account
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "$EXPECTED_ACCOUNT" ]; then
            echo "Refusing: credentials are for $account, not $EXPECTED_ACCOUNT"
            exit 1
          fi

      - name: Read the stage's DATABASE_URL (masked, never printed)
        shell: bash
        run: |
          set -euo pipefail
          url="$(aws secretsmanager get-secret-value --region us-east-1 --secret-id "$DB_SECRET" --query SecretString --output text)"
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "The ${STAGE} DATABASE_URL is empty or unset"; exit 1
          fi
          echo "::add-mask::$url"
          printf 'DATABASE_URL=%s\n' "$url" >> "$GITHUB_ENV"
          echo "Loaded the ${STAGE} DATABASE_URL into the job environment (value hidden)."

      - name: Policies before
        run: npm run read:ai-provider-policy

      - name: Dry run
        shell: bash
        run: |
          set -euo pipefail
          npm run record:ai-provider-policy -- --provider "${POLICY_PROVIDER}" --ceiling "${POLICY_CEILING}" --state "${POLICY_STATE}" --reason "$(cat "${RUNNER_TEMP}/policy-reason.txt")"

      - name: Record
        shell: bash
        run: |
          set -euo pipefail
          npm run record:ai-provider-policy -- --provider "${POLICY_PROVIDER}" --ceiling "${POLICY_CEILING}" --state "${POLICY_STATE}" --reason "$(cat "${RUNNER_TEMP}/policy-reason.txt")" --reference "github:record-ai-provider-policy:run-${GITHUB_RUN_ID}:${GITHUB_ACTOR}" --write

      - name: Policies after
        run: npm run read:ai-provider-policy

      - name: How to read the output
        if: always()
        shell: bash
        run: |
          {
            echo "### AI provider policy (${STAGE})"
            echo ""
            echo "- \`PROVIDER_POLICY\` - each provider's current recorded policy: \`state\`, \`ceiling\` (the highest class it may receive), \`version\`. \`state=NONE\` means nothing is recorded, and the gateway refuses that provider (POLICY_DENIED)."
            echo "- \`TASK_POLICY\` - for each AI task, the class it sends (\`needs\`) and which providers' policies admit it (\`admittedBy\`). This is gate G2 only: activation, credentials and budget are decided elsewhere."
            echo "- \`RECORDED\` / \`UNCHANGED\` / \`REFUSED refusal=STALE\` - what the write did. STALE means somebody moved the policy between the read and the write; nothing was overwritten."
            echo ""
            echo "The worker and the web tier cache policies for at most 60 seconds, so a change reaches every instance within a minute."
          } >> "$GITHUB_STEP_SUMMARY"
