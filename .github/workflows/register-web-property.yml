# Register a website property.
#
# Binds ONE website property to ONE organization in web_properties -- the only thing website ingestion resolves
# tenancy through. Until a property is registered here its events are refused (PROPERTY_UNREGISTERED); there is no
# fallback organization. The migration that creates the table inserts nothing: every real property is registered
# by a person, one dispatch at a time.
#
# WHAT IT WRITES. One web_properties row through WebPropertyRepository: register (create, or update the bindings of
# this organization's OWN property) or enable / disable it. A key registered to another organization is REFUSED,
# never moved. It contacts no provider and holds no provider credential: the GA4 / Search Console / Bing / Clarity
# fields only record which external property belongs here, for a connector that does not exist yet.
#
# DRY RUN FIRST. `dry_run: true` validates against the database and writes nothing.
#
# NO SCHEDULE, NO PUSH, NO PULL_REQUEST, NO WORKFLOW_CALL -- a human starts this from the Actions tab.

name: Register Web Property

on:
  workflow_dispatch:
    inputs:
      organization_slug:
        description: 'Organization slug the property belongs to'
        required: true
        type: string
      property_key:
        description: 'The property key the tracker sends (its public ingest key is pk_emg_<key>)'
        required: true
        type: string
      action:
        description: 'register | enable | disable'
        required: true
        default: register
        type: choice
        options:
          - register
          - enable
          - disable
      domains:
        description: 'register only: allowed domains, space-separated (e.g. example.com www.example.com)'
        required: false
        type: string
      label:
        description: 'register only: a display label (optional)'
        required: false
        type: string
      ga4_property_id:
        description: 'register only: the GA4 property id (digits) this site reports to (optional; connects nothing)'
        required: false
        type: string
      search_console_site:
        description: 'register only: sc-domain:<host> or an https URL prefix ending in / (optional; connects nothing)'
        required: false
        type: string
      bing_site:
        description: 'register only: the Bing Webmaster site URL (optional; connects nothing)'
        required: false
        type: string
      clarity_project_id:
        description: 'register only: the Clarity project id (optional; connects nothing)'
        required: false
        type: string
      dry_run:
        description: 'Check what this would do and write nothing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: register-web-property
  cancel-in-progress: false

jobs:
  register:
    name: Register web property
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fail closed when the database credential is missing
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret: DIRECT_DATABASE_URL"
            exit 1
          fi
          echo "The required secret is present."

      - name: Validate the requested input
        env:
          ORG_SLUG: ${{ inputs.organization_slug }}
          PROPERTY_KEY: ${{ inputs.property_key }}
          ACTION: ${{ inputs.action }}
          DOMAINS: ${{ inputs.domains }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "${ORG_SLUG}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::organization_slug must be lowercase letters, digits and hyphens."
            exit 1
          fi
          if ! printf '%s' "${PROPERTY_KEY}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::property_key must be lowercase letters, digits and hyphens."
            exit 1
          fi
          if [ "${ACTION}" = "register" ] && [ -z "$(printf '%s' "${DOMAINS:-}" | tr -d '[:space:]')" ]; then
            echo "::error::register needs at least one allowed domain."
            exit 1
          fi
          echo "Validated ${ACTION} for a property of organization ${ORG_SLUG}."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prove the runner's boundary before touching the database
        run: |
          set -euo pipefail
          npm run test:operations

      - name: Register
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          ORG_SLUG: ${{ inputs.organization_slug }}
          PROPERTY_KEY: ${{ inputs.property_key }}
          ACTION: ${{ inputs.action }}
          DOMAINS: ${{ inputs.domains }}
          LABEL: ${{ inputs.label }}
          GA4_PROPERTY_ID: ${{ inputs.ga4_property_id }}
          SEARCH_CONSOLE_SITE: ${{ inputs.search_console_site }}
          BING_SITE: ${{ inputs.bing_site }}
          CLARITY_PROJECT_ID: ${{ inputs.clarity_project_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--organization "${ORG_SLUG}" --key "${PROPERTY_KEY}" --action "${ACTION}")
          if [ "${ACTION}" = "register" ]; then
            for d in ${DOMAINS}; do args+=(--domain "${d}"); done
            if [ -n "${LABEL:-}" ]; then args+=(--label "${LABEL}"); fi
            if [ -n "${GA4_PROPERTY_ID:-}" ]; then args+=(--ga4-property-id "${GA4_PROPERTY_ID}"); fi
            if [ -n "${SEARCH_CONSOLE_SITE:-}" ]; then args+=(--search-console-site "${SEARCH_CONSOLE_SITE}"); fi
            if [ -n "${BING_SITE:-}" ]; then args+=(--bing-site "${BING_SITE}"); fi
            if [ -n "${CLARITY_PROJECT_ID:-}" ]; then args+=(--clarity-project-id "${CLARITY_PROJECT_ID}"); fi
          fi
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          npm run register:web-property -- "${args[@]}"

      - name: Note what a red run means
        if: failure()
        run: |
          echo "### Registration stopped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Nothing was written.** Read the log above:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`code=KEY_REGISTERED_ELSEWHERE\` - another organization owns this property key. A property is never moved by a registration." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`code=DOMAIN_SHAPE\` / \`NO_ALLOWED_DOMAINS\` - give plain hostnames (no scheme, path, port or wildcard)." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`code=*_BOUND_ELSEWHERE\` - that GA4 property / Search Console site / Bing site / Clarity project already belongs to another Loop property. One external property belongs to one organization." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`reason=PROPERTY_NOT_IN_ORGANIZATION\` - enable/disable named a property this organization does not own." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-running with \`dry_run: true\` is always safe and writes nothing." >> "$GITHUB_STEP_SUMMARY"
