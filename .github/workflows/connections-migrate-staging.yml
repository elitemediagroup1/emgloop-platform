# Connections worker -- STAGING database migrations. Manual, approved, staging only.
#
# Applies pending Prisma migrations (including the SourceConnection and SourceObservation tables) to
# the STAGING connections database, whose URL lives in AWS Secrets Manager at
# loop/connections/staging/database-url. It NEVER touches production: it reads only the staging
# secret, through a dedicated OIDC role scoped to exactly that secret, and it does not use the
# production migration secret (DIRECT_DATABASE_URL) at all. Production migrations remain
# deploy-prisma-migrations.yml, unchanged.
#
# The DATABASE_URL is masked and passed through the job environment; it is never printed. `prisma
# migrate deploy` / `migrate status` do not print the connection string.
#
# It cannot run until an administrator has (docs/runbooks/connections-aws-staging.md):
#   1. deployed the migrations identity, infra/connections/access/github-migrate-access.yaml (once);
#   2. added the variable CONNECTIONS_STAGING_MIGRATE_ROLE_ARN to the connections-staging environment.

name: connections-migrate-staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: migrate loop-connections-staging'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: connections-staging
    env:
      CONNECTIONS_ACCOUNT: '065148797865'
      MIGRATE_ROLE_ARN: ${{ vars.CONNECTIONS_STAGING_MIGRATE_ROLE_ARN }}
      # The ONLY secret this workflow reads. The production secret is never referenced.
      STAGING_DB_SECRET: 'loop/connections/staging/database-url'
    steps:
      - name: Confirm
        if: ${{ inputs.confirm != 'migrate loop-connections-staging' }}
        run: |
          echo "This applies staging migrations. Confirmation text required: migrate loop-connections-staging"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # A dummy URL is enough for `prisma generate` at install; it never connects.
        env:
          DATABASE_URL: 'postgresql://localhost:5432/ci?schema=public'
        run: npm install --no-audit --no-fund

      - name: The migrate role belongs to Loop Brain Staging
        run: |
          case "$MIGRATE_ROLE_ARN" in
            "arn:aws:iam::${CONNECTIONS_ACCOUNT}:role/"?*) ;;
            *) echo "CONNECTIONS_STAGING_MIGRATE_ROLE_ARN is not a role in ${CONNECTIONS_ACCOUNT}"; exit 1 ;;
          esac

      - name: AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CONNECTIONS_STAGING_MIGRATE_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: connections-migrate-${{ github.run_id }}
          allowed-account-ids: '065148797865'

      - name: The credentials are for Loop Brain Staging
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "$CONNECTIONS_ACCOUNT" ]; then
            echo "Refusing: credentials are for $account, not $CONNECTIONS_ACCOUNT"
            exit 1
          fi

      - name: Read the staging DATABASE_URL (masked, never printed)
        run: |
          set -euo pipefail
          url="$(aws secretsmanager get-secret-value --region us-east-1 --secret-id "$STAGING_DB_SECRET" --query SecretString --output text)"
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "Staging DATABASE_URL is empty or unset"; exit 1
          fi
          echo "::add-mask::$url"
          printf 'DATABASE_URL=%s\n' "$url" >> "$GITHUB_ENV"
          echo "Loaded staging DATABASE_URL into the job environment (value hidden)."

      - name: Validate schema
        run: npx --yes prisma@5.22.0 validate --schema packages/database/prisma/schema.prisma

      - name: Deploy pending migrations (staging)
        run: npx --yes prisma@5.22.0 migrate deploy --schema packages/database/prisma/schema.prisma

      - name: Migration status
        run: npx --yes prisma@5.22.0 migrate status --schema packages/database/prisma/schema.prisma
