# Brain execution environment (B6) -- DEPLOY. Manual, approved, staging only.
#
# Deploys infra/brain into Loop Brain Staging (065148797865, us-east-1) with short-lived
# credentials from GitHub's OIDC provider. There are no AWS access keys anywhere. The
# account is checked before anything is compared or applied: the role ARN must be in
# 065148797865, and so must the credentials it yields (allowed-account-ids, then an
# explicit check); the CDK app refuses any other account as well.
#
# It cannot run until Matt has (docs/runbooks/brain-aws-staging.md):
#   1. deployed the deploy identity, infra/brain/access/github-deploy-access.yaml (step 9),
#      and bootstrapped CDK (step 14);
#   2. created the `brain-staging` GitHub environment (step 11): Matt as required reviewer,
#      `main` only, and the variable BRAIN_STAGING_DEPLOY_ROLE_ARN. BRAIN_STAGING_ALARM_EMAIL
#      is optional (empty: no alarm subscription). BRAIN_STAGING_BUDGET_EMAIL stays unset:
#      the budget is the central one (step 5), and a value would add a second, stack-owned one.
# Choosing `diff` shows the change and creates nothing.

name: brain-infra-deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diff (show the change) or deploy (apply it)'
        required: true
        type: choice
        options: [diff, deploy]
      confirm:
        description: 'For deploy, type exactly: deploy loop-brain-staging'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: brain-staging
    env:
      # Only for `prisma generate` at install; nothing connects.
      DATABASE_URL: 'postgresql://localhost:5432/ci?schema=public'
      BRAIN_ACCOUNT: '065148797865'
      DEPLOY_ROLE_ARN: ${{ vars.BRAIN_STAGING_DEPLOY_ROLE_ARN }}
      ALARM_EMAIL: ${{ vars.BRAIN_STAGING_ALARM_EMAIL }}
      BUDGET_EMAIL: ${{ vars.BRAIN_STAGING_BUDGET_EMAIL }}
    steps:
      - name: Confirm
        if: ${{ inputs.action == 'deploy' && inputs.confirm != 'deploy loop-brain-staging' }}
        run: |
          echo "Deploy requires the confirmation text: deploy loop-brain-staging"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm --prefix infra/brain install --no-audit --no-fund

      - name: Test before touching AWS
        run: |
          npm run -w @emgloop/brain-executor test
          npm --prefix infra/brain test

      - name: The deploy role belongs to Loop Brain Staging
        run: |
          case "$DEPLOY_ROLE_ARN" in
            "arn:aws:iam::${BRAIN_ACCOUNT}:role/"?*) ;;
            *) echo "BRAIN_STAGING_DEPLOY_ROLE_ARN is not a role in ${BRAIN_ACCOUNT}"; exit 1 ;;
          esac

      # Pinned to the v6.3.0 commit. With OIDC it sends no session tags; allowed-account-ids is
      # checked against the assumed role's account.
      - name: AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BRAIN_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: brain-infra-${{ github.run_id }}
          allowed-account-ids: '065148797865'

      - name: The credentials are for Loop Brain Staging
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$account" != "$BRAIN_ACCOUNT" ]; then
            echo "Refusing: credentials are for $account, not $BRAIN_ACCOUNT"
            exit 1
          fi

      - name: Diff
        working-directory: infra/brain
        run: |
          npm run bundle
          npx cdk diff --no-notices -c alarmEmail="$ALARM_EMAIL" -c budgetEmail="$BUDGET_EMAIL" LoopBrain-staging

      - name: Deploy
        if: ${{ inputs.action == 'deploy' }}
        working-directory: infra/brain
        run: npx cdk deploy --no-notices --require-approval never -c alarmEmail="$ALARM_EMAIL" -c budgetEmail="$BUDGET_EMAIL" LoopBrain-staging
