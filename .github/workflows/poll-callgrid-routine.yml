# Frequent short frontier reads plus an hourly 48-hour fact reread.
# GitHub schedules are best-effort; webhooks remain the live path.
name: Poll CallGrid Routine

on:
  schedule:
    # Off the top of the hour to reduce peak scheduler contention.
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    # Manual retry of the ROUTINE pass, after a failure or a deploy. It takes no
    # inputs, deliberately: there is no since, no until and no date, so there is
    # no way to turn this into a historical recovery. Recovery is a separate
    # operation with a different provenance label and a person behind it.

# Do NOT add push: or pull_request: triggers here.

permissions:
  contents: read

# One routine pass at a time. Checkpoint advancement is monotonic and overlapping
# passes are safe, but simultaneous ones duplicate provider traffic, raise the 429
# risk on an API already observed throttling, and race each other's fact
# convergence for nothing. A late run waits rather than piling on.
concurrency:
  group: poll-callgrid-routine
  cancel-in-progress: false

jobs:
  poll:
    name: Routine CallGrid poll
    runs-on: ubuntu-latest
    # Bound frontier stalls; deep rereads retain their larger existing budget.
    # GitHub may coalesce pending runs in this shared concurrency group.
    timeout-minutes: ${{ github.event.schedule == '3,13,23,33,43,53 * * * *' && 10 || 50 }}

    steps:
      - name: Stop unless routine polling has been switched on
        env:
          ORGANIZATIONS: ${{ vars.ROUTINE_POLL_ORGANIZATIONS }}
        run: |
          set -euo pipefail
          if [ -z "${ORGANIZATIONS:-}" ]; then
            echo "::error::ROUTINE_POLL_ORGANIZATIONS is not set. Routine polling is OFF and nothing was read."
            {
              echo "### Routine CallGrid polling is not enabled"
              echo ""
              echo "No provider request was made and no row was written."
              echo ""
              echo "To enable: set the repository variable \`ROUTINE_POLL_ORGANIZATIONS\` to the"
              echo "organization slug (or a comma-separated list). To disable again: clear it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        id: gate

      - name: Fail closed when a production credential is missing
        if: steps.gate.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          CALLGRID_API_KEY: ${{ secrets.CALLGRID_API_KEY }}
        run: |
          set -euo pipefail
          # Names only. A value is never echoed, never printed and never written
          # to the step summary.
          missing=""
          if [ -z "${DATABASE_URL:-}" ]; then missing="${missing} DIRECT_DATABASE_URL"; fi
          if [ -z "${CALLGRID_API_KEY:-}" ]; then missing="${missing} CALLGRID_API_KEY"; fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secret(s):${missing}"
            echo "Routine polling cannot run. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Both required secrets are present."

      - name: Validate the configured organizations
        if: steps.gate.outputs.enabled == 'true'
        env:
          # Through the environment, never interpolated into the script body: a
          # ${{ }} expansion inside `run` is pasted as literal shell text, which
          # is how a configured value becomes a command.
          ORGANIZATIONS: ${{ vars.ROUTINE_POLL_ORGANIZATIONS }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          IFS=',' read -ra PARTS <<< "${ORGANIZATIONS}"
          for raw in "${PARTS[@]}"; do
            slug="$(printf '%s' "${raw}" | tr -d '[:space:]')"
            [ -z "${slug}" ] && continue
            if ! printf '%s' "${slug}" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}$'; then
              echo "::error::Not an organization slug: ${slug}"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "${count}" -eq 0 ]; then
            echo "::error::ROUTINE_POLL_ORGANIZATIONS is set but names no organization."
            exit 1
          fi
          echo "Validated ${count} organization(s)."

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        # `npm install`, matching every other operations workflow. This step also
        # runs `prisma generate` through the database package's postinstall.
        run: npm install --no-audit --no-fund

      - name: Prove the runner cannot write anything else
        if: steps.gate.outputs.enabled == 'true'
        # RUN BEFORE PRODUCTION IS TOUCHED, and deliberately blocking. These suites
        # read the runner's own source and fail if it names a historical date, a
        # recovery label, an arbitrary interval, a Prisma delegate, raw SQL,
        # reconciliation, readiness or measurement. They also assert that no
        # unproven poll outcome can advance coverage. A red step here means the
        # boundary moved, and no production connection is opened.
        run: |
          set -euo pipefail
          npm run test:operations
          npm test --workspace=@emgloop/database
          npm test --workspace=@emgloop/shared

      - name: Poll
        if: steps.gate.outputs.enabled == 'true'
        env:
          # DIRECT, non-pooled, matching every other operations workflow. A pass
          # that holds a connection through 146 provider pages and thousands of
          # sequential writes is an operation, not a request, and the pooled
          # endpoint is the wrong shape for it.
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          CALLGRID_API_KEY: ${{ secrets.CALLGRID_API_KEY }}
          ORGANIZATIONS: ${{ vars.ROUTINE_POLL_ORGANIZATIONS }}
          POLL_MODE: ${{ github.event.schedule == '3,13,23,33,43,53 * * * *' && 'frontier' || 'deep' }}
        run: |
          set -euo pipefail
          # No since, no until, no date. The interval comes from the checkpoint.
          npm run poll:callgrid-routine -- --organizations "${ORGANIZATIONS}" --mode "${POLL_MODE}"

      - name: Note what a red run means
        if: failure()
        run: |
          echo "### Routine poll did not prove coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Read the \`OVERALL_RESULT=\` field on the \`event=SUMMARY\` line:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`COVERAGE_NOT_ADVANCED\` - the poll ran and did not prove the interval. The \`event=PASS_RESULT\` line names the poll outcome: \`FETCH_INCOMPLETE\` (truncated, throttled, pagination fault or provider error), \`REFUSED\` (a provider record the mapper does not recognise), \`PARTIALLY_APPLIED\` (**some rows are live**) or \`PROCESSING_FAILED\`. **The checkpoint was not moved**, so the next pass reads the same interval and converges." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`CHECKPOINT_BEHIND_POLL\` - the poll proved the interval and the stored boundary did not reach it. That should not happen; do not re-run blindly." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`NOTHING_PLANNED\` - the planner declined to propose an interval. With a positive overlap that means the stored boundary is ahead of the clock: suspect clock skew, not the poller." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`PRECONDITION_FAILED\` - an organization could not be resolved, or is suspended." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-running is safe: nothing here selects a historical range, ingestion is idempotent on \`(provider, externalId)\`, and checkpoint advancement is monotonic." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Do not** delete the checkpoint or any canonical call to recover from a failed pass. To stop routine polling, clear \`ROUTINE_POLL_ORGANIZATIONS\`." >> "$GITHUB_STEP_SUMMARY"
