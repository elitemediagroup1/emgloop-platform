# Read intelligence state.
#
# READ-ONLY. For one organization, prints what the commissioned intelligence paths actually
# recorded: the CallGrid Cases seen since a moment, each with its sightings (type, actor, time);
# duplicate Cases by rule and entity; how many rows each intelligence table gained since that
# moment; the outbox by domain and status; whether any relationship event qualifies for the
# creator review; delivery and subscription state; and, per member, calendar attendee-key
# coverage and identity suggestions by state. It writes nothing: the reader runs on a client that
# can only read.
#
# It prints Case ids, rule ids, states, times and counts. It never prints a title, a buyer,
# vendor or campaign name or id, a user id or email, an address, an attendee key, a message or a
# token. A person is the same `ref` digest the Calendar and Gmail cycles log.
#
# NO SCHEDULE, NO PUSH, NO PULL_REQUEST, NO WORKFLOW_CALL. Reading production is still touching
# production, and a human should be the one asking.

name: Read Intelligence State

on:
  workflow_dispatch:
    inputs:
      organization_slug:
        description: 'Organization slug'
        required: true
        type: string
      since:
        description: 'Read from this UTC instant, e.g. 2026-09-19T18:00:00Z. Empty = the last 24 hours. At most 30 days back.'
        required: false
        default: ''
        type: string

# Do NOT add push:, pull_request:, schedule: or workflow_call: triggers here.

permissions:
  contents: read

concurrency:
  group: read-intelligence-state
  cancel-in-progress: false

jobs:
  read:
    name: Read intelligence state
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fail closed when the database credential is missing
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Name only. The value is never echoed, printed or written to the summary.
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing repository secret: DIRECT_DATABASE_URL"
            exit 1
          fi
          echo "The required secret is present."

      - name: Validate the requested input
        id: input
        env:
          # Through the environment, never interpolated into the script body.
          ORG_SLUG: ${{ inputs.organization_slug }}
          SINCE: ${{ inputs.since }}
        shell: bash
        run: |
          set -euo pipefail
          # Surrounding whitespace is trimmed first, as in Read Employee Sources (#303): a slug
          # typed or pasted with spaces around it is still that slug. Whitespace INSIDE a value is
          # not repaired -- that is a different string, and it is refused.
          slug="${ORG_SLUG#"${ORG_SLUG%%[![:space:]]*}"}"
          slug="${slug%"${slug##*[![:space:]]}"}"
          # The WHOLE value is checked, not line by line, so an embedded newline cannot hide a
          # second value behind a valid first line.
          if [[ ! "${slug}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "::error::organization_slug must be lowercase letters, digits and hyphens."
            exit 1
          fi
          since="${SINCE#"${SINCE%%[![:space:]]*}"}"
          since="${since%"${since##*[![:space:]]}"}"
          if [ -n "${since}" ] && [[ ! "${since}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]{1,3})?)?Z$ ]]; then
            echo "::error::since must be empty or a UTC instant like 2026-09-19T18:00:00Z."
            exit 1
          fi
          # Only the validated values travel on; later steps never read the raw inputs.
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          echo "since=${since}" >> "$GITHUB_OUTPUT"
          echo "Validated organization ${slug}${since:+ since ${since}}."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prove the runner cannot write anything
        # RUN BEFORE THE DATABASE CREDENTIAL IS USED, and deliberately blocking.
        run: |
          set -euo pipefail
          npm run test:operations
          npm test --workspace=@emgloop/database

      - name: Read
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          ORG_SLUG: ${{ steps.input.outputs.slug }}
          SINCE: ${{ steps.input.outputs.since }}
        run: |
          set -euo pipefail
          npm run read:intelligence-state -- --organization "${ORG_SLUG}" --since "${SINCE}"

      - name: How to read the output
        if: always()
        run: |
          echo "### Intelligence state" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Nothing was written.** This job prints ids, states, times and counts of rows that already exist." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`CASE\` / \`SIGHTING\` - CallGrid Cases created, seen or changed since the moment, and each log entry recorded since then (type, actor, time, day key). Open one read-only at /app/admin/cases/<id>." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`CASE_LOG_SINCE\` - every CallGrid Case log entry since the moment, by type and actor: SITUATION_DETECTED is a new Case, SITUATION_RESIGHTED a later sighting, HUMAN a person's act." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`DUPLICATE\` / \`DUPLICATES\` - Cases sharing a rule and entity. Expected: 0 groups." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`WRITES\` - rows each table gained since the moment. \`casesUpdated\` counts Cases changed in any way, new ones included. \`draftsSent\` counts mail actually sent." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`OUTBOX\` / \`CREATOR\` / \`DELIVERIES\` / \`SUBSCRIPTION\` - what the drain has to deliver, what qualifies for the creator review, and what was delivered." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`EMPLOYEE\` - per person (\`ref\`, as the cycles log it): calendar events holding attendee keys, and identity suggestions by state. Counts only." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`bounded=true\` or \`truncated=true\` - that part is incomplete; do not act on it." >> "$GITHUB_STEP_SUMMARY"
