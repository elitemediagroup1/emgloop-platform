      &lt;div class=&quot;loop-record&quot;&gt;
        &lt;div class=&quot;loop-record__main&quot;&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Stages&lt;/h2&gt;&lt;div class=&quot;stages&quot;&gt;
            &lt;div class=&quot;stage on&quot;&gt;&lt;span class=&quot;stage__n&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;stage__t&quot;&gt;Edit — Sam&lt;/div&gt;&lt;div class=&quot;stage__d&quot;&gt;In progress since Thu 10:35 · source: Edit v2 · Denise sees “Changes requested · Brand feedback via EMG”&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;loop-pill loop-pill--info&quot;&gt;Editing&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;stage&quot;&gt;&lt;span class=&quot;stage__n&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;stage__t&quot;&gt;Creator review — Denise&lt;/div&gt;&lt;div class=&quot;stage__d&quot;&gt;Starts when v3 is uploaded · then EMG and Kona approvals for v3&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;loop-pill loop-pill--neutral&quot;&gt;Pending&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;&lt;/section&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Instructions · in order&lt;/h2&gt;
            &lt;ol class=&quot;loop-activity&quot;&gt;
              &lt;li class=&quot;loop-act loop-act--hi&quot;&gt;&lt;span class=&quot;loop-act__truth loop-act__truth--external&quot;&gt;Brand → EMG&lt;/span&gt;&lt;span class=&quot;loop-act__story&quot;&gt;“Legal needs the product claim removed at 0:17.”&lt;span class=&quot;loop-act__sub&quot;&gt;&lt;b&gt;Originated by:&lt;/b&gt; Kona (brand), via Harbor Agency · &lt;b&gt;Entered by:&lt;/b&gt; Priya · refers to Edit v2 · visible to Denise&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;loop-act__when&quot;&gt;Thu 10:20&lt;/span&gt;&lt;/li&gt;
            &lt;/ol&gt;
            &lt;p class=&quot;rung__meta&quot; style=&quot;margin:10px 0 0&quot;&gt;Production 1&#x27;s instructions (Denise, Mon 15:10 and Tue 18:30) are on &lt;a class=&quot;loop-link&quot; style=&quot;font-size:12.5px&quot;&gt;Production 1 →&lt;/a&gt;&lt;/p&gt;
          &lt;/section&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Add an instruction or comment&lt;/h2&gt;
            &lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px&quot;&gt;
              &lt;div class=&quot;field&quot;&gt;&lt;label&gt;From&lt;/label&gt;&lt;span class=&quot;seg&quot;&gt;&lt;span&gt;EMG team&lt;/span&gt;&lt;span class=&quot;on&quot;&gt;Brand / agency — relayed&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;field&quot;&gt;&lt;label&gt;Refers to version&lt;/label&gt;&lt;span class=&quot;seg&quot;&gt;&lt;span&gt;Original&lt;/span&gt;&lt;span&gt;v1&lt;/span&gt;&lt;span class=&quot;on&quot;&gt;v2&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;textarea&quot;&gt;Enter the feedback exactly as it was given…&lt;/div&gt;
            &lt;div style=&quot;display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px&quot;&gt;&lt;span class=&quot;toggle on&quot;&gt;&lt;i&gt;&lt;/i&gt;Visible to Denise&lt;/span&gt;&lt;span class=&quot;loop-btn&quot;&gt;Add&lt;/span&gt;&lt;/div&gt;
          &lt;/section&gt;
        &lt;/div&gt;
        &lt;aside class=&quot;loop-record__rail&quot;&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Content&lt;/h2&gt;&lt;dl class=&quot;loop-facts&quot;&gt;&lt;dt&gt;Record&lt;/dt&gt;&lt;dd&gt;&lt;a class=&quot;loop-link&quot;&gt;Kona unboxing reel →&lt;/a&gt;&lt;/dd&gt;&lt;dt&gt;Lineage&lt;/dt&gt;&lt;dd&gt;Original · v1 · v2&lt;/dd&gt;&lt;dt&gt;v2 approvals&lt;/dt&gt;&lt;dd class=&quot;q&quot;&gt;Denise Wed 12:05 · EMG (Priya) Wed 14:10 · Kona: changes requested&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Needed for Reel 1 of 2&lt;/h2&gt;&lt;ul class=&quot;req&quot; style=&quot;border-top:0;padding-top:0;margin-top:0&quot;&gt;&lt;li&gt;&lt;i&gt;&lt;/i&gt;Creator approval &lt;small&gt;· for v3&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;i&gt;&lt;/i&gt;EMG approval&lt;/li&gt;&lt;li&gt;&lt;i&gt;&lt;/i&gt;Brand approval &lt;small&gt;· Kona, relayed&lt;/small&gt;&lt;/li&gt;&lt;li&gt;&lt;i&gt;&lt;/i&gt;Published by Fri 25 Sep&lt;/li&gt;&lt;/ul&gt;&lt;p class=&quot;rung__meta&quot; style=&quot;margin:10px 0 0&quot;&gt;From the campaign&#x27;s deliverable, not from this work.&lt;/p&gt;&lt;/section&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Creator&lt;/h2&gt;&lt;div style=&quot;display:flex;gap:10px;align-items:center&quot;&gt;&lt;span class=&quot;loop-avatar&quot;&gt;DR&lt;/span&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;color:var(--loop-ink)&quot;&gt;Denise R.&lt;/div&gt;&lt;div style=&quot;font-size:12.5px;color:var(--loop-muted)&quot;&gt;Managed creator · &lt;a class=&quot;loop-link&quot; style=&quot;font-size:12.5px&quot;&gt;Person record →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
          &lt;section class=&quot;loop-panel&quot;&gt;&lt;h2 class=&quot;loop-panel__title&quot;&gt;Campaign context&lt;/h2&gt;&lt;dl class=&quot;loop-facts&quot;&gt;&lt;dt&gt;Campaign&lt;/dt&gt;&lt;dd&gt;&lt;a class=&quot;loop-link&quot;&gt;Kona Product Video →&lt;/a&gt;&lt;/dd&gt;&lt;dt&gt;Deliverable&lt;/dt&gt;&lt;dd&gt;Reel 1 of 2 · due Fri 25 Sep&lt;/dd&gt;&lt;dt&gt;Brand contact&lt;/dt&gt;&lt;dd class=&quot;q&quot;&gt;Harbor Agency · outside Loop&lt;/dd&gt;&lt;/dl&gt;&lt;/section&gt;
        &lt;/aside&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/div&gt;

&lt;h3&gt;Same row, two projections&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Creator sees (Content record)&lt;/th&gt;&lt;th&gt;EMG sees (Work detail)&lt;/th&gt;&lt;th&gt;The one thing underneath&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Changes requested&lt;/span&gt; · “Brand feedback via EMG · Thu 10:20”&lt;/td&gt;&lt;td&gt;Production 2, stage 1 &lt;span class=&quot;pill accent&quot;&gt;Editing&lt;/span&gt;, instruction tagged Brand → EMG&lt;/td&gt;&lt;td&gt;One new work instance on the same content, started by a relayed instruction&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Production → “From: Kona (brand) · relayed by Priya, EMG · refers to v2”&lt;/td&gt;&lt;td&gt;Instruction row: Originated by Kona via Harbor Agency · Entered by Priya · refers to v2&lt;/td&gt;&lt;td&gt;One instruction with two provenance facts (originator, Loop actor) and a version reference&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Needed for Reel 1 of 2 → ○ ○ ○ ○ “for the next version · v2 approval kept in history”&lt;/td&gt;&lt;td&gt;Rail: Needed for Reel 1 of 2 · “from the campaign&#x27;s deliverable, not from this work”&lt;/td&gt;&lt;td&gt;One requirement list on the deliverable; approvals are per version&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Production 1 → “Completed Wed 12:05” (one line)&lt;/td&gt;&lt;td&gt;Link to Production 1 with its own turnaround&lt;/td&gt;&lt;td&gt;A completed work instance that nothing reopens&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;Approved by you&lt;/span&gt; · waiting for Kona (state 5)&lt;/td&gt;&lt;td&gt;v2 approvals: Denise ✓ · EMG ✓ · “sent to Kona Wed 14:15”&lt;/td&gt;&lt;td&gt;Two approval marks on v2 and one outstanding requirement; no work is running&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span class=&quot;pill good&quot;&gt;Final&lt;/span&gt; — deliverable “Final approved · publish by Fri”&lt;/td&gt;&lt;td&gt;All approvals for v3 recorded; deliverable still open&lt;/td&gt;&lt;td&gt;Approval complete ≠ deliverable complete&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Deliverable &lt;span class=&quot;pill good&quot;&gt;Complete&lt;/span&gt; Fri 12:10&lt;/td&gt;&lt;td&gt;Campaign deliverable board: complete, with the post link&lt;/td&gt;&lt;td&gt;The campaign&#x27;s rule (approved + published by Fri) satisfied; derived, not declared by the record&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Version strip · ✓ you · EMG on v2&lt;/td&gt;&lt;td&gt;Content rail · v2 approvals by name and time&lt;/td&gt;&lt;td&gt;The same marks; the creator sees roles, EMG sees names&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;The EMG frame shows fields Work OS does not have today, all already recorded as gaps in the design pass: a stage an external participant completes, requested vs expected return with an actor, an instruction&#x27;s originator and version reference, and comment visibility. They appear because the creator record cannot be honest without them — not as an implementation decision.&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================================================== --&gt;
&lt;section id=&quot;nouns&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;7 · Distinctions kept, complexity hidden&lt;/div&gt;&lt;h2&gt;Seven nouns, seven plain words — and whose truth each is&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Noun&lt;/th&gt;&lt;th&gt;Where it appears on the record&lt;/th&gt;&lt;th&gt;The creator&#x27;s word for it&lt;/th&gt;&lt;th&gt;What the creator can do to it here&lt;/th&gt;&lt;th&gt;Whose truth it is&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;File / Asset&lt;/td&gt;&lt;td&gt;Media preview, version strip, duration badge&lt;/td&gt;&lt;td&gt;“Original”, “v1”, “Final”&lt;/td&gt;&lt;td&gt;Play, compare, download the final. Never replace or delete.&lt;/td&gt;&lt;td&gt;Bytes: storage; meaning: the lineage&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Content&lt;/td&gt;&lt;td&gt;The page itself: trail, title, state pill&lt;/td&gt;&lt;td&gt;The name they gave it&lt;/td&gt;&lt;td&gt;Rename; otherwise state-dependent actions&lt;/td&gt;&lt;td&gt;The record&#x27;s own: name and lineage only&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Deliverable&lt;/td&gt;&lt;td&gt;One line plus the “Needed for” list in “Where this fits”&lt;/td&gt;&lt;td&gt;“Reel 1 of 2 · Content approved”&lt;/td&gt;&lt;td&gt;Nothing directly; satisfied by approvals and publication&lt;/td&gt;&lt;td&gt;Campaign/deliverable context (architecture pass)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Campaign&lt;/td&gt;&lt;td&gt;The trail, one line in “Where this fits”&lt;/td&gt;&lt;td&gt;“Kona Product Video”&lt;/td&gt;&lt;td&gt;Open it&lt;/td&gt;&lt;td&gt;CRM&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunity&lt;/td&gt;&lt;td&gt;One line, in the creator-visible vocabulary&lt;/td&gt;&lt;td&gt;“Kona — Confirmed”&lt;/td&gt;&lt;td&gt;Open it&lt;/td&gt;&lt;td&gt;CRM&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Work&lt;/td&gt;&lt;td&gt;“Production 1 / 2”, ghost version chips, the status bar&lt;/td&gt;&lt;td&gt;“With EMG”, “Your review”, “Editing again”&lt;/td&gt;&lt;td&gt;Request an edit, add a note, request changes, approve&lt;/td&gt;&lt;td&gt;Work OS&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Intelligence&lt;/td&gt;&lt;td&gt;“What Loop noticed” and the evidence sheet&lt;/td&gt;&lt;td&gt;“Loop noticed…”, “Not yet”&lt;/td&gt;&lt;td&gt;View evidence, dismiss or keep a proposal&lt;/td&gt;&lt;td&gt;Brain / Decision Engine&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================================================== --&gt;
&lt;section id=&quot;verdict&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;8 · Does it still hold?&lt;/div&gt;&lt;h2&gt;What revision 2 shows, and what is left to rule on&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Holds&lt;/h4&gt;&lt;ul&gt;
    &lt;li&gt;Eight states, one page, fixed region order; two new business situations (approval not final; brand feedback via EMG) expressed with no new screen — a checklist, a provenance line and a numbered production.&lt;/li&gt;
    &lt;li&gt;Creative approval, production completion, final approval, publication and deliverable completion are five visibly different moments on the record.&lt;/li&gt;
    &lt;li&gt;Brand feedback is never mistaken for creator feedback or EMG editorial: originator and Loop actor are two facts on the same row, on both seats.&lt;/li&gt;
    &lt;li&gt;The record reads requirements; it never decides them. The two Raw contexts prove the action bar is derived.&lt;/li&gt;
    &lt;li&gt;The four rungs each carry their own basis; “Not yet” survives as a first-class answer.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Left to rule on (specific to this record)&lt;/h4&gt;&lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Approvals per version.&lt;/b&gt; Modelled here as marks on a version: a new version needs every approval again (state 6 resets the list, keeps v2&#x27;s marks in history). Alternative: an approver&#x27;s mark carries over unless the change affects them — simpler for the creator, harder to make honest. Recommendation: per version.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Pill tone for “Approved by you”.&lt;/b&gt; Amber (something still outstanding) rather than green. Confirm.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Submitting a raw Original for approvals without an edit.&lt;/b&gt; The campaign Raw frame offers only “Request an edit”. If a deliverable can be satisfied by an unedited version, a “Submit for approval” action belongs on the same bar. Not designed until confirmed.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Feedback after Final or after publication&lt;/b&gt; (a take-down, a re-cut) starts Production 3 on the same lineage; whether it also re-opens the deliverable&#x27;s requirements is a campaign rule, not a record rule. Out of scope here.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;The brand&#x27;s name.&lt;/b&gt; “Kona” is shown because it is in the campaign&#x27;s name; a campaign whose brand is not designated visible would show “the brand”. Confirm the design-pass designation rule applies.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;“Mark as published” stays manual&lt;/b&gt; with a hand-entered post link (design-pass decision 11); detection from a connected platform later.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Not designed here&lt;/h3&gt;
&lt;p&gt;The Content Library, Upload, the Request an Edit sheet and the Request Changes sheet are mockups 2, 3 and 5. The EMG Requests lane, roster and Person-record creator context are mockups 3 and 4. Analytics and the Feed Analysis are mockup 9.&lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

ol.callouts b{color:var(--d-ink)}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--d-ink);color:var(--d-canvas);font-size:11.5px;font-weight:800}
.frames{display:flex;gap:18px;overflow-x:auto;padding:6px 4px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.frames&gt;*{scroll-snap-align:start}
.hint{font-size:12.5px;color:var(--d-faint);margin:0 0 8px}
.anat{display:grid;grid-template-columns:360px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:820px){.anat{grid-template-columns:1fr}}
.desk-wrap{overflow-x:auto;border:1px solid var(--d-line-strong);border-radius:16px;background:var(--d-surface)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--d-good-soft);color:var(--d-good)}.pill.warn{background:var(--d-warn-soft);color:var(--d-warn)}.pill.neutral{background:var(--d-sunken);color:var(--d-muted)}.pill.accent{background:var(--d-accent-soft);color:var(--d-accent)}
.fig{background:var(--d-surface);border:1px solid var(--d-line);border-radius:14px;padding:14px;overflow-x:auto}
.fig figcaption{font-size:12.5px;color:var(--d-faint);margin-top:8px}
figure{margin:14px 0}
svg text{font-family:var(--d-font);fill:var(--d-body)}
svg .m{font-family:var(--d-mono);font-size:10.5px}
:focus-visible{outline:2px solid var(--d-accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

/* ---------- Loop frames: the product&#x27;s own light system (loop-os.css values), painted explicitly ---------- */
.lf{
  --loop-canvas:#f5f6f6; --loop-surface:#ffffff; --loop-sunken:#eef1f2; --loop-hover:#f1f4f5;
  --loop-line:#dce3e6; --loop-line-strong:#c7d1d6;
  --loop-ink:#0f1c2a; --loop-body:#25333f; --loop-muted:#5a6a76; --loop-faint:#5f6d78;
  --loop-primary:#0e1b2c; --loop-primary-hover:#1c2d42; --loop-on-primary:#ffffff;
  --loop-accent:#1d6e85; --loop-accent-strong:#155a6d; --loop-accent-soft:#e3eff2; --loop-focus:#1d6e85;
  --loop-good:#1d7449; --loop-good-soft:#e1f1e8; --loop-warn:#8a5a00; --loop-warn-soft:#f8efdc; --loop-crit:#ad2a22; --loop-crit-soft:#fae7e5; --loop-neutral:#53616c; --loop-neutral-soft:#eaeef0;
  --loop-avatar:#dbe8ec; --loop-avatar-ink:#1c5a6f; --loop-company:#e6e9f2; --loop-company-ink:#2c3d63;
  --loop-rail:#0e1b2c; --loop-rail-2:#1a2c42; --loop-rail-line:rgba(255,255,255,.09); --loop-rail-text:#c9d3dc; --loop-rail-muted:#8fa0ae; --loop-rail-active:#9fd6e3;
  --loop-radius:14px; --loop-radius-sm:10px;
  color-scheme:light; font-family:var(--d-font); color:var(--loop-body); font-size:14px; line-height:1.5; text-align:left;
}
.lf *{box-sizing:border-box}
.lf a{color:inherit;text-decoration:none}
.lf .loop-trail{margin:0 0 6px;font-size:11.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--loop-muted);display:flex;flex-wrap:wrap;gap:6px}
.lf .loop-trail__sep{opacity:.55}
.lf .loop-title{margin:0;font-size:26px;line-height:1.12;font-weight:750;letter-spacing:-.02em;color:var(--loop-ink);text-wrap:balance}
.lf.desk .loop-title{font-size:30px}
.lf .loop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lf .loop-head__text{min-width:0;flex:1 1 300px}
.lf .loop-head__actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lf .loop-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:650;line-height:1.3;white-space:nowrap}
.lf .loop-pill::before{content:&#x27;&#x27;;width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.lf .loop-pill--good{background:var(--loop-good-soft);color:var(--loop-good)}
.lf .loop-pill--attention{background:var(--loop-warn-soft);color:var(--loop-warn)}
.lf .loop-pill--neutral{background:var(--loop-neutral-soft);color:var(--loop-neutral)}
.lf .loop-pill--info{background:var(--loop-accent-soft);color:var(--loop-accent)}
.lf .loop-pill--sm{font-size:11px;padding:2px 8px}
.lf .loop-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 14px;border-radius:var(--loop-radius-sm);border:1px solid var(--loop-line-strong);background:var(--loop-surface);color:var(--loop-ink);font:inherit;font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer}
.lf .loop-btn--primary{background:var(--loop-primary);border-color:var(--loop-primary);color:var(--loop-on-primary)}
.lf .loop-btn--quiet{border-color:transparent;background:transparent}
.lf .loop-btn[aria-disabled=&quot;true&quot;]{background:var(--loop-sunken);border-color:var(--loop-line);color:var(--loop-faint)}
.lf .loop-btnrow{display:flex;flex-wrap:wrap;gap:8px}
.lf .loop-link{color:var(--loop-accent);font-weight:650;font-size:13.5px}
.lf .loop-panel{background:var(--loop-surface);border:1px solid var(--loop-line);border-radius:var(--loop-radius);padding:16px;position:relative}
.lf.desk .loop-panel{padding:20px}
.lf .loop-panel__title{margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--loop-muted)}
.lf .loop-facts{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:9px 12px;margin:0}
.lf .loop-facts dt{font-size:12.5px;color:var(--loop-muted)}
.lf .loop-facts dd{margin:0;font-size:13.5px;color:var(--loop-ink);font-weight:600;min-width:0;overflow-wrap:anywhere}
.lf .loop-facts dd.q{font-weight:500}
.lf .loop-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--loop-line);border:1px solid var(--loop-line);border-radius:var(--loop-radius);overflow:hidden}
.lf .loop-strip__item{background:var(--loop-surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lf .loop-strip__label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--loop-muted)}
.lf .loop-strip__value{font-size:17px;font-weight:700;color:var(--loop-ink);font-variant-numeric:tabular-nums}
.lf .loop-state{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--loop-radius);border:1px dashed var(--loop-line-strong);background:var(--loop-surface)}
.lf .loop-state__mark{flex:0 0 30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;background:var(--loop-neutral-soft);color:var(--loop-neutral);font-size:13px}
.lf .loop-state__title{margin:0 0 2px;font-size:14px;font-weight:700;color:var(--loop-ink)}
.lf .loop-state__body{margin:0;color:var(--loop-muted);font-size:13px}
.lf .loop-record{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.lf .loop-record__main,.lf .loop-record__rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.lf .loop-activity{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lf .loop-act{border-top:1px solid var(--loop-line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 2px}
.lf .loop-act:first-child{border-top:none}
.lf .loop-act__truth{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--loop-neutral-soft);color:var(--loop-neutral);white-space:nowrap}
.lf .loop-act__truth--communication{background:var(--loop-accent-soft);color:var(--loop-accent)}
.lf .loop-act__truth--state_change,.lf .loop-act__truth--decision{background:var(--loop-company);color:var(--loop-company-ink)}
.lf .loop-act__truth--work{background:var(--loop-good-soft);color:var(--loop-good)}
.lf .loop-act__story{color:var(--loop-ink);font-weight:600;font-size:13px;overflow-wrap:anywhere}
.lf .loop-act__sub{display:block;font-weight:500;color:var(--loop-muted);font-size:12.5px;margin-top:2px}
.lf .loop-act__when{font-size:12px;color:var(--loop-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lf .loop-act--hi{background:var(--loop-accent-soft);border-radius:10px;padding-left:8px;padding-right:8px;margin:4px -6px}
.lf .loop-avatar{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--loop-avatar);color:var(--loop-avatar-ink);font-weight:750;font-size:12px}
.lf .media{position:relative;border-radius:var(--loop-radius);overflow:hidden;background:linear-gradient(165deg,#1b2a3a 0%,#2c3f52 55%,#5f6d78 100%);color:#fff;aspect-ratio:4/5;max-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.lf .media__seg{position:absolute;top:10px;left:10px;display:inline-flex;background:rgba(15,28,42,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px;backdrop-filter:blur(6px)}
.lf .media__seg span{padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:650;color:#dfe7ee}
.lf .media__seg span.on{background:#fff;color:var(--loop-ink)}
.lf .media__badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--loop-ink)}
.lf .media__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--loop-ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.lf .media__bar{height:4px;border-radius:4px;background:rgba(255,255,255,.28);position:relative;margin-top:6px}
.lf .media__bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#fff}
.lf .media__bar em{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--loop-accent);transform:translateX(-50%)}
.lf .media__bar em.done{border-color:var(--loop-good)}
.lf .media__time{display:flex;justify-content:space-between;font-size:11.5px;font-variant-numeric:tabular-nums;color:#e6edf3}
.lf .media__hint{font-size:11.5px;color:#cfd9e2}
.lf .media__scene{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfd9e2;margin-bottom:4px}
.lf .rung{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-top:1px solid var(--loop-line)}
.lf .rung:first-child,.lf .loop-panel__title + .rung{border-top:none;padding-top:0}
.lf .rung__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lf .rung__text{margin:0;font-size:13.5px;color:var(--loop-ink);font-weight:600}
.lf .rung__meta{margin:0;font-size:12px;color:var(--loop-muted)}
.lf .t{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lf .t--fact{background:var(--loop-neutral-soft);color:var(--loop-neutral)}
.lf .t--obs{background:var(--loop-accent-soft);color:var(--loop-accent)}
.lf .callout{position:absolute;top:-9px;left:-9px;z-index:12;width:22px;height:22px;border-radius:50%;background:var(--loop-ink);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff}
.lf .rel{position:relative}
.lf .req{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.lf .req li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--loop-body);align-items:baseline}
.lf .req i{font-style:normal;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--loop-line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--loop-good)}
.lf .req li.done i{background:var(--loop-good-soft);border-color:var(--loop-good)}
.lf .req li.done{color:var(--loop-ink)}
.lf .req li small{color:var(--loop-muted)}
/* notes */
.lf .notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lf .nt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--loop-line);border-radius:10px;background:var(--loop-surface)}
.lf .nt__t{font-family:var(--d-mono);font-size:11.5px;font-weight:700;color:var(--loop-accent);background:var(--loop-accent-soft);padding:2px 7px;border-radius:6px;white-space:nowrap}
.lf .nt--keep .nt__t{color:var(--loop-neutral);background:var(--loop-neutral-soft)}
.lf .nt--done .nt__t{color:var(--loop-good);background:var(--loop-good-soft)}
.lf .nt__b{font-size:13px;color:var(--loop-ink);font-weight:600}
.lf .nt__m{display:block;font-size:11.5px;color:var(--loop-muted);font-weight:500;margin-top:2px}
.lf .nt__x{color:var(--loop-muted);font-size:12px}
.lf .kind{display:inline-flex;border:1px solid var(--loop-line-strong);border-radius:999px;overflow:hidden;font-size:12px}
.lf .kind span{padding:5px 11px;color:var(--loop-body)}
.lf .kind span.on{background:var(--loop-primary);color:#fff;font-weight:650}
.lf .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.lf .field label{font-weight:650;color:var(--loop-body)}
.lf .textarea{border:1px solid var(--loop-line-strong);border-radius:10px;background:var(--loop-surface);padding:10px 12px;min-height:56px;color:var(--loop-ink);font-size:13.5px}
.lf .textarea.ph{color:var(--loop-faint)}
.lf .consequence{border:1px solid var(--loop-line);border-radius:10px;padding:12px;background:var(--loop-sunken);font-size:13px;color:var(--loop-body)}
.lf .consequence b{color:var(--loop-ink)}
.lf .drop{border:1.5px dashed var(--loop-line-strong);border-radius:12px;padding:14px;text-align:center;color:var(--loop-muted);font-size:13px;background:var(--loop-sunken)}
.lf .chk{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;font-size:13px;color:var(--loop-body)}
.lf .chk i{width:16px;height:16px;border:1.5px solid var(--loop-line-strong);border-radius:4px;margin-top:2px}
.lf .chk.on i{background:var(--loop-accent);border-color:var(--loop-accent)}
.lf .radio{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;font-size:13px;color:var(--loop-body)}
.lf .radio i{width:16px;height:16px;border:1.5px solid var(--loop-line-strong);border-radius:50%;margin-top:2px}
.lf .radio.on i{border:5px solid var(--loop-accent)}
.lf .banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--loop-warn-soft);color:var(--loop-warn);font-size:12.5px;font-weight:600}
.lf .toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--loop-body)}
.lf .toggle i{width:30px;height:18px;border-radius:999px;background:var(--loop-line-strong);position:relative;display:inline-block}
.lf .toggle i::after{content:&#x27;&#x27;;position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.lf .toggle.on i{background:var(--loop-accent)}.lf .toggle.on i::after{left:14px}
/* phone shell */
.ph{flex:0 0 340px;width:340px;border:1px solid var(--d-line-strong);border-radius:30px;background:var(--loop-canvas);overflow:hidden;box-shadow:0 18px 48px -24px rgba(15,28,42,.35)}
.ph__cap{font-family:var(--d-font);font-size:12.5px;font-weight:700;color:var(--d-ink);padding:10px 14px 0;text-align:center}
.ph__cap small{display:block;font-weight:500;color:var(--d-faint);font-size:11.5px}
.ph__frame{margin:8px 8px 8px;border-radius:24px;overflow:hidden;background:var(--loop-canvas);border:1px solid var(--loop-line)}
.ph__status{display:flex;justify-content:space-between;font-size:11px;color:var(--loop-muted);padding:6px 16px 0;background:var(--loop-surface)}
.ph__scroll{height:700px;overflow-y:auto;position:relative;background:var(--loop-canvas)}
.lf .loop-mhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;background:var(--loop-surface);border-bottom:1px solid var(--loop-line)}
.lf .loop-sb__menubtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:5px 11px;font-size:13px;font-weight:650;color:var(--loop-ink);background:var(--loop-surface);border:1px solid var(--loop-line-strong);border-radius:var(--loop-radius-sm)}
.lf .loop-sb__menubtn::before{content:&#x27;\2261&#x27;;font-size:18px;line-height:1}
.lf .wordmark{font-weight:800;letter-spacing:-.02em;color:var(--loop-ink);font-size:16px}
.lf .loop-main{padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px}
.lf .titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--loop-muted)}
.lf .actbar{position:sticky;bottom:60px;z-index:6;display:flex;gap:8px;padding:10px 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--loop-line)}
.lf .actbar .loop-btn{flex:1}
.lf .loop-areabar{position:sticky;bottom:0;z-index:7;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--loop-surface);border-top:1px solid var(--loop-line);padding:6px 4px 10px}
.lf .loop-areabar__link{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:11px;font-weight:500;color:var(--loop-muted)}
.lf .loop-areabar__ico{width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;opacity:.75}
.lf .loop-areabar__link.is-active{color:var(--loop-accent);font-weight:700}
.lf .loop-areabar__link.is-active .loop-areabar__ico{opacity:1;background:var(--loop-accent-soft)}
/* sheets */
.lf .sheet{position:absolute;inset:0;z-index:9;background:var(--loop-surface);display:flex;flex-direction:column}
.lf .sheet__sum{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--loop-line);font-weight:700;color:var(--loop-ink);background:var(--loop-surface);z-index:2}
.lf .sheet__sum span{font-size:13px;font-weight:650;color:var(--loop-accent)}
.lf .sheet__sum small{display:block;font-weight:500;color:var(--loop-muted);font-size:12px}
.lf .sheet__body{padding:14px 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.lf .sheet__bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px 14px;background:rgba(255,255,255,.96);border-top:1px solid var(--loop-line)}
.lf .sheet__bar .loop-btn{flex:1}
.lf .dim{position:absolute;inset:0;z-index:8;background:rgba(15,28,42,.38)}
.lf .sheet--half{top:auto;height:auto;max-height:78%;border-radius:18px 18px 0 0;box-shadow:0 -12px 34px rgba(15,28,42,.28);z-index:10}
.lf .sheet--half .sheet__sum{border-radius:18px 18px 0 0}
.lf .sheet .media{aspect-ratio:9/12;max-height:330px;border-radius:12px}
.lf .h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--loop-muted);margin:0 0 8px}
/* desktop shell */
.desk{min-width:1080px;display:grid;grid-template-columns:232px 1fr;background:var(--loop-canvas);font-size:13.5px}
.desk .loop-sidebar{background:var(--loop-rail);color:var(--loop-rail-text);display:flex;flex-direction:column}
.desk .loop-sb__brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--loop-rail-line);color:#fff;font-weight:800;letter-spacing:-.02em}
.desk .loop-sb__os{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--loop-rail-active);border:1px solid var(--loop-rail-line);border-radius:6px;padding:2px 6px}
.desk .loop-sb__group{padding:12px 12px 4px}
.desk .loop-sb__grouplabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--loop-rail-muted);font-weight:700;padding:0 10px 8px}
.desk .loop-sb__link{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--loop-rail-text);font-size:13px;font-weight:500;position:relative}
.desk .loop-sb__link.is-active{background:var(--loop-rail-2);color:#fff;font-weight:650}
.desk .loop-sb__link.is-active::before{content:&#x27;&#x27;;position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--loop-rail-active)}

&lt;div class=&quot;eyebrow&quot;&gt;Loop · Creator Hub · Mockup 2 of 10 · 2026-09-22&lt;/div&gt;
&lt;h1&gt;The edit-review handoff, designed once for both seats&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Mockup #2 is the signature workflow: an edit comes back, the creator reviews it against the previous cut, sends timestamped changes or approves, and the editor answers on the same Production. It is designed as one handoff, not two features. The creator side is a review mode over the approved Content Record; the EMG side is the existing Work OS work detail with the fields that handoff needs. Every rule from Mockup #1 is a constraint here, not a variable.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;Design only. Names, dates and numbers are examples. Content Record semantics (eight states, per-version approvals, stable regions, provenance, the epistemic ladder, the five separate events) are locked and reused, not redesigned. Backend authorities remain unapproved; nothing here assumes a schema.&lt;/div&gt;

&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;2 · Creator · Review mode&lt;/div&gt;&lt;h2&gt;A sheet over the record, not a second page&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Review is a mode of the Content Record: a full-screen sheet (Loop&#x27;s drawer-as-sheet pattern) that puts the player first, keeps “same moment, different cut”, collects timestamped notes as drafts, and ends in one of two decisions. Closing it returns to the record unchanged. Shown for Edit v1 on Tue 22 Sep, 18:20.&lt;/p&gt;
&lt;div class=&quot;anat&quot;&gt;
  &lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;ph__cap&quot;&gt;Phone · Review sheet · regions numbered&lt;/div&gt;&lt;div class=&quot;ph__frame lf&quot;&gt;&lt;div class=&quot;ph__status&quot;&gt;&lt;span&gt;18:20&lt;/span&gt;&lt;span&gt;●●●&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ph__scroll&quot;&gt;

      &lt;div class=&quot;sheet__body&quot;&gt;

        &lt;div class=&quot;loop-btnrow rel&quot;&gt;&lt;span class=&quot;callout&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;loop-btn&quot; style=&quot;flex:1&quot;&gt;Add a note at 0:02&lt;/span&gt;&lt;span class=&quot;loop-btn loop-btn--quiet&quot;&gt;Compare&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;rel&quot;&gt;&lt;span class=&quot;callout&quot;&gt;4&lt;/span&gt;&lt;p class=&quot;h&quot;&gt;What Sam changed&lt;/p&gt;&lt;p style=&quot;margin:0 0 6px;font-size:13.5px;color:var(--loop-ink)&quot;&gt;“Cut the logo intro; Kona at 0:04. Kept your 0:11 beat.”&lt;/p&gt;

            &lt;li class=&quot;nt nt--keep&quot;&gt;&lt;span class=&quot;nt__t&quot;&gt;0:11&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;nt__b&quot;&gt;Keep this beat exactly as it is.&lt;/div&gt;&lt;span class=&quot;nt__m&quot;&gt;Keep&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;nt__x&quot;&gt;Edit&lt;/span&gt;&lt;/li&gt;

          &lt;p class=&quot;rung__meta&quot; style=&quot;margin:8px 0 0&quot;&gt;Notes stay on this phone until you send them. Tap a marker on the timeline to jump to a note.&lt;/p&gt;&lt;/div&gt;

  &lt;div&gt;
    &lt;ol class=&quot;callouts&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;b&gt;Sheet header.&lt;/b&gt; Which version, which record, who returned it and when. Close returns to the record; drafts survive.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;b&gt;Player with note markers.&lt;/b&gt; The segmented control switches versions at the same playhead. Your notes appear as markers on the timeline of the version they were made on; tapping one seeks. The hint under the time names what the other cut shows at this moment.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;b&gt;“Add a note at 0:02”.&lt;/b&gt; Pausing is how you point. The button carries the current time; Compare is the quiet alternative to the segmented control for one-handed use.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;b&gt;What changed.&lt;/b&gt; The editor&#x27;s creator-visible note first, then Loop&#x27;s Observation of the difference — tagged as an Observation with its basis, per the epistemic ladder. Never a judgment.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;b&gt;Your notes (drafts).&lt;/b&gt; Each is a timestamp, a sentence and a kind — &lt;i&gt;Change&lt;/i&gt; or &lt;i&gt;Keep&lt;/i&gt;. A Keep note is an instruction too: it tells the editor what not to touch. Drafts are yours until sent.&lt;/div&gt;&lt;/li&gt;

&lt;div class=&quot;grid2&quot; style=&quot;margin-top:6px&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rules the sheets obey&lt;/h4&gt;&lt;ul&gt;
    &lt;li&gt;A note is a timestamp + a sentence + a kind (Change / Keep); it is a draft until sent, then an instruction with provenance (originated and entered by the creator, refers to that version).&lt;/li&gt;
    &lt;li&gt;Sending never creates a new Production: it reopens stage 1 of the same one. Only feedback after completion starts the next Production (Mockup #1, ruling 4).&lt;/li&gt;
    &lt;li&gt;Approve is per version and says so; the confirmation lists the deliverable&#x27;s requirements verbatim, so creator approval is never mistaken for finality.&lt;/li&gt;
    &lt;li&gt;For independent content the same confirmation reads “This makes v2 the final. Nothing else is needed.” — derived, not a different flow.&lt;/li&gt;
    &lt;li&gt;“Submit for approval” appears only when the deliverable permits an unedited original; the record reads that, it does not decide it.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Desktop adaptation&lt;/h4&gt;&lt;ul&gt;
    &lt;li&gt;Review is the record&#x27;s Compare panel side by side (Mockup #1) with the notes list in the rail and the two decisions in the page head.&lt;/li&gt;
    &lt;li&gt;Notes are markers on the shared scrubber; “Add a note at 0:02” sits inline under it.&lt;/li&gt;
    &lt;li&gt;Request changes and Approve open as drawers on the right; the confirmation content is identical.&lt;/li&gt;
    &lt;li&gt;Nothing exists on desktop that the phone lacks.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Answering: Upload Edit v2&lt;/h3&gt;

&lt;tr&gt;&lt;td&gt;Denise sends changes&lt;/td&gt;&lt;td&gt;Record: &lt;span class=&quot;pill accent&quot;&gt;Changes requested&lt;/span&gt; by you · Production: “Editing again” · her notes verbatim&lt;/td&gt;&lt;td&gt;My Work row “Changes requested · 2 notes” · Set 2 on the work · markers on his timeline&lt;/td&gt;&lt;td&gt;One instruction set (originated + entered by Denise, refers to v1) and one stage event 2 → 1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Priya keeps the expected return&lt;/td&gt;&lt;td&gt;“EMG expects Wed 12:00 · unchanged”&lt;/td&gt;&lt;td&gt;Strip: Expected Wed 12:00 · Left 3 h 55 m&lt;/td&gt;&lt;td&gt;The same two dated fields; a change would be an event with a reason on both&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Sam uploads v2, ticks both notes&lt;/td&gt;&lt;td&gt;“Review Edit v2 — ready” · review sheet: “2 of 2 addressed” with Sam&#x27;s replies&lt;/td&gt;&lt;td&gt;Set 2 “answered by Edit v2” · stage 2 waiting&lt;/td&gt;&lt;td&gt;One Version naming the set it answers, two addressed marks with replies&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Denise approves v2&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;Approved by you&lt;/span&gt; · Needed list: ✓ you · ○ EMG · ○ Kona · ○ published&lt;/td&gt;&lt;td&gt;Stage 2 done · Production 1 completed · approval mark v2 · deliverable still open&lt;/td&gt;&lt;td&gt;One approval mark on v2; the deliverable&#x27;s requirements re-derived&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================================================== --&gt;
&lt;section id=&quot;states&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;5 · States&lt;/div&gt;&lt;h2&gt;A note&#x27;s life, and a review&#x27;s&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A note&lt;/h4&gt;
    &lt;div class=&quot;tbl&quot; style=&quot;margin-top:8px&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;State&lt;/th&gt;&lt;th&gt;Means&lt;/th&gt;&lt;th&gt;Who can change it&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Draft&lt;/td&gt;&lt;td&gt;On the creator&#x27;s device, in this review; markers visible to them only&lt;/td&gt;&lt;td&gt;Creator: edit, delete&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Sent&lt;/td&gt;&lt;td&gt;Part of an instruction set with provenance; immutable&lt;/td&gt;&lt;td&gt;Nobody&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Addressed&lt;/td&gt;&lt;td&gt;Ticked by the editor on the answering version, with a reply&lt;/td&gt;&lt;td&gt;Editor, at upload&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Not addressed&lt;/td&gt;&lt;td&gt;Left unticked at upload, with the editor&#x27;s reason; shown to the creator as such&lt;/td&gt;&lt;td&gt;Editor, at upload&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Superseded&lt;/td&gt;&lt;td&gt;A later note on the same moment of a later version&lt;/td&gt;&lt;td&gt;Derived&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;A review&lt;/h4&gt;
    &lt;div class=&quot;tbl&quot; style=&quot;margin-top:8px&quot;&gt;&lt;table&gt;
      &lt;tr&gt;&lt;th&gt;Situation&lt;/th&gt;&lt;th&gt;The sheet shows&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Latest version, awaiting the creator&lt;/td&gt;&lt;td&gt;Player, notes, both decisions&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;An older version opened&lt;/td&gt;&lt;td&gt;Banner “A newer version exists (v2) — you&#x27;re looking at v1”; decisions hidden; notes read-only&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Version still uploading or processing&lt;/td&gt;&lt;td&gt;Card state from the library (Uploading → Processing → Ready); the sheet waits&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Playback fails&lt;/td&gt;&lt;td&gt;Metadata and “Loop couldn&#x27;t play this version · Retry · Download”; Approve disabled until it plays (fail closed)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Draft notes exist and the creator closes&lt;/td&gt;&lt;td&gt;Drafts kept; the record&#x27;s action bar reads “Review edit · 2 notes not sent”&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;Approval already given on this version&lt;/td&gt;&lt;td&gt;Approve becomes “Approved by you · Wed 12:05”; Request changes stays available and would start the next Production if this one has completed&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================================================== --&gt;
&lt;section id=&quot;constraints&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;6 · Constraints honoured&lt;/div&gt;&lt;h2&gt;Mockup #1 rulings, as applied here&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Ruling / invariant&lt;/th&gt;&lt;th&gt;Where it bites in this handoff&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Approvals are per Version&lt;/td&gt;&lt;td&gt;The Approve sheet says “for this version only” and shows the mark landing on v2; a v3 would show the list reset with v2&#x27;s mark kept in history.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;“Approved by you” stays amber&lt;/td&gt;&lt;td&gt;After approving, the record header and the Approve button state are amber until every requirement is ticked.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Submit for approval when the deliverable permits&lt;/td&gt;&lt;td&gt;Sheet E: the Raw record grows a second action, derived from the deliverable; no Production is started; a later change request starts Production 1.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Brand naming follows designation&lt;/td&gt;&lt;td&gt;Sets originated by a brand carry the campaign&#x27;s creator-visible name or “Brand feedback via EMG”; Sam&#x27;s replies never expose CRM knowledge.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Manual publish&lt;/td&gt;&lt;td&gt;Untouched; publication is not part of this handoff.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Five separate events&lt;/td&gt;&lt;td&gt;The Approve sheet lists Production completion, creator approval and the outstanding requirements as different lines; publication and deliverable completion are not mentioned as consequences of approving.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Region order, plain words&lt;/td&gt;&lt;td&gt;Review is a sheet, so the record&#x27;s order is untouched; “Production”, “What Sam changed”, “Your notes”.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Epistemic ladder&lt;/td&gt;&lt;td&gt;“What changed” is an Observation with its basis; nothing in the review is a judgment by Loop.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================================================== --&gt;
&lt;section id=&quot;verdict&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;7 · Left to rule on&lt;/div&gt;&lt;h2&gt;Decisions this handoff surfaces&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Proposed here — confirm or change&lt;/h4&gt;&lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Per-note addressed marks with a reply.&lt;/b&gt; The editor answers each note at upload; the creator sees “n of m addressed”. Recommendation: keep — it is what makes the second review short.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Keep notes.&lt;/b&gt; A note kind that says “don&#x27;t touch this”. Recommendation: keep; it prevents the most common regression.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Drafts live on the device until sent.&lt;/b&gt; Cheap and private; the cost is that a review started on a phone can&#x27;t be finished on a desktop. Alternative: creator-private server drafts. Recommendation: device drafts for v1, server drafts when desktop review is common.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;“Then: save as draft version”&lt;/b&gt; for editors — a version the creator can&#x27;t see yet. Recommendation: keep; without it editors upload to their own machines.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Open&lt;/h4&gt;&lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Can EMG decline or redirect a change request&lt;/b&gt; (out of the deliverable&#x27;s scope, or a brand constraint)? Proposed: a “Needs a conversation” event that pauses the expected return and posts a creator-visible update. Not designed until confirmed.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Approve with notes.&lt;/b&gt; Recommendation: no — notes are changes, approval is clean; a “note that isn&#x27;t a change” goes through Add a note on the record.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Reviewing on someone&#x27;s behalf&lt;/b&gt; (a manager, a co-creator). Out of scope for v1, as in the design pass.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Range notes&lt;/b&gt; (“until 0:06”) — kept minimal; frame capture or drawn regions are later.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;Not designed here&lt;/h3&gt;
&lt;p&gt;Request an Edit (the four-step start of a Production) and the EMG Requests lane are Mockup 3. Home&#x27;s “Things that need you” and the Person record&#x27;s creator context are Mockup 4. The Library and Upload are Mockup 5.&lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')),panels=[].slice.call(document.querySelectorAll('.panel'));
  function fit(f){try{var d=f.contentDocument;if(d&&d.documentElement){f.style.height=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px';}}catch(e){}}
  function show(k){tabs.forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===k?'true':'false');});panels.forEach(function(p){p.hidden=p.dataset.p!==k;if(!p.hidden){var f=p.querySelector('iframe');setTimeout(function(){fit(f);},50);}});if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);window.scrollTo(0,0);}
  tabs.forEach(function(t){t.addEventListener('click',function(){show(t.dataset.p);});});
  panels.forEach(function(p){var f=p.querySelector('iframe');f.addEventListener('load',function(){fit(f);setTimeout(function(){fit(f);},600);});});
  window.addEventListener('resize',function(){panels.forEach(function(p){if(!p.hidden)fit(p.querySelector('iframe'));});});
  var k=(location.hash||'#pass').slice(1);if(!panels.some(function(p){return p.dataset.p===k;}))k='pass';show(k);
})();
</script>
