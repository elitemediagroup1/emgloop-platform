&lt;div class=&quot;eyebrow&quot;&gt;Loop · Creator Hub · first design pass · 2026-09-22&lt;/div&gt;
&lt;h1&gt;One business, two seats: the creator&#x27;s and EMG&#x27;s, over the same objects&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Creator Hub is the environment where a creator and EMG run the creator&#x27;s business together. This pass defines the product and the experience — both the creator seat and EMG&#x27;s Creator Operations seat — grounded in what Loop already is. It designs nothing that would become a second authority. Where today&#x27;s backend cannot support a screen, the gap is named, not invented around.&lt;/p&gt;
&lt;div class=&quot;strip&quot;&gt;
  &lt;div&gt;&lt;b&gt;Status&lt;/b&gt;&lt;span&gt;Design definition for approval. Nothing built.&lt;/span&gt;&lt;/div&gt;
  &lt;div&gt;&lt;b&gt;Shape&lt;/b&gt;&lt;span&gt;One Loop shell · two authorized projections&lt;/span&gt;&lt;/div&gt;
  &lt;div&gt;&lt;b&gt;Authorities&lt;/b&gt;&lt;span&gt;CRM · Work OS · Brain · Storage · Loop meaning&lt;/span&gt;&lt;/div&gt;
  &lt;div&gt;&lt;b&gt;New creator concepts&lt;/b&gt;&lt;span&gt;Content · Asset/Version · Deliverable · Earnings ledger · Social evidence&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;The one rule that shapes everything below: &lt;b&gt;the creator and EMG never look at two copies.&lt;/b&gt; They look at the same Opportunity, the same Work, the same Version chain, the same ledger row — through different authorized projections with different actions. Synchronization is a property of sharing the object, not a process.&lt;/div&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s1&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 1&lt;/div&gt;&lt;h2&gt;What Creator Hub is, and where it sits in Loop&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Loop is an AI-first operating system for customer-facing businesses; the CRM, Work OS, Brain and the source connections are its organs. EMG&#x27;s creator business is one such business, and the creator is its most important external participant. Creator Hub is therefore not a module beside CRM or Work — it is a &lt;b&gt;participant projection&lt;/b&gt;: the set of surfaces, states and actions Loop composes for a person whose participation is &quot;managed creator&quot;, plus the internal surfaces EMG uses to operate that creator. This is exactly the direction the UI architecture record already states (&quot;responsive projections composed for a participant according to identity, membership, participation, and permissions&quot;) and it keeps decision C-02&#x27;s line: no second Creator application, no second Opportunity, task, campaign or intelligence system.&lt;/p&gt;
&lt;p&gt;The creator should be able to answer eight questions without understanding any of that: what&#x27;s happening, what&#x27;s developing, what EMG needs from me, what am I working on, where is it in production, how did the published work do, what is Loop learning about what works for me, and what have I earned versus what I can actually move. EMG should be able to answer the mirror image for each creator and across all creators: what needs us, what needs them, what is due, what is in production, what is performing, what is owed.&lt;/p&gt;

&lt;h3&gt;What exists today (verified on &lt;span class=&quot;mono&quot;&gt;main@88d1a9c&lt;/span&gt;)&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Capability&lt;/th&gt;&lt;th&gt;Today&lt;/th&gt;&lt;th&gt;Notes for the design&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Design system and shell&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt;&lt;/td&gt;&lt;td&gt;One global &lt;code&gt;--loop-*&lt;/code&gt; system: navy rail, light canvas, teal accent, Inter; mobile = light header, Menu sheet, fixed five-area bar. Primitives in &lt;code&gt;_loop-os&lt;/code&gt; (PageHead, SummaryStrip, RecordLayout, Panel, Facts, ContextDrawer, StatePill, StateBlock, ActivityList, Subject Display). Creator Hub renders on this foundation, not a skin.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator identity and sign-in&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;gap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;CREATOR&lt;/code&gt; exists as a workspace role but nothing sets it; &lt;code&gt;SystemRole&lt;/code&gt; has no creator value; one org per login; C-02 says external participant authentication is &quot;not authorized&quot;. A managed creator is &quot;a Person with creator participation and capability&quot; (Party, TALENT_REPRESENTATION Relationship). This is decision #1 in §15.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Transitional &lt;code&gt;/app/creator&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;part&quot;&gt;shell only&lt;/span&gt;&lt;/td&gt;&lt;td&gt;An inert &quot;Upload Video&quot; page (old &lt;code&gt;ds-*&lt;/code&gt; classes) and an honest Unavailable catch-all. Reusable as the route root; nothing else to keep.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunity, Campaign&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;contract locked, unbuilt&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Shapes are decided (OPEN/CLOSED_WON/CLOSED_LOST + org-configured versioned stage sets; human forecast only; Campaign DRAFT→AGREED→ACTIVE→PAUSED→ENDED→CANCELLED; &quot;creator deliverables&quot; named as an execution domain). Nav items are marked &lt;em&gt;soon&lt;/em&gt;. Creator Hub designs against the locked shape.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Work OS&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Blueprint → WorkInstance → WorkStage (pending/…/completed) → WorkAssignment (a user), stage events, comments, notifications (&lt;code&gt;next_action_ready&lt;/code&gt;, &lt;code&gt;assigned&lt;/code&gt;, &lt;code&gt;completed&lt;/code&gt;, &lt;code&gt;approval_needed&lt;/code&gt;); My Work, Team Work, Start work from a blueprint. No external actor, no requested-vs-committed turnaround, no attachments, dormant &lt;code&gt;requiresApproval&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Employee-private work items (&quot;Needs you&quot;)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt;&lt;/td&gt;&lt;td&gt;WorkItem (NEEDS_YOU/WAITING_ON_THEM/GONE_QUIET/FYI), append-only observations, Home &quot;Needs you&quot; panel. The pattern Creator Home&#x27;s &quot;Things that need you&quot; should reuse — with the creator as the principal.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Brain / Decision Engine / Findings&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Cases (NEEDS_REVIEW → ASSIGNED → WATCHING → RESOLVED/DISMISSED, outcomes with reasons), append-only evidence with limitations, Findings (accept/reject), Recommendations (select/dismiss/revise), result standings NON_AUTHORITATIVE/PROPOSED, evidence authorities already include &lt;code&gt;CREATOR_HUB&lt;/code&gt;. A creator-onboarding review already fires on a TALENT_REPRESENTATION relationship becoming ACTIVE and waits for &quot;creator context&quot; nothing owns yet.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Governed AI runtime&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Tasks by name, validated structured outputs, usage ledger, budgets. Content intelligence producers would be new tasks on this runtime — never a second AI path.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Object storage, uploads, versions&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;gap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;No S3, no presigned uploads, no asset or version model anywhere.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Social accounts and performance&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;gap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Source connections exist only for employee sources (Google, Teams, Telegram). No creator platform connection, no performance evidence.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Earnings, compensation, payout&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;gap&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Nothing. Revenue pages are CallGrid revenue. The CRM record assigns &quot;transactions, invoices, payment and settlement&quot; to Accounting, which does not exist yet.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s2&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 2&lt;/div&gt;&lt;h2&gt;The objects, who owns each, and how they reference one another&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;File ≠ Content ≠ Deliverable ≠ Campaign ≠ Opportunity ≠ Work ≠ Intelligence. They reference each other; none is another. The table is the design&#x27;s contract with the later architecture pass: every screen in this document draws only from these nouns, and each noun has exactly one home.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Noun&lt;/th&gt;&lt;th&gt;Authority&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Creator Hub&#x27;s relationship to it&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator (Person + participation)&lt;/td&gt;&lt;td&gt;CRM Party + Relationship (TALENT_REPRESENTATION)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Projects it as &quot;you&quot;; creator-editable profile fields are creator-domain attributes hung off the Person, never a second person record.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunity&lt;/td&gt;&lt;td&gt;CRM&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;unbuilt (locked shape)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Creator-safe projection of category + stage, mapped through a declared visibility (§9.4). Creator never edits it.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Campaign&lt;/td&gt;&lt;td&gt;CRM&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;unbuilt (locked shape)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Creator sees the agreed program, its lifecycle state and its deliverables; never its commercial terms unless designated visible.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Deliverable&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;new&quot;&gt;Creator domain (to establish)&lt;/span&gt; — the CRM record already names &quot;creator deliverables&quot; as execution truth owned outside CRM&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;new&lt;/span&gt;&lt;/td&gt;&lt;td&gt;What the creator owes on a Campaign: type, due, status, the Content that fulfils it. The join between commercial intent and creator execution.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Content&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;new&quot;&gt;Creator domain (to establish)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;new&lt;/span&gt;&lt;/td&gt;&lt;td&gt;A creator&#x27;s piece of work through its life: raw → edited → approved → published. Owns lifecycle state, associations (Campaign, Deliverable, Work, Opportunity), publication state, and the Version chain.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Asset / Version&lt;/td&gt;&lt;td&gt;Bytes: object storage. Meaning: Loop (creator domain)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;new&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Every file is a Version of a Content with type, uploader, time, producing Work, preceding instructions, approval and publication marks. Never overwritten.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Work (edit requests, production)&lt;/td&gt;&lt;td&gt;Work OS&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt; &lt;span class=&quot;part&quot;&gt;needs external-actor + turnaround fields&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&quot;Request an Edit&quot; starts a WorkInstance from an Editing blueprint; creator review and change requests are stage events on that same instance. Creator Tasks are a projection of assignments and stage state.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Intelligence (facts, findings, recommendations)&lt;/td&gt;&lt;td&gt;Brain / Decision Engine&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;have&quot;&gt;exists&lt;/span&gt; &lt;span class=&quot;part&quot;&gt;no content producers&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Creator Hub renders findings with their evidence where a decision is made. Content features would be evidence rows produced by governed tasks; nothing scores.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Performance (views, reach, engagement)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;new&quot;&gt;Social source evidence (to establish)&lt;/span&gt; — a measurement source like CallGrid&#x27;s&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;new&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Attached to a Published Version by platform and post id. Analytics is a read over it; Intelligence interprets it.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Earnings (compensation and payment state)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;new&quot;&gt;Loop commercial/payment ledger (to establish)&lt;/span&gt;; rails via a payout provider later&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;new&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Append-only entries that trace Opportunity → Campaign → Deliverable → payment event; EMG release is a governed act; the provider holds destinations and transfers.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Social account&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;new&quot;&gt;Creator connection (to establish)&lt;/span&gt;, modelled on SourceConnection&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;new&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Connected by the creator on Profile; a per-creator provider connection with state, never credentials in Loop tables in the clear.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s3&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 3&lt;/div&gt;&lt;h2&gt;Information architecture and navigation&lt;/h2&gt;&lt;/header&gt;
&lt;h3&gt;Creator seat&lt;/h3&gt;
&lt;p&gt;Seven areas, exactly as briefed: &lt;b&gt;Home · Opportunities · Content · Analytics · Tasks · Earnings · Profile&lt;/b&gt;. They live in the one Loop shell under the transitional root &lt;code&gt;/app/creator/…&lt;/code&gt;, listed in &lt;code&gt;LOOP_NAV&lt;/code&gt; as a group offered only to the creator authority — the same registry, filtered, never a second menu.&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h4&gt;Mobile: the fixed five-area bar&lt;/h4&gt;
&lt;p&gt;Loop&#x27;s mobile shell puts five operating areas in a fixed bottom bar. The creator&#x27;s five are the five things a thumb reaches for daily: &lt;b&gt;Home · Content · Opportunities · Tasks · Earnings&lt;/b&gt;.&lt;/p&gt;
&lt;ul class=&quot;tight&quot;&gt;
&lt;li&gt;&lt;b&gt;Analytics&lt;/b&gt; is one tap from Home (the audience number) and from Content&#x27;s &lt;em&gt;Published&lt;/em&gt; filter, and sits in the Menu sheet. It is a reading surface, not a daily action.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Profile&lt;/b&gt; is the avatar in the header — where Loop already puts the person — and the Menu sheet.&lt;/li&gt;
&lt;li&gt;Upload and Request an Edit are actions inside Content, not areas.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;
&lt;h4&gt;Desktop: the navy rail&lt;/h4&gt;
&lt;p&gt;All seven areas as one rail group, Profile also on the person block at the rail&#x27;s foot. Desktop adds density, not features: two-column records (RecordLayout main + rail), tables instead of card lists where a list is long, side-by-side version comparison.&lt;/p&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Routes&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;mono&quot;&gt;/app/creator&lt;/span&gt; (Home) · &lt;span class=&quot;mono&quot;&gt;/opportunities/[id]&lt;/span&gt; · &lt;span class=&quot;mono&quot;&gt;/content/[id]&lt;/span&gt; · &lt;span class=&quot;mono&quot;&gt;/content/[id]/versions/[v]&lt;/span&gt; · &lt;span class=&quot;mono&quot;&gt;/analytics&lt;/span&gt; · &lt;span class=&quot;mono&quot;&gt;/tasks&lt;/span&gt; · &lt;span class=&quot;mono&quot;&gt;/earnings/[campaignId]&lt;/span&gt; · &lt;span class=&quot;mono&quot;&gt;/profile&lt;/span&gt;&lt;/dd&gt;
&lt;dt&gt;Guard&lt;/dt&gt;&lt;dd&gt;Every page calls &lt;span class=&quot;mono&quot;&gt;requireWorkspace(&#x27;CREATOR&#x27;)&lt;/span&gt; itself, as the tree already does — once the creator authority is real (§15, decision 1).&lt;/dd&gt;
&lt;/dl&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;EMG seat (Creator Operations)&lt;/h3&gt;
&lt;p&gt;Per decision C-02, internal creator administration is &lt;b&gt;Operations → Creators&lt;/b&gt;. This pass keeps that and answers the harder question — which of the twenty-odd EMG concerns need a Creator Operations surface, and which compose or deep-link into surfaces Loop already has. Section 10 gives the full map; the shape is:&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Surface&lt;/th&gt;&lt;th&gt;Where&lt;/th&gt;&lt;th&gt;New?&lt;/th&gt;&lt;th&gt;What it is&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creators roster&lt;/td&gt;&lt;td&gt;Operations → Creators (&lt;span class=&quot;mono&quot;&gt;/app/admin/creator-hub&lt;/span&gt;, already in &lt;code&gt;LOOP_NAV&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;new&quot;&gt;new list&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Every managed creator (Persons with an ACTIVE TALENT_REPRESENTATION), with the four counts that mean &quot;needs us / needs them / due / in production&quot;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Individual creator overview&lt;/td&gt;&lt;td&gt;The CRM &lt;b&gt;Person record&lt;/b&gt;, with a creator-participation panel and a &quot;Creator&quot; context tab&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;part&quot;&gt;compose into existing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Not a new page. The Person record already composes identity, relationships, Opportunities, Campaigns, open work, activity and intelligence; the creator seat&#x27;s objects are the same objects, so the EMG overview is the Person record wearing its creator context.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Cross-creator operating view&lt;/td&gt;&lt;td&gt;Work OS &lt;b&gt;Team Work&lt;/b&gt; (workload, due, assignments) + a &lt;b&gt;Creator requests&lt;/b&gt; lane in Operations → Creators&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;part&quot;&gt;extend existing + one new lane&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Editing workload, deadlines and turnaround commitments are Work OS facts and belong in Team Work filtered by the Editing blueprint. Incoming requests, items awaiting EMG, items awaiting creators and payment actions are the one cross-creator lane that has no home today.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editing work view&lt;/td&gt;&lt;td&gt;Work OS &lt;b&gt;work detail&lt;/b&gt; (&lt;span class=&quot;mono&quot;&gt;/app/admin/work/[id]&lt;/span&gt;, &lt;span class=&quot;mono&quot;&gt;/app/employee/work/[id]&lt;/span&gt;)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;part&quot;&gt;extend existing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The editor works here: creator, assets, instructions, references, campaign context, requested vs committed turnaround, upload of the next Version. Same record the creator&#x27;s &quot;Editing request detail&quot; projects.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Commercial and payment state&lt;/td&gt;&lt;td&gt;CRM Opportunity/Campaign records (commercial) + Earnings ledger detail (payment)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;gap&quot;&gt;both unbuilt&lt;/span&gt;&lt;/td&gt;&lt;td&gt;EMG edits commercial truth in CRM; releases funds through a governed ledger action; the creator&#x27;s Earnings page is the projection.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s4&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 4&lt;/div&gt;&lt;h2&gt;Screen and experience map&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Type legend — &lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt; a top-level area with its own route · &lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt; a detail page composed from authorities · &lt;span class=&quot;pill good&quot;&gt;Sheet&lt;/span&gt; a short workflow that opens over the current page (a drawer on desktop, a full-height sheet on phones) · &lt;span class=&quot;pill warn&quot;&gt;Section&lt;/span&gt; a nested state inside a record, reachable by a tab or scroll, with its own anchor.&lt;/p&gt;

&lt;h3&gt;Creator seat&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Experience&lt;/th&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Composes&lt;/th&gt;&lt;th&gt;Primary actions&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator Home&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Snapshot (social evidence, CRM, ledger) · Things that need you (Work OS + WorkItems + setup) · Active Opportunities (CRM projection) · Content in progress (Content) · Latest intelligence (Brain)&lt;/td&gt;&lt;td&gt;Tap-through only&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunities&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;CRM Opportunity + Campaign projections, grouped by creator-visible state&lt;/td&gt;&lt;td&gt;Open&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunity Detail&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Overview · Campaign · Deliverables · Timeline · Files · Your tasks · Production · Payment · Updates&lt;/td&gt;&lt;td&gt;Open a deliverable, open content, open a task; no commercial edits&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Content Library&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Content and Versions, filters All / Videos / Photos / Campaigns / In production / Published&lt;/td&gt;&lt;td&gt;Upload · Request an Edit · Open&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Content / Asset Detail&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Preview · Status · Context · Versions · Intelligence · Performance · Actions&lt;/td&gt;&lt;td&gt;State-dependent: Request an Edit · Review edit · Request changes · Approve · Mark published · Analyze&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Upload Content / Deliverable&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill good&quot;&gt;Sheet&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Object storage upload → new Content or new Version; optional Deliverable target&lt;/td&gt;&lt;td&gt;Pick file(s) · name · attach to campaign/deliverable · Upload&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Request an Edit&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill good&quot;&gt;Sheet&lt;/span&gt; (4 steps)&lt;/td&gt;&lt;td&gt;Source → Instructions → References → Context &amp;amp; requested return; submit starts Work&lt;/td&gt;&lt;td&gt;Submit request&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editing Request Detail&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;Section&lt;/span&gt; of Content Detail (Production)&lt;/td&gt;&lt;td&gt;Work OS instance projection: stage, assignee (EMG name only), requested vs expected turnaround, instructions history&lt;/td&gt;&lt;td&gt;Open review when ready&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator Edit Review&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt; (Version view)&lt;/td&gt;&lt;td&gt;Version preview with compare-to-previous, the change request it answered, the editor&#x27;s note&lt;/td&gt;&lt;td&gt;Approve · Request changes&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Request Changes&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill good&quot;&gt;Sheet&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Notes, optional timestamped points, optional reference; appends to the same Work&lt;/td&gt;&lt;td&gt;Send to EMG&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Revision History&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;Section&lt;/span&gt; of Content Detail (Versions)&lt;/td&gt;&lt;td&gt;The full chain with who/when/which Work/which instructions/approved/published marks&lt;/td&gt;&lt;td&gt;Open any version · Compare two&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Pre-publish intelligence&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;Section&lt;/span&gt; of Content Detail (before publication)&lt;/td&gt;&lt;td&gt;Findings about this content versus the creator&#x27;s own history, with evidence&lt;/td&gt;&lt;td&gt;View evidence&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Post-publish intelligence&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;Section&lt;/span&gt; of Content Detail (after publication)&lt;/td&gt;&lt;td&gt;What happened versus what was expected; version-change findings&lt;/td&gt;&lt;td&gt;View evidence&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Single Content Analysis&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt; reached from Content Detail &quot;Analyze&quot;&lt;/td&gt;&lt;td&gt;Facts · observations · interpretations · recommendations for one piece, each with evidence rows and limitations&lt;/td&gt;&lt;td&gt;Read only&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Feed Analysis&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt; reached from Analytics&lt;/td&gt;&lt;td&gt;Patterns across the creator&#x27;s published work (recurring characters, formats, hooks, length, posting time…), each a Finding with evidence&lt;/td&gt;&lt;td&gt;Read only&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Analytics&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Social evidence across platforms and windows; top content; intelligence explanations&lt;/td&gt;&lt;td&gt;Filter · open the Content behind a point&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Tasks&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Needs attention · Upcoming · Completed — projection of Work OS assignments/stages, WorkItems, and setup prompts&lt;/td&gt;&lt;td&gt;Open the object where the action belongs&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Earnings&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Available balance · Transfer · Expected / Pending / Available / Paid YTD · history&lt;/td&gt;&lt;td&gt;Transfer funds (when the provider exists)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Campaign Payment Detail&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill neutral&quot;&gt;Record&lt;/span&gt;&lt;/td&gt;&lt;td&gt;One campaign&#x27;s compensation trace: deliverables, entries, states, dates&lt;/td&gt;&lt;td&gt;Read only&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Available Balance · Transfer Funds · Transfer History&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill good&quot;&gt;Sheet&lt;/span&gt; / &lt;span class=&quot;pill warn&quot;&gt;Section&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Provider-backed: destination, amount, status, retries&lt;/td&gt;&lt;td&gt;Transfer&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Payout Setup&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill good&quot;&gt;Sheet&lt;/span&gt; from Profile / Earnings&lt;/td&gt;&lt;td&gt;Provider onboarding (identity, destination) — Loop stores state, never bank details&lt;/td&gt;&lt;td&gt;Start · Resume&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Profile&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Creator information · profile · social connections · categories · audience · rates (where designated) · payout · documents · notifications · preferences&lt;/td&gt;&lt;td&gt;Edit creator-owned fields; connect accounts&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;EMG seat&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Experience&lt;/th&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Lives in&lt;/th&gt;&lt;th&gt;Primary actions&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creators roster&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill accent&quot;&gt;Screen&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Operations → Creators&lt;/td&gt;&lt;td&gt;Open creator · filter by needs-us / needs-them / due&lt;/td&gt;&lt;/tr&gt;

&lt;/figure&gt;

&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;J1 · Review and approve an edit&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;Home → &quot;Review EMG Edit v2 — ready&quot; &lt;span class=&quot;auth&quot;&gt;WorkItem ← Work stage event&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Opens the Content record on the v2 version &lt;span class=&quot;auth&quot;&gt;Content / Version&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Plays v2; toggles Compare to Original at the same timestamp &lt;span class=&quot;auth&quot;&gt;Version chain&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Approve → v2 becomes Approved Final; the Work stage completes; the WorkItem resolves &lt;span class=&quot;auth&quot;&gt;Content · Work OS · WorkItem&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;If a Deliverable is linked, it is marked fulfilled by v2 &lt;span class=&quot;auth&quot;&gt;Deliverable (creator domain)&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;J2 · Request an edit&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;Content → Request an Edit (or from any raw Content&#x27;s actions)&lt;/li&gt;
&lt;li&gt;Source: pick an existing Version or upload new &lt;span class=&quot;auth&quot;&gt;Storage + Version&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Instructions, references (Versions or links), optional Campaign/Deliverable &lt;span class=&quot;auth&quot;&gt;Content associations&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Requested return: date and time &lt;span class=&quot;auth&quot;&gt;requested turnaround (Work OS field, new)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Submit → a WorkInstance from the Editing blueprint, stage Submitted, creator visible &lt;span class=&quot;auth&quot;&gt;Work OS&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;EMG sets expected turnaround → reflected on the request and on Tasks/Upcoming &lt;span class=&quot;auth&quot;&gt;Work OS&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;J3 · Request changes and receive the next version&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;From Edit Review → Request changes (notes, optional timestamped points)&lt;/li&gt;
&lt;li&gt;The same Work reopens: stage Creator Review → Changes Requested → Editing &lt;span class=&quot;auth&quot;&gt;Work OS stage events&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Editor uploads v3 against the same chain; stage → Creator Review &lt;span class=&quot;auth&quot;&gt;Version · Work OS&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Creator gets &quot;v3 ready for review&quot; — the same WorkItem re-detected, never a duplicate&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;J4 · Opportunity to confirmed campaign to tasks&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;Home shows a new Active Opportunity at &quot;Brand interest&quot; &lt;span class=&quot;auth&quot;&gt;CRM Opportunity (creator-visible projection)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;EMG moves it through Pitching / Negotiating internally; the creator sees only designated states and updates&lt;/li&gt;
&lt;li&gt;Confirmed → EMG creates a Campaign and declares Deliverables &lt;span class=&quot;auth&quot;&gt;CRM Campaign · Deliverables&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Deliverables appear as Tasks/Upcoming with due dates; each links to a Content slot&lt;/li&gt;
&lt;li&gt;Upload deliverable → Request an Edit if needed → approve → fulfilled&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;J5 · Publish, perform, learn&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;Approved Final → creator marks it published and connects the post (platform, url) &lt;span class=&quot;auth&quot;&gt;Published Version&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Performance attaches from the connected platform &lt;span class=&quot;auth&quot;&gt;social evidence&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Analytics reflects it; tapping the spike opens the Content record&lt;/li&gt;
&lt;li&gt;Brain produces a Finding about this creator from eligible evidence &lt;span class=&quot;auth&quot;&gt;Decision Engine&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Home / Content / Analytics show the finding with &quot;View evidence&quot;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;J6 · Get set up, get paid&lt;/h4&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;Home &quot;Things that need you&quot;: Connect Instagram · Complete payout setup &lt;span class=&quot;auth&quot;&gt;setup prompts derived from Profile state&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Profile → Social accounts → connect (provider consent) &lt;span class=&quot;auth&quot;&gt;creator connection&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Earnings shows Expected as campaigns confirm; Pending as they complete; Received; then Available once an authorized EMG user releases &lt;span class=&quot;auth&quot;&gt;ledger&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Transfer funds → provider transfer → Transfer pending → Paid &lt;span class=&quot;auth&quot;&gt;payout provider&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s6&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 6&lt;/div&gt;&lt;h2&gt;Creator ↔ EMG workflow handoffs&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Every handoff is an event on one object. The columns show what each seat sees of it and what the creator-visible update is — an intentional projection, never the raw record.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Event&lt;/th&gt;&lt;th&gt;Object that changes (authority)&lt;/th&gt;&lt;th&gt;EMG sees&lt;/th&gt;&lt;th&gt;Creator sees&lt;/th&gt;&lt;th&gt;Creator-visible update&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator submits an edit request&lt;/td&gt;&lt;td&gt;WorkInstance created, stage Submitted (Work OS); associations on Content&lt;/td&gt;&lt;td&gt;Requests lane + Team Work: creator, source Version, instructions, references, campaign context, requested return&lt;/td&gt;&lt;td&gt;Content → Production: &quot;Submitted · requested by Fri 3 PM&quot;&lt;/td&gt;&lt;td&gt;system: &quot;Request received&quot;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EMG assigns and sets expected turnaround&lt;/td&gt;&lt;td&gt;WorkAssignment; expected turnaround (Work OS, new field)&lt;/td&gt;&lt;td&gt;Work detail; workload&lt;/td&gt;&lt;td&gt;&quot;Assigned · expected Fri 5 PM&quot; (assignee first name only)&lt;/td&gt;&lt;td&gt;system: &quot;EMG expects to return this by …&quot;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editor uploads Edit v1, completes stage&lt;/td&gt;&lt;td&gt;Version appended (producedBy Work); stage → Creator Review&lt;/td&gt;&lt;td&gt;Work detail shows the Version and the stage&lt;/td&gt;&lt;td&gt;WorkItem &quot;Review EMG Edit v1 — ready&quot;; Content Detail action Review edit&lt;/td&gt;&lt;td&gt;system + optional editor note (creator-visible)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator requests changes&lt;/td&gt;&lt;td&gt;Stage event Creator Review → Changes Requested → Editing on the &lt;em&gt;same&lt;/em&gt; Work; notes stored as the next instruction set&lt;/td&gt;&lt;td&gt;Work reopens in My Work with the change request in the instruction history&lt;/td&gt;&lt;td&gt;&quot;Changes requested · back to EMG&quot;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator approves&lt;/td&gt;&lt;td&gt;Version marked Approved Final; stage completes; Work completes; Deliverable fulfilled (creator domain)&lt;/td&gt;&lt;td&gt;Work completes; Campaign deliverable board shows fulfilled&lt;/td&gt;&lt;td&gt;Content status Approved; task completes&lt;/td&gt;&lt;td&gt;system: &quot;Approved — thank you&quot;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator publishes and connects the post&lt;/td&gt;&lt;td&gt;Published Version (platform, post id, publishedAt)&lt;/td&gt;&lt;td&gt;Campaign deliverable shows Published; performance begins&lt;/td&gt;&lt;td&gt;Content status Published; Performance section appears&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EMG advances an Opportunity&lt;/td&gt;&lt;td&gt;CRM stage transition (append-only)&lt;/td&gt;&lt;td&gt;Full CRM record&lt;/td&gt;&lt;td&gt;Only if the new stage is in the creator-visible mapping (§9.4)&lt;/td&gt;&lt;td&gt;optional EMG-posted update&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;EMG records payment received / releases funds&lt;/td&gt;&lt;td&gt;Ledger entries (new); release is an authorized act&lt;/td&gt;&lt;td&gt;Ledger detail; Campaign payment panel&lt;/td&gt;&lt;td&gt;Earnings: Received → Available&lt;/td&gt;&lt;td&gt;system: &quot;$X is available to you&quot;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator transfers funds&lt;/td&gt;&lt;td&gt;Provider transfer; ledger entry Transfer pending → Paid&lt;/td&gt;&lt;td&gt;Payout status on the ledger detail&lt;/td&gt;&lt;td&gt;Transfer history&lt;/td&gt;&lt;td&gt;system on completion/failure&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s7&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 7&lt;/div&gt;&lt;h2&gt;Mobile interaction model&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Creators will upload, review, approve, request changes, check opportunities, finish tasks, read analytics, check earnings and read intelligence on a phone. The model: &lt;b&gt;media first, one decision per screen, actions under the thumb, and the shortest path from a notification to the object.&lt;/b&gt;&lt;/p&gt;
&lt;div class=&quot;phones&quot;&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Creator Home, phone&quot;&gt;
  &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span&gt;Loop&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;hdr&quot;&gt;&lt;b&gt;Good morning, Denise&lt;/b&gt;&lt;span class=&quot;pill accent&quot;&gt;DR&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;small&gt;Total audience · 30-day growth&lt;/small&gt;&lt;b&gt;1.03M&lt;/b&gt; · +4.2%&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;small&gt;Things that need you&lt;/small&gt;Review EMG Edit v2 — ready&lt;br&gt;Upload Sculpey draft — due Fri&lt;br&gt;Complete payout setup&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;small&gt;Active opportunities · 3&lt;/small&gt;Kona Product Video — Confirmed&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;small&gt;Latest intelligence&lt;/small&gt;Kona in the first 5 s → 1.7× views &lt;span class=&quot;kbd&quot;&gt;View evidence →&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tabs&quot;&gt;&lt;b&gt;Home&lt;/b&gt;&lt;span&gt;Content&lt;/span&gt;&lt;span&gt;Opps&lt;/span&gt;&lt;span&gt;Tasks&lt;/span&gt;&lt;span&gt;Earnings&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;phone&quot; aria-label=&quot;Creator Edit Review, phone&quot;&gt;
  &lt;div class=&quot;bar&quot;&gt;&lt;span&gt;9:42&lt;/span&gt;&lt;span&gt;Loop&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;hdr&quot;&gt;&lt;b&gt;Sculpey Reel · Edit v2&lt;/b&gt;&lt;span class=&quot;pill warn&quot;&gt;Review&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;body&quot;&gt;
    &lt;div class=&quot;media&quot;&gt;Original ◦ &lt;b&gt;v2&lt;/b&gt; · 0:11 / 0:47 · tap to compare at this moment&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;small&gt;What changed since v1&lt;/small&gt;Opening shortened; Kona moved to 0:03 (your request)&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;small&gt;Pre-publish intelligence&lt;/small&gt;Kona appears at 0:03 — earlier than 4 of your last 5 videos. &lt;span class=&quot;kbd&quot;&gt;Evidence →&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;actions&quot;&gt;&lt;span class=&quot;btn&quot;&gt;Request changes&lt;/span&gt;&lt;span class=&quot;btn primary&quot;&gt;Approve&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot; style=&quot;margin-top:14px&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Thumb-zone rules&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;The one primary and one secondary action of a screen live in a sticky bottom bar above the five-area bar (Approve / Request changes; Upload; Transfer).&lt;/li&gt;
&lt;li&gt;Destructive or money-moving actions confirm in a sheet, never a modal dialog.&lt;/li&gt;
&lt;li&gt;Lists are cards with a thumbnail, a state pill and one line; a long-press is never required.&lt;/li&gt;
&lt;li&gt;Filters are horizontal chips under the page title; sorting is implicit (recency, due).&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Media-first review&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;The player is the page; metadata sits under it, actions under the thumb.&lt;/li&gt;
&lt;li&gt;Compare is a segmented control (Original · v1 · v2) that keeps the playhead — same moment, different version.&lt;/li&gt;
&lt;li&gt;Request changes opens a sheet over the paused frame; &quot;Add a note at 0:11&quot; captures the timestamp.&lt;/li&gt;
&lt;li&gt;Approve shows a one-line consequence (&quot;This becomes the final for the Kona deliverable&quot;) before confirming.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Upload&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Full-height sheet; the file picker opens immediately; progress is a ring on the card in the library while it uploads.&lt;/li&gt;
&lt;li&gt;Name, campaign/deliverable and &quot;request an edit right after&quot; are optional follow-ups, not gates.&lt;/li&gt;
&lt;li&gt;Large videos: background upload with a persistent card state Uploading → Processing → Ready; failure shows a Retry on the card.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Tasks and notifications&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;A task row opens the object where the action belongs — never a task detail page.&lt;/li&gt;
&lt;li&gt;Push/email notifications deep-link the same way (Review v2 → the Version view).&lt;/li&gt;
&lt;li&gt;Completed tasks are read-only history with the object link preserved.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Analytics on a phone&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;One number per card, sparkline, delta; platform chips; window chips.&lt;/li&gt;
&lt;li&gt;Tapping a spike opens a sheet listing the Content published in that window; tapping one opens the record.&lt;/li&gt;
&lt;li&gt;Intelligence explanations sit under the chart as one-line findings with &quot;Evidence&quot;.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Desktop adaptation&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Records use RecordLayout: main column (preview, versions) plus a rail (context, actions, intelligence).&lt;/li&gt;
&lt;li&gt;Version comparison side by side with a shared scrubber.&lt;/li&gt;
&lt;li&gt;Library becomes a denser grid with a list toggle; Analytics gets full charts and a table of top content.&lt;/li&gt;
&lt;li&gt;Nothing is desktop-only except density; every action exists on the phone.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s8&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 8&lt;/div&gt;&lt;h2&gt;Area by area: hierarchy, intelligence, states, transitions&lt;/h2&gt;&lt;/header&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Home — the 10-second snapshot&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Hierarchy&lt;/dt&gt;&lt;dd&gt;Greeting → four numbers (Total audience, 30-day growth, Active opportunities, Available balance) → Things that need you → Active opportunities → Content in progress → Latest intelligence.&lt;/dd&gt;
&lt;dt&gt;Sources&lt;/dt&gt;&lt;dd&gt;Numbers: social evidence, CRM projection, ledger. Needs you: Work OS assignments/stages due to the creator + creator-private WorkItems + setup prompts derived from Profile (unconnected platform, incomplete payout) — no Home task system. Opportunities: CRM projection. In progress: Content with an active Work. Intelligence: the newest accepted-or-proposed Finding with evidence.&lt;/dd&gt;
&lt;dt&gt;Intelligence&lt;/dt&gt;&lt;dd&gt;One finding, one CTA (&quot;View evidence →&quot; opens the Finding&#x27;s evidence drawer). Never a score.&lt;/dd&gt;
&lt;dt&gt;Empty / loading / error&lt;/dt&gt;&lt;dd&gt;No connected platform: the audience tile says &quot;Connect a platform to see your audience&quot; and links to Profile. No opportunities: &quot;No active opportunities — EMG will add them here.&quot; No balance: &quot;No earnings yet&quot; — never $0 dressed as data. Each panel loads and fails on its own (Loop&#x27;s settle pattern): a panel that cannot read says so; Home never goes down with it.&lt;/dd&gt;
&lt;dt&gt;Transitions&lt;/dt&gt;&lt;dd&gt;Every row is a link to its object: a Needs-you row → the Version view / the Deliverable / Profile; an opportunity → its record; content → its record; the number tiles → Analytics / Opportunities / Earnings.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Opportunities&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;List&lt;/dt&gt;&lt;dd&gt;Grouped by creator-visible state (§9.4), newest change first; each card: brand (as designated), campaign name if one exists, state pill, next thing for the creator if any.&lt;/dd&gt;
&lt;dt&gt;Detail&lt;/dt&gt;&lt;dd&gt;Overview (what it is, in EMG&#x27;s creator-facing words) → Campaign (state, dates) → Deliverables (type, due, status, linked Content) → Timeline (designated transitions and creator-visible updates only) → Files (Versions designated as shared: briefs, references) → Your tasks → Production (Work in progress) → Payment (the ledger&#x27;s view for this campaign) → Updates.&lt;/dd&gt;
&lt;dt&gt;Intelligence&lt;/dt&gt;&lt;dd&gt;Where a campaign has published content: commercial-performance context (&quot;sponsored posts using your recurring-character format close most of the gap&quot;) with evidence; never forecasts, never internal assessments.&lt;/dd&gt;
&lt;dt&gt;States&lt;/dt&gt;&lt;dd&gt;Empty: &quot;Nothing developing yet.&quot; Loading skeleton. A creator can never see an Opportunity not designated for them: not-found, not forbidden.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Content — library and record&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Library&lt;/dt&gt;&lt;dd&gt;Visual grid of Content cards (latest Version thumbnail, name, state pill, campaign chip, platform badge if published, performance number if published). Chips: All · Videos · Photos · Campaigns · In production · Published. Two actions: Upload, Request an Edit.&lt;/dd&gt;
&lt;dt&gt;Record&lt;/dt&gt;&lt;dd&gt;Preview → Status (Raw → Editing → Review → Approved → Published) → Context (Campaign, Opportunity, Deliverable, Work) → Versions → Intelligence → Performance → state-dependent actions.&lt;/dd&gt;
&lt;dt&gt;Intelligence&lt;/dt&gt;&lt;dd&gt;Pre-publish: findings comparing this content to the creator&#x27;s own history (facts and observations from version metadata and any governed content-feature evidence). Post-publish: what happened versus the pattern, and version-change findings (&quot;shortening the opening preceded a +12% completion versus your baseline&quot; — only when the evidence supports it). Each finding shows Fact / Observation / Interpretation / Recommendation and its evidence rows with limitations.&lt;/dd&gt;
&lt;dt&gt;States&lt;/dt&gt;&lt;dd&gt;Empty library: &quot;Your content lives here. Upload your first video.&quot; Uploading / Processing / Ready card states. Failed upload: Retry on the card. A version whose bytes are unavailable shows the metadata and says so.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Request an Edit&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Flow&lt;/dt&gt;&lt;dd&gt;Source → Instructions → References → Context &amp;amp; requested return → Submit. Four sheet steps; each is one screen on a phone with a progress dots row.&lt;/dd&gt;
&lt;dt&gt;Turnaround&lt;/dt&gt;&lt;dd&gt;Two distinct fields the creator always sees side by side: &lt;b&gt;Requested&lt;/b&gt; (theirs) and &lt;b&gt;Expected&lt;/b&gt; (EMG&#x27;s, set after review; blank shows &quot;EMG will confirm a return time&quot;). Later, service-level defaults can pre-fill Expected for EMG to adjust.&lt;/dd&gt;
&lt;dt&gt;After submit&lt;/dt&gt;&lt;dd&gt;Lands on the Content record&#x27;s Production section showing Submitted with the requested time; a task appears in Upcoming.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Analytics&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Hierarchy&lt;/dt&gt;&lt;dd&gt;Platform chips (All · TikTok · Instagram · YouTube · Facebook) and window chips (7D · 30D · 90D · 1Y) → summary tiles (audience, growth, views, reach, engagement, posting frequency) → chart → top content → platform comparison.&lt;/dd&gt;
&lt;dt&gt;Connection to Content&lt;/dt&gt;&lt;dd&gt;Every point, bar and top-content row resolves to Published Versions; tapping opens the Content record. Analytics provides evidence, Intelligence interprets it, Content is the object.&lt;/dd&gt;
&lt;dt&gt;Intelligence&lt;/dt&gt;&lt;dd&gt;Findings that explain a change in the selected window (&quot;this spike is one post&quot; / &quot;posting frequency fell&quot;), each with evidence; a Feed Analysis link for the deeper pattern view.&lt;/dd&gt;
&lt;dt&gt;States&lt;/dt&gt;&lt;dd&gt;No platform: connect prompt. Platform connected but no data yet: &quot;Reading your last 90 days — usually a few minutes.&quot; Partial platforms: a PartialDataNotice naming which are missing.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Tasks&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Views&lt;/dt&gt;&lt;dd&gt;Needs attention (due to the creator now) · Upcoming (due later, expected returns) · Completed.&lt;/dd&gt;
&lt;dt&gt;Sources&lt;/dt&gt;&lt;dd&gt;Work OS: stages assigned to the creator (review, approve, upload deliverable). WorkItems: creator-private detections. Setup: derived prompts. Deliverables: due dates.&lt;/dd&gt;
&lt;dt&gt;Rule&lt;/dt&gt;&lt;dd&gt;A task is a pointer with a due date and a verb; it opens the object. No task detail, no task management.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Earnings&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Hierarchy&lt;/dt&gt;&lt;dd&gt;Available balance (the only big number) → Transfer funds → Expected · Pending · Available · Paid YTD → campaign/transaction history → each row opens the Campaign Payment Detail with the trace Opportunity → Campaign → Deliverable → payment event.&lt;/dd&gt;
&lt;dt&gt;Rule&lt;/dt&gt;&lt;dd&gt;Expected and Pending are never styled as money you can move: muted, labelled &quot;not yet payable&quot;, no button near them. Only Available carries the transfer action.&lt;/dd&gt;
&lt;dt&gt;States&lt;/dt&gt;&lt;dd&gt;No earnings: &quot;No earnings yet — confirmed campaigns will appear here as Expected.&quot; Payout not set up: the Transfer button is replaced by &quot;Set up payouts&quot;. Provider unavailable: an honest unavailable state, balance still shown.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;Profile&lt;/h3&gt;
&lt;dl class=&quot;dl&quot;&gt;
&lt;dt&gt;Sections&lt;/dt&gt;&lt;dd&gt;Creator information · Profile · Social account connections · Content categories · Audience · Commercial/rate information (only fields EMG designates) · Payout setup · Documents · Notifications · Preferences.&lt;/dd&gt;
&lt;dt&gt;Rule&lt;/dt&gt;&lt;dd&gt;Every field is labelled by its owner: creator-editable, EMG-maintained (read-only with &quot;Ask EMG to change&quot;), or system-derived (read-only with its source). Identity fields come from the CRM Person; the creator edits creator-domain attributes only.&lt;/dd&gt;
&lt;/dl&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s9&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 9&lt;/div&gt;&lt;h2&gt;State models&lt;/h2&gt;&lt;/header&gt;

&lt;h3&gt;9.2 Editing work: creator-visible state ↔ Work OS&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
&lt;svg viewBox=&quot;0 0 980 200&quot; width=&quot;980&quot; height=&quot;200&quot; role=&quot;img&quot; aria-label=&quot;Edit request state machine mapped to Work OS stages&quot;&gt;

    &lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--neutral-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Submitted&lt;/text&gt;
    &lt;rect x=&quot;160&quot; y=&quot;30&quot; width=&quot;120&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--neutral-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;220&quot; y=&quot;55&quot; text-anchor=&quot;middle&quot;&gt;Assigned&lt;/text&gt;

&lt;div class=&quot;note warn&quot;&gt;Gaps this model needs from Work OS (recorded, not solved here): a stage that an &lt;b&gt;external participant&lt;/b&gt; completes; &lt;b&gt;requested&lt;/b&gt; and &lt;b&gt;expected/committed turnaround&lt;/b&gt; as distinct fields; attachments (Versions) on a stage; a way to &lt;b&gt;reopen&lt;/b&gt; a completed stage with a reason; comment visibility (creator-visible vs internal). Today &lt;code&gt;requiresApproval&lt;/code&gt; exists but is dormant.&lt;/div&gt;

&lt;h3&gt;9.3 Turnaround&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Field&lt;/th&gt;&lt;th&gt;Set by&lt;/th&gt;&lt;th&gt;Shown to creator as&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Requested return&lt;/td&gt;&lt;td&gt;Creator, at request time&lt;/td&gt;&lt;td&gt;&quot;You asked for Fri 3 PM&quot;&lt;/td&gt;&lt;td&gt;Never silently replaced.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Expected / committed return&lt;/td&gt;&lt;td&gt;Authorized EMG user after review; later pre-filled from service-level defaults (24–48 h) and adjustable&lt;/td&gt;&lt;td&gt;&quot;EMG expects Fri 5 PM&quot; — or &quot;EMG will confirm&quot; until set&lt;/td&gt;&lt;td&gt;A change to Expected is an event with a reason; the creator sees the new time and a system update.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Actual return&lt;/td&gt;&lt;td&gt;System, when the Version is uploaded and the stage completes&lt;/td&gt;&lt;td&gt;&quot;Returned Fri 4:40 PM&quot;&lt;/td&gt;&lt;td&gt;Feeds EMG&#x27;s turnaround metrics; never a creator-facing score.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;9.4 Opportunity: creator-visible states over CRM&#x27;s locked shape&lt;/h3&gt;
&lt;p&gt;CRM&#x27;s Opportunity has a category (OPEN / CLOSED_WON / CLOSED_LOST) and an organization-configured, versioned stage label within OPEN. The creator-facing vocabulary is a &lt;b&gt;declared mapping&lt;/b&gt; from each configured stage to a creator-visible state — part of the stage-set configuration, so no second lifecycle exists and no stage leaks by default (an unmapped stage shows the last mapped state).&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Creator-visible&lt;/th&gt;&lt;th&gt;Backed by&lt;/th&gt;&lt;th&gt;Rule&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Brand interest · Pitching · Negotiating&lt;/td&gt;&lt;td&gt;OPEN stages mapped by EMG&lt;/td&gt;&lt;td&gt;Stages EMG chooses not to expose collapse into the nearest exposed one; the creator never sees a stage name EMG did not designate.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Confirmed&lt;/td&gt;&lt;td&gt;CLOSED_WON, or an OPEN stage mapped as confirmed&lt;/td&gt;&lt;td&gt;Winning does not create a Campaign; &quot;Confirmed&quot; without a Campaign shows &quot;EMG is setting up the campaign&quot;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;In production · Submitted · Complete&lt;/td&gt;&lt;td&gt;Campaign ACTIVE + Deliverable states (creator domain) + Work state&lt;/td&gt;&lt;td&gt;Derived from execution objects, never stored on the Opportunity.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Payment pending · Paid&lt;/td&gt;&lt;td&gt;Ledger entries for the Campaign&lt;/td&gt;&lt;td&gt;Derived from the ledger, never from CRM.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;(not shown)&lt;/td&gt;&lt;td&gt;CLOSED_LOST&lt;/td&gt;&lt;td&gt;Shown as &quot;Didn&#x27;t go ahead&quot; only if EMG designates; otherwise it leaves the list.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;9.5 Earnings ledger&lt;/h3&gt;
&lt;figure class=&quot;fig&quot;&gt;
