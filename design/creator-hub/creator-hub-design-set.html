  &lt;g font-size=&quot;12&quot; font-weight=&quot;700&quot;&gt;
    &lt;rect x=&quot;10&quot; y=&quot;26&quot; width=&quot;130&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--neutral-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot;&gt;Expected&lt;/text&gt;
    &lt;rect x=&quot;170&quot; y=&quot;26&quot; width=&quot;130&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--neutral-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;235&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot;&gt;Pending&lt;/text&gt;
    &lt;rect x=&quot;330&quot; y=&quot;26&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--accent-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot;&gt;Received by EMG&lt;/text&gt;
    &lt;rect x=&quot;500&quot; y=&quot;26&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--good-soft)&quot; stroke=&quot;var(--good)&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot;&gt;Available to you&lt;/text&gt;
    &lt;rect x=&quot;670&quot; y=&quot;26&quot; width=&quot;140&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--warn-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;740&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot;&gt;Transfer pending&lt;/text&gt;
    &lt;rect x=&quot;840&quot; y=&quot;26&quot; width=&quot;130&quot; height=&quot;40&quot; rx=&quot;10&quot; fill=&quot;var(--good-soft)&quot; stroke=&quot;var(--line-strong)&quot;/&gt;&lt;text x=&quot;905&quot; y=&quot;51&quot; text-anchor=&quot;middle&quot;&gt;Paid&lt;/text&gt;
  &lt;/g&gt;
  &lt;g stroke=&quot;var(--text-3)&quot; fill=&quot;none&quot; marker-end=&quot;url(#ar)&quot;&gt;&lt;path d=&quot;M140,46 L170,46&quot;/&gt;&lt;path d=&quot;M300,46 L330,46&quot;/&gt;&lt;path d=&quot;M470,46 L500,46&quot;/&gt;&lt;path d=&quot;M640,46 L670,46&quot;/&gt;&lt;path d=&quot;M810,46 L840,46&quot;/&gt;&lt;/g&gt;
  &lt;g class=&quot;m&quot; fill=&quot;var(--text-2)&quot;&gt;&lt;text x=&quot;75&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;campaign confirmed&lt;/text&gt;&lt;text x=&quot;235&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;deliverables complete&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;EMG records funds in&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;authorized EMG release&lt;/text&gt;&lt;text x=&quot;740&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;creator initiated&lt;/text&gt;&lt;text x=&quot;905&quot; y=&quot;96&quot; text-anchor=&quot;middle&quot;&gt;provider confirmed&lt;/text&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Only the green-bordered state carries an action for the creator. Every entry traces Opportunity → Campaign → Deliverable/compensation → payment event, and every transition is an append-only entry with an actor.&lt;/figcaption&gt;
&lt;/figure&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Invariant&lt;/th&gt;&lt;th&gt;Meaning&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Expected is never available&lt;/td&gt;&lt;td&gt;A confirmed campaign&#x27;s compensation is shown muted, labelled, and with no transfer affordance. A creator cannot be shown a number they cannot move as if they could.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Release is a governed human act&lt;/td&gt;&lt;td&gt;Received → Available happens only when an authorized EMG role releases the creator&#x27;s portion, with the conditions it satisfied recorded.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Loop is not the rail&lt;/td&gt;&lt;td&gt;Destinations, identity checks, transfers, failures and retries live with the payout provider; Loop holds the state and the authorization.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Every amount has a source&lt;/td&gt;&lt;td&gt;No balance is a sum without rows; the rows are the truth, the balance is a projection.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;9.6 Intelligence ladder mapped to Loop&#x27;s vocabulary&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Brief&lt;/th&gt;&lt;th&gt;Loop today&lt;/th&gt;&lt;th&gt;Creator-facing presentation&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Fact (&quot;47 seconds long&quot;)&lt;/td&gt;&lt;td&gt;Evidence row (value, source, window, limitations)&lt;/td&gt;&lt;td&gt;Plain statement with its source; never disputed by AI.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Observation (&quot;Kona first appears at 0:11&quot;)&lt;/td&gt;&lt;td&gt;Evidence row from a governed content-feature task (new producer) with confidence and limitations&lt;/td&gt;&lt;td&gt;Stated as an observation; limitations visible on demand.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Interpretation (&quot;earlier appearances correlate with stronger performance&quot;)&lt;/td&gt;&lt;td&gt;FINDING — standing NON_AUTHORITATIVE; accept/reject by a person&lt;/td&gt;&lt;td&gt;&quot;Loop observes…&quot; with the evidence it rests on and the sample size.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Recommendation (&quot;consider moving Kona into the opening&quot;)&lt;/td&gt;&lt;td&gt;RECOMMENDATION — standing PROPOSED; select/dismiss/revise&lt;/td&gt;&lt;td&gt;&quot;Consider…&quot; with a dismiss; never applied to anything.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;No 83/100 scores. Comparisons are always against the creator&#x27;s own baseline with the count of eligible published versions, and a finding is withheld below a defensible minimum rather than shown with a caveat nobody reads.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s10&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 10&lt;/div&gt;&lt;h2&gt;EMG Creator Operations&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;The test for every EMG concern: &lt;b&gt;does an existing Loop surface already own this object?&lt;/b&gt; If yes, Creator Operations composes or deep-links; if no, and the object is creator-domain, Creator Operations hosts it. The result is one new list, one new lane, one new record (the ledger), and extensions to records Loop already has.&lt;/p&gt;

&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;EMG concern&lt;/th&gt;&lt;th&gt;Belongs in&lt;/th&gt;&lt;th&gt;How&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator roster&lt;/td&gt;&lt;td&gt;&lt;b&gt;Creator Ops&lt;/b&gt; (Operations → Creators)&lt;/td&gt;&lt;td&gt;A list of managed creators with needs-us / needs-them / due / in-production counts and last activity.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Individual creator overview&lt;/td&gt;&lt;td&gt;&lt;b&gt;CRM Person record&lt;/b&gt;&lt;/td&gt;&lt;td&gt;The Person page in its &quot;Creator&quot; context (see the operating view below). No new page.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Profile / relationship context&lt;/td&gt;&lt;td&gt;CRM&lt;/td&gt;&lt;td&gt;Identity, TALENT_REPRESENTATION relationship, participants, activity — as today.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Connected social accounts&lt;/td&gt;&lt;td&gt;Creator connection (new), shown on the Person record&lt;/td&gt;&lt;td&gt;State only (connected / needs reconnection / never), never credentials; the creator connects, EMG sees state.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunities and Campaigns&lt;/td&gt;&lt;td&gt;CRM records&lt;/td&gt;&lt;td&gt;EMG operates them where CRM puts them; the Person record lists them.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Campaign deliverables&lt;/td&gt;&lt;td&gt;Campaign record → Deliverables panel (creator-domain objects hosted on the CRM record)&lt;/td&gt;&lt;td&gt;Declare, link fulfilling Content, mark fulfilled.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Incoming creator requests&lt;/td&gt;&lt;td&gt;&lt;b&gt;Creator Ops → Requests lane&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Cross-creator: unassigned edit requests, uploads awaiting review, approvals pending on EMG. Rows open the Work or Content.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editing workflow, assignments, workload, turnaround commitments&lt;/td&gt;&lt;td&gt;&lt;b&gt;Work OS&lt;/b&gt; (Team Work, My Work, work detail)&lt;/td&gt;&lt;td&gt;Editing blueprint filter; requested vs expected turnaround as columns; overdue and due-soon lanes.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Asset versions / revision history&lt;/td&gt;&lt;td&gt;Content record (shared with the creator, EMG projection)&lt;/td&gt;&lt;td&gt;Same chain, plus internal notes and upload.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator change requests and approvals&lt;/td&gt;&lt;td&gt;Work OS work detail&lt;/td&gt;&lt;td&gt;Instruction history on the same Work; approvals complete the creator stage.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Published content, analytics, performance&lt;/td&gt;&lt;td&gt;Content record + creator Analytics (EMG projection)&lt;/td&gt;&lt;td&gt;EMG sees the same evidence; nothing separate.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator-specific intelligence&lt;/td&gt;&lt;td&gt;Decision Center cases + Person record → Intelligence&lt;/td&gt;&lt;td&gt;Findings accepted/rejected here become what the creator sees.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator tasks / actions&lt;/td&gt;&lt;td&gt;Work OS&lt;/td&gt;&lt;td&gt;&quot;Awaiting creator&quot; is a stage assigned to the creator; visible in Team Work and on the Person record.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Commercial / compensation state&lt;/td&gt;&lt;td&gt;CRM (terms) + ledger (entries)&lt;/td&gt;&lt;td&gt;Terms stay in CRM; compensation entries in the ledger reference the Campaign.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Payment status, release, payout state&lt;/td&gt;&lt;td&gt;&lt;b&gt;Ledger detail&lt;/b&gt; (new) linked from Campaign and the Person record&lt;/td&gt;&lt;td&gt;Record received; release (authorized roles); see provider transfer status.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator-visible updates&lt;/td&gt;&lt;td&gt;A sheet on any Work / Opportunity / Campaign record&lt;/td&gt;&lt;td&gt;A comment or update explicitly marked creator-visible; the default is internal.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Permissions / visibility&lt;/td&gt;&lt;td&gt;RBAC + designation on the object&lt;/td&gt;&lt;td&gt;See §11.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;The individual creator operating view (on the Person record)&lt;/h3&gt;
&lt;p&gt;Opening a creator internally should answer &quot;what does this creator need from us, and what are we waiting on&quot; in one screen — an operating view, not a dashboard. The Person record already has the frame (identity, relationships, opportunities, campaigns, open work, activity, intelligence). The creator context adds one summary strip and reorders the rail:&lt;/p&gt;
&lt;div class=&quot;split&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Summary strip&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Needs EMG (count) · Needs creator (count) · Due this week · In production&lt;/li&gt;
&lt;li&gt;Relationship status (representation active since …) · account status (signed in / never / needs reconnection)&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Main column&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Needs EMG attention: unassigned requests, expected turnaround unset, approvals to acknowledge, funds to release&lt;/li&gt;
&lt;li&gt;Awaiting creator: reviews, uploads, approvals, setup&lt;/li&gt;
&lt;li&gt;Active opportunities and campaigns with deliverable progress&lt;/li&gt;
&lt;li&gt;Content in production (each with stage, assignee, requested vs expected)&lt;/li&gt;
&lt;li&gt;Recent published performance (last 5, with the finding if any)&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Rail&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;Commercial and payment state: expected / pending / received / available / paid, with &quot;Release&quot; where authorized&lt;/li&gt;
&lt;li&gt;Meaningful intelligence: open cases and accepted findings about this creator&lt;/li&gt;
&lt;li&gt;Connections: platforms and payout status&lt;/li&gt;
&lt;li&gt;Post a creator-visible update&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Cross-creator operating view: what&#x27;s genuinely new, and what isn&#x27;t&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Need&lt;/th&gt;&lt;th&gt;Verdict&lt;/th&gt;&lt;th&gt;Reason&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Incoming creator requests, items awaiting EMG, items awaiting creators, approvals&lt;/td&gt;&lt;td&gt;&lt;b&gt;New: Requests lane&lt;/b&gt; under Operations → Creators&lt;/td&gt;&lt;td&gt;These are cross-creator and cross-object (Work + Content + ledger); nothing today lists &quot;what creators are waiting on us for&quot;.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editing workload, deadlines, turnaround commitments, content production&lt;/td&gt;&lt;td&gt;&lt;b&gt;Work OS Team Work&lt;/b&gt;, filtered to the Editing blueprint&lt;/td&gt;&lt;td&gt;They are assignments and due dates — Work OS facts. Building them elsewhere would be the duplicate task system the brief forbids.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Commercial / payment actions across creators&lt;/td&gt;&lt;td&gt;&lt;b&gt;Ledger list&lt;/b&gt; reached from Requests (&quot;funds to release&quot;) and from Campaigns&lt;/td&gt;&lt;td&gt;Release is an authorized ledger act; a list of releasable entries is a query over the ledger, not a screen of its own.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Desktop and mobile on the EMG side&lt;/h3&gt;
&lt;p&gt;EMG&#x27;s seat is desktop-first: the roster, Team Work, records and the ledger want density. Three workflows must also work on a phone, because an editor or a manager will be away from a desk: &lt;b&gt;acknowledge and set expected turnaround&lt;/b&gt; on a new request; &lt;b&gt;upload a Version&lt;/b&gt; from a phone after an on-site edit; &lt;b&gt;post a creator-visible update&lt;/b&gt;. Each is the same sheet pattern as the creator side, on the same objects. Approving a fund release stays desktop-only until the ledger&#x27;s authorization rules are settled.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s11&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 11&lt;/div&gt;&lt;h2&gt;Creator-visible versus EMG-only: information and action boundaries&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Sharing an object does not share its information. Every field and action in Creator Hub carries one of six classes, and the default for anything internal is &lt;b&gt;EMG-only&lt;/b&gt;. Creator visibility is always a deliberate designation on the object or a fixed rule in the projection, never inheritance.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Object&lt;/th&gt;&lt;th&gt;Creator-visible&lt;/th&gt;&lt;th&gt;EMG-only&lt;/th&gt;&lt;th&gt;Creator-actionable&lt;/th&gt;&lt;th&gt;EMG-actionable&lt;/th&gt;&lt;th&gt;System-derived&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunity&lt;/td&gt;&lt;td&gt;brand as designated · creator-visible state · designated updates · files marked shared&lt;/td&gt;&lt;td&gt;stage names, forecast, amount, notes, buyer conversations, negotiations, internal assessments, activity&lt;/td&gt;&lt;td&gt;none&lt;/td&gt;&lt;td&gt;stage, forecast, close, designate visibility, post update&lt;/td&gt;&lt;td&gt;creator-visible state from the mapping&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Campaign&lt;/td&gt;&lt;td&gt;name · lifecycle state · dates · deliverables · shared files&lt;/td&gt;&lt;td&gt;agreed commercial terms (unless designated), participants, provider links, internal notes&lt;/td&gt;&lt;td&gt;none&lt;/td&gt;&lt;td&gt;declare/edit, deliverables, terms, designate&lt;/td&gt;&lt;td&gt;progress from deliverables&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Deliverable&lt;/td&gt;&lt;td&gt;type, due, status, fulfilling Content&lt;/td&gt;&lt;td&gt;internal notes&lt;/td&gt;&lt;td&gt;upload, submit&lt;/td&gt;&lt;td&gt;declare, accept, mark fulfilled&lt;/td&gt;&lt;td&gt;status from Content/Work&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Content / Version&lt;/td&gt;&lt;td&gt;everything about their own content and its chain; editor notes marked creator-visible&lt;/td&gt;&lt;td&gt;internal comments, internal quality notes&lt;/td&gt;&lt;td&gt;upload, request edit, review, request changes, approve, mark published&lt;/td&gt;&lt;td&gt;upload Version, comment, mark fulfilled&lt;/td&gt;&lt;td&gt;lifecycle state, marks&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Work (editing)&lt;/td&gt;&lt;td&gt;stage as creator-visible state · assignee first name · requested and expected return · instruction history they wrote&lt;/td&gt;&lt;td&gt;internal comments, assignment reasoning, workload, actual timings as metrics&lt;/td&gt;&lt;td&gt;submit, request changes, approve&lt;/td&gt;&lt;td&gt;assign, set expected, upload, complete, reopen, comment&lt;/td&gt;&lt;td&gt;overdue, actual return&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Performance&lt;/td&gt;&lt;td&gt;their own platforms&#x27; evidence&lt;/td&gt;&lt;td&gt;cross-creator comparisons&lt;/td&gt;&lt;td&gt;connect/disconnect platform&lt;/td&gt;&lt;td&gt;none on the evidence&lt;/td&gt;&lt;td&gt;all of it&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Intelligence&lt;/td&gt;&lt;td&gt;findings and recommendations about themselves that a person accepted or left proposed, with evidence&lt;/td&gt;&lt;td&gt;cases, rejected findings, cross-creator findings, commercial findings unless designated&lt;/td&gt;&lt;td&gt;dismiss a recommendation for themselves&lt;/td&gt;&lt;td&gt;accept/reject, resolve cases&lt;/td&gt;&lt;td&gt;evidence&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Earnings&lt;/td&gt;&lt;td&gt;their entries and states&lt;/td&gt;&lt;td&gt;EMG&#x27;s share, margins, terms&lt;/td&gt;&lt;td&gt;transfer (Available only), payout setup&lt;/td&gt;&lt;td&gt;record received, release, adjust with reason&lt;/td&gt;&lt;td&gt;balances&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Profile&lt;/td&gt;&lt;td&gt;all creator-domain fields; identity as CRM holds it&lt;/td&gt;&lt;td&gt;internal assessments, ratings, notes&lt;/td&gt;&lt;td&gt;creator-domain fields, connections, preferences&lt;/td&gt;&lt;td&gt;EMG-maintained fields, designations&lt;/td&gt;&lt;td&gt;audience from evidence&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;

&lt;h3&gt;Roles and permissions (product level)&lt;/h3&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Role&lt;/th&gt;&lt;th&gt;Is&lt;/th&gt;&lt;th&gt;May&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator&lt;/td&gt;&lt;td&gt;An external participant of EMG&#x27;s organization: a Person with an active representation, holding a creator sign-in&lt;/td&gt;&lt;td&gt;Only creator-actionable actions on their own objects; read only creator-visible projections&lt;/td&gt;&lt;td&gt;Scoped like employee-private data is today: organization + person, fail-closed. Cannot see other creators, ever. Needs a real authority (§15, decision 1).&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Creator Operations (Manager / Employee with the creators capability)&lt;/td&gt;&lt;td&gt;EMG staff who operate creators&lt;/td&gt;&lt;td&gt;Roster, requests, records, designations, expected turnaround, creator-visible updates&lt;/td&gt;&lt;td&gt;Maps to existing RBAC resources plus a creators resource (gap).&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editor (Employee assignee)&lt;/td&gt;&lt;td&gt;The person the Work is assigned to&lt;/td&gt;&lt;td&gt;Their assigned Work: start, upload Version, complete, comment&lt;/td&gt;&lt;td&gt;Existing Work OS role authority; sees only assigned work unless Creator Ops.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Release authority (Owner / Admin, or a designated finance role)&lt;/td&gt;&lt;td&gt;Whoever may move Received → Available&lt;/td&gt;&lt;td&gt;Release funds, adjust entries with reason&lt;/td&gt;&lt;td&gt;Decision #5 in §15.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Read Only&lt;/td&gt;&lt;td&gt;Existing&lt;/td&gt;&lt;td&gt;Read EMG projections only&lt;/td&gt;&lt;td&gt;Never creator-actionable actions.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;AI_EMPLOYEE&lt;/td&gt;&lt;td&gt;Existing identity, no LLM today&lt;/td&gt;&lt;td&gt;Nothing in Creator Hub&lt;/td&gt;&lt;td&gt;Findings come from governed tasks invoked by people or system producers, never an AI actor.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s12&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 12&lt;/div&gt;&lt;h2&gt;How both seats stay synchronized&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;The principle&lt;/h4&gt;&lt;p&gt;Both seats are read models over the same rows. A creator&#x27;s &quot;Review v2&quot; and an editor&#x27;s &quot;awaiting creator&quot; are the same WorkStage row read with two projections. There is nothing to reconcile because there is nothing duplicated.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;What would break it (forbidden)&lt;/h4&gt;&lt;ul&gt;
&lt;li&gt;A creator-side &quot;project&quot; or &quot;request&quot; table beside Work OS.&lt;/li&gt;
&lt;li&gt;A creator-side opportunity status stored on the creator&#x27;s record.&lt;/li&gt;
&lt;li&gt;Copying performance numbers onto Content or Campaign fields.&lt;/li&gt;
&lt;li&gt;A Home task list that is not a projection of Work OS, WorkItems and derived setup state.&lt;/li&gt;
&lt;li&gt;An &quot;admin copy&quot; of the version chain, or a version that is overwritten in place.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;tbl&quot; style=&quot;margin-top:12px&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Shared object&lt;/th&gt;&lt;th&gt;Creator projection&lt;/th&gt;&lt;th&gt;EMG projection&lt;/th&gt;&lt;th&gt;Sync mechanism&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Opportunities&lt;/td&gt;&lt;td&gt;CRM Opportunity + stage set with visibility mapping&lt;/td&gt;&lt;td&gt;creator-visible state, designated updates&lt;/td&gt;&lt;td&gt;full record&lt;/td&gt;&lt;td&gt;the mapping is configuration; transitions are append-only events both read&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Content&lt;/td&gt;&lt;td&gt;Content + Version chain&lt;/td&gt;&lt;td&gt;library, record, review&lt;/td&gt;&lt;td&gt;same record with internal notes and upload&lt;/td&gt;&lt;td&gt;one chain; marks written by whichever seat acts&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Editing&lt;/td&gt;&lt;td&gt;WorkInstance / stages / assignments / events&lt;/td&gt;&lt;td&gt;request detail, tasks&lt;/td&gt;&lt;td&gt;My Work / Team Work / work detail&lt;/td&gt;&lt;td&gt;stage events; notifications derived from events&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Tasks&lt;/td&gt;&lt;td&gt;Work OS + WorkItems + derived setup&lt;/td&gt;&lt;td&gt;Needs attention / Upcoming&lt;/td&gt;&lt;td&gt;Awaiting creator, on the Person record and Team Work&lt;/td&gt;&lt;td&gt;projections of the same rows&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Analytics&lt;/td&gt;&lt;td&gt;Performance evidence on Published Versions&lt;/td&gt;&lt;td&gt;their analytics&lt;/td&gt;&lt;td&gt;the same, plus cross-creator&lt;/td&gt;&lt;td&gt;one evidence store; windows and filters are reads&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Earnings&lt;/td&gt;&lt;td&gt;Ledger entries&lt;/td&gt;&lt;td&gt;balances and history&lt;/td&gt;&lt;td&gt;ledger detail, release&lt;/td&gt;&lt;td&gt;append-only entries; balances are projections&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Intelligence&lt;/td&gt;&lt;td&gt;Cases, evidence, findings, recommendations&lt;/td&gt;&lt;td&gt;accepted/proposed findings with evidence&lt;/td&gt;&lt;td&gt;Decision Center&lt;/td&gt;&lt;td&gt;standing judgments in the Decision Engine; the creator sees the result of them&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s13&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 13&lt;/div&gt;&lt;h2&gt;Visual and hierarchy direction&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Creator Hub uses Loop&#x27;s global design system unchanged — light canvas, navy rail, teal for the current place and links, semantic green/amber/red/grey, Inter, 14 px radius, near-flat elevation — because the creator and EMG are looking at the same product. What changes for the creator seat is &lt;b&gt;emphasis&lt;/b&gt;, not language: media leads, numbers are few and large only where they are the point, and every state is a pill.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Need&lt;/th&gt;&lt;th&gt;Existing primitive&lt;/th&gt;&lt;th&gt;New domain component (creator UI only)&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Snapshot numbers&lt;/td&gt;&lt;td&gt;&lt;code&gt;SummaryStrip&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Things that need you&lt;/td&gt;&lt;td&gt;&lt;code&gt;AttentionRow&lt;/code&gt; / the Needs-you list&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Records&lt;/td&gt;&lt;td&gt;&lt;code&gt;LoopPage&lt;/code&gt; · &lt;code&gt;PageHead&lt;/code&gt; · &lt;code&gt;RecordLayout&lt;/code&gt; · &lt;code&gt;Panel&lt;/code&gt; · &lt;code&gt;Facts&lt;/code&gt; · &lt;code&gt;ContextTabs&lt;/code&gt; · &lt;code&gt;StatePill&lt;/code&gt; · &lt;code&gt;ActionButton&lt;/code&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Library cards&lt;/td&gt;&lt;td&gt;&lt;code&gt;loop-panel&lt;/code&gt;, Subject Display card patterns&lt;/td&gt;&lt;td&gt;&lt;b&gt;Media card&lt;/b&gt;: thumbnail, state pill, campaign chip, platform badge, progress ring&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Version chain&lt;/td&gt;&lt;td&gt;&lt;code&gt;ActivityList&lt;/code&gt; (the nine truth types) for the history&lt;/td&gt;&lt;td&gt;&lt;b&gt;Version strip&lt;/b&gt; and &lt;b&gt;Compare viewer&lt;/b&gt; (segmented Original · v1 · v2 with a shared playhead)&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Money&lt;/td&gt;&lt;td&gt;&lt;code&gt;SummaryStrip&lt;/code&gt;, &lt;code&gt;Facts&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Balance block&lt;/b&gt; with the one action and the muted non-payable rows&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Intelligence&lt;/td&gt;&lt;td&gt;&lt;code&gt;BrainWorkState&lt;/code&gt; words, &lt;code&gt;ContextDrawer&lt;/code&gt; for evidence&lt;/td&gt;&lt;td&gt;&lt;b&gt;Finding card&lt;/b&gt;: one line, evidence count, &quot;View evidence&quot; opening the drawer with Fact / Observation / Interpretation / Recommendation and limitations&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Workflows&lt;/td&gt;&lt;td&gt;&lt;code&gt;ContextDrawer&lt;/code&gt; (a sheet on phones), &lt;code&gt;StateBlock&lt;/code&gt; for empty/unavailable/error&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Charts&lt;/td&gt;&lt;td&gt;&lt;code&gt;Sparkline&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;b&gt;Analytics chart&lt;/b&gt; drawn to scale, theme tokens, points that open Content&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;p&gt;Hierarchy on a phone: page title → one summary → the list or the media → the thumb bar. On desktop: the same order in two columns. No creator-specific palette, no &quot;hub&quot; chrome; the rail&#x27;s wordmark and the person block already say whose Loop this is.&lt;/p&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s14&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 14&lt;/div&gt;&lt;h2&gt;Capability gaps (for the architecture pass, not for now)&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Each is recorded as a gap the approved experience requires. None is a permission to build.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Identity and access&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Creator sign-in as an external participant (C-02 currently forbids; no &lt;code&gt;SystemRole&lt;/code&gt;, the &lt;code&gt;CREATOR&lt;/code&gt; workspace is unreachable)&lt;/li&gt;&lt;li&gt;Creator-scoped authorization (org + person, fail-closed) and a creators RBAC resource for EMG&lt;/li&gt;&lt;li&gt;Creator-visible designation as a first-class flag on Opportunity/Campaign stages, files, comments and updates&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Commercial&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Opportunity and Campaign services (contracts locked, unbuilt), plus the stage-to-creator-state mapping in the stage set&lt;/li&gt;&lt;li&gt;Deliverable as a creator-domain object linked to Campaign and Content&lt;/li&gt;&lt;li&gt;Compensation entries and the Earnings ledger; release authorization; payout provider integration&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Content&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Object storage with presigned upload/download; Content and Version models with marks and producedBy&lt;/li&gt;&lt;li&gt;Publication linkage (platform, post id) on a Version&lt;/li&gt;&lt;li&gt;Thumbnails, duration and dimensions as system-derived meaning&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Work OS&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;External-participant stage completion; requested vs expected/committed turnaround with change reasons; reopen with reason; Version attachments; creator-visible vs internal comments; an Editing blueprint&lt;/li&gt;&lt;li&gt;Creator-facing notifications (push/email) derived from stage events&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Evidence and intelligence&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Creator platform connections and performance ingestion as a measurement source (tenant-safe from day one — the CallGrid single-tenant lesson)&lt;/li&gt;&lt;li&gt;Governed content-feature tasks producing evidence rows with limitations; creator-baseline Findings; version-change findings&lt;/li&gt;&lt;li&gt;The creator context the onboarding review already waits for (categories, audience)&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Surfaces&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Creator seat routes on &lt;code&gt;/app/creator&lt;/code&gt; in the one shell; the Creators roster and Requests lane; the Person record&#x27;s creator context; Team Work&#x27;s Editing filter and turnaround columns; ledger detail&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s15&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 15&lt;/div&gt;&lt;h2&gt;Decisions to resolve before mockups&lt;/h2&gt;&lt;/header&gt;
&lt;ol class=&quot;steps&quot;&gt;
&lt;li&gt;&lt;b&gt;Creator access.&lt;/b&gt; C-02 (2026-09-15) says external participant authentication, memberships and portals are not authorized; this brief requires a creator-facing seat. Recommendation: amend C-02 for &lt;em&gt;one&lt;/em&gt; participant type — the managed creator — as an external participant of EMG&#x27;s organization with creator-scoped authority, keeping &quot;no multi-org sign-in&quot; and &quot;no second application&quot;. Everything else in this document depends on it.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Mobile bar composition.&lt;/b&gt; Recommendation: Home · Content · Opportunities · Tasks · Earnings, with Analytics one tap from Home and Content and Profile on the avatar. Alternative: swap Tasks for Analytics and rely on Home&#x27;s &quot;Things that need you&quot; — weaker for creators with many deliverables.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Creator-domain nouns.&lt;/b&gt; Approve Content, Version, Deliverable, Earnings ledger, Social connection and Performance evidence as the concepts Creator Hub deliberately establishes; confirm Deliverable is hosted on the CRM Campaign record but owned by the creator domain, as the CRM readiness record already implies.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Opportunity visibility mapping.&lt;/b&gt; Approve the model: creator-visible state is a declared mapping in the organization&#x27;s stage set; unmapped stages never show; internal information never inherits. Confirm whether &quot;Didn&#x27;t go ahead&quot; is ever shown.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Earnings vocabulary and release authority.&lt;/b&gt; Confirm the six states and their names, who may release (Owner/Admin, or a finance role), and whether &quot;Received by EMG&quot; is creator-visible or collapses into Pending.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Turnaround defaults.&lt;/b&gt; Whether a service-level default (24–48 h) pre-fills Expected on submission, or Expected stays blank until a person sets it. Recommendation: blank until set, defaults as the second step.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Platforms in scope for v1 evidence.&lt;/b&gt; Which of TikTok, Instagram, YouTube, Facebook connect first; this bounds Analytics and every performance-based finding.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Intelligence scope for v1.&lt;/b&gt; Which features are computable from evidence without a model (length, version diffs, posting time, platform, organic/sponsored) versus which need a governed content-feature task (people, animals, products, hooks, tone). Recommendation: ship the evidence-only findings first; they are defensible immediately.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Notifications.&lt;/b&gt; Whether creator notifications (push/email) are in the first release; the design deep-links assume they exist eventually.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Managers and multiple creators.&lt;/b&gt; Whether a creator&#x27;s manager or a multi-creator household signs in as the creator, as a delegate, or not at all in v1. Recommendation: not in v1.&lt;/li&gt;
&lt;li&gt;&lt;b&gt;Publication linkage.&lt;/b&gt; Whether the creator marks and connects published posts by hand, or connected platforms detect them. Recommendation: by hand first, detection later.&lt;/li&gt;
&lt;/ol&gt;
&lt;/section&gt;

&lt;!-- ============================================================ --&gt;
&lt;section id=&quot;s16&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;Section 16&lt;/div&gt;&lt;h2&gt;Proposed mockup sequence&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Design the objects that everything else composes first, on the phone first, and the EMG side of each workflow beside its creator side so the handoff is designed once.&lt;/p&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Mockups&lt;/th&gt;&lt;th&gt;Why now&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;Content record (phone): preview, status, versions, intelligence, performance, actions in every state&lt;/td&gt;&lt;td&gt;The centre of gravity; Home, Tasks, Review, Publish and Intelligence all point at it.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;Creator Edit Review + Request Changes (phone) · EMG editing work view (desktop, on Work OS detail)&lt;/td&gt;&lt;td&gt;The signature workflow, designed as one handoff.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;Request an Edit (phone, 4 sheets) · Requests lane (desktop)&lt;/td&gt;&lt;td&gt;The start of the same handoff; settles turnaround presentation.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;Creator Home (phone and desktop) · individual creator operating view (Person record, desktop)&lt;/td&gt;&lt;td&gt;The two &quot;what matters now&quot; views over the same objects.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;Content Library + Upload (phone)&lt;/td&gt;&lt;td&gt;Media-first patterns and card states.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;Opportunities list + detail (phone) · CRM Opportunity/Campaign with visibility designation and deliverables (desktop)&lt;/td&gt;&lt;td&gt;Fixes the creator-visible mapping visually before it is configured.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;Earnings + Campaign Payment Detail + Transfer/Payout setup (phone) · ledger detail with release (desktop)&lt;/td&gt;&lt;td&gt;The &quot;never expected = available&quot; rule must be seen to be approved.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;Tasks (phone) · Team Work Editing filter (desktop)&lt;/td&gt;&lt;td&gt;Projections; quick once 2–4 exist.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;Analytics + Feed Analysis + Single Content Analysis (phone, then desktop)&lt;/td&gt;&lt;td&gt;Depends on the evidence scope decision (#7, #8).&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;Profile (connections, payout, ownership labels) · Creators roster (desktop)&lt;/td&gt;&lt;td&gt;Setup surfaces; last because their patterns are the most conventional.&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot; style=&quot;margin-top:16px&quot;&gt;After approval of the experience, the separate architecture pass maps every visible requirement here to its authoritative source, the existing capability, the missing capability and the required delta — and only then does implementation begin.&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;
&lt;/div&gt;
&lt;/div&gt;

  --loop-good:#1d7449; --loop-good-soft:#e1f1e8; --loop-warn:#8a5a00; --loop-warn-soft:#f8efdc; --loop-crit:#ad2a22; --loop-crit-soft:#fae7e5; --loop-neutral:#53616c; --loop-neutral-soft:#eaeef0;
  --loop-avatar:#dbe8ec; --loop-avatar-ink:#1c5a6f; --loop-company:#e6e9f2; --loop-company-ink:#2c3d63;
  --loop-rail:#0e1b2c; --loop-rail-2:#1a2c42; --loop-rail-line:rgba(255,255,255,.09); --loop-rail-text:#c9d3dc; --loop-rail-muted:#8fa0ae; --loop-rail-active:#9fd6e3;
  --loop-radius:14px; --loop-radius-sm:10px;
  color-scheme:light; font-family:var(--d-font); color:var(--loop-body); font-size:14px; line-height:1.5; text-align:left;
}
.lf *{box-sizing:border-box}
.lf a{color:inherit;text-decoration:none}
.lf .loop-trail{margin:0 0 6px;font-size:11.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--loop-muted);display:flex;flex-wrap:wrap;gap:6px}
.lf .loop-trail__sep{opacity:.55}
.lf .loop-title{margin:0;font-size:26px;line-height:1.12;font-weight:750;letter-spacing:-.02em;color:var(--loop-ink);text-wrap:balance}
.lf.desk .loop-title{font-size:30px}
.lf .loop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lf .loop-head__text{min-width:0;flex:1 1 300px}
.lf .loop-head__actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lf .loop-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:650;line-height:1.3;white-space:nowrap}
.lf .loop-pill::before{content:&#x27;&#x27;;width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.lf .loop-pill--good{background:var(--loop-good-soft);color:var(--loop-good)}
.lf .loop-pill--attention{background:var(--loop-warn-soft);color:var(--loop-warn)}
.lf .loop-pill--critical{background:var(--loop-crit-soft);color:var(--loop-crit)}
.lf .loop-pill--neutral{background:var(--loop-neutral-soft);color:var(--loop-neutral)}
.lf .loop-pill--info{background:var(--loop-accent-soft);color:var(--loop-accent)}
.lf .loop-pill--sm{font-size:11px;padding:2px 8px}
.lf .loop-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 14px;border-radius:var(--loop-radius-sm);border:1px solid var(--loop-line-strong);background:var(--loop-surface);color:var(--loop-ink);font:inherit;font-size:13.5px;font-weight:650;white-space:nowrap;cursor:pointer}
.lf .loop-btn--primary{background:var(--loop-primary);border-color:var(--loop-primary);color:var(--loop-on-primary)}
.lf .loop-btn--quiet{border-color:transparent;background:transparent}
.lf .loop-btn[aria-disabled=&quot;true&quot;]{background:var(--loop-sunken);border-color:var(--loop-line);color:var(--loop-faint)}
.lf .loop-btnrow{display:flex;flex-wrap:wrap;gap:8px}
.lf .loop-link{color:var(--loop-accent);font-weight:650;font-size:13.5px}
.lf .loop-panel{background:var(--loop-surface);border:1px solid var(--loop-line);border-radius:var(--loop-radius);padding:16px;position:relative}
.lf.desk .loop-panel{padding:20px}
.lf .loop-panel__title{margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--loop-muted)}
.lf .loop-facts{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:9px 12px;margin:0}
.lf .loop-facts dt{font-size:12.5px;color:var(--loop-muted)}
.lf .loop-facts dd{margin:0;font-size:13.5px;color:var(--loop-ink);font-weight:600;min-width:0;overflow-wrap:anywhere}
.lf .loop-facts dd.is-unknown{color:var(--loop-faint);font-weight:500}
.lf .loop-facts dd.q{font-weight:500}
.lf .loop-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--loop-line);border:1px solid var(--loop-line);border-radius:var(--loop-radius);overflow:hidden}
.lf .loop-strip__item{background:var(--loop-surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lf .loop-strip__label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--loop-muted)}
.lf .loop-strip__value{font-size:17px;font-weight:700;color:var(--loop-ink);font-variant-numeric:tabular-nums}
.lf .loop-state{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--loop-radius);border:1px dashed var(--loop-line-strong);background:var(--loop-surface)}
.lf .loop-state__mark{flex:0 0 30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;background:var(--loop-neutral-soft);color:var(--loop-neutral);font-size:13px}
.lf .loop-state--attention .loop-state__mark{background:var(--loop-warn-soft);color:var(--loop-warn)}
.lf .loop-state__title{margin:0 0 2px;font-size:14px;font-weight:700;color:var(--loop-ink)}
.lf .loop-state__body{margin:0;color:var(--loop-muted);font-size:13px}
.lf .loop-record{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.lf .loop-record__main,.lf .loop-record__rail{display:flex;flex-direction:column;gap:16px;min-width:0}
.lf .loop-activity{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lf .loop-act{border-top:1px solid var(--loop-line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 2px}
.lf .loop-act:first-child{border-top:none}
.lf .loop-act__truth{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--loop-neutral-soft);color:var(--loop-neutral);white-space:nowrap}
.lf .loop-act__truth--communication{background:var(--loop-accent-soft);color:var(--loop-accent)}
.lf .loop-act__truth--state_change,.lf .loop-act__truth--decision{background:var(--loop-company);color:var(--loop-company-ink)}
.lf .loop-act__truth--finding,.lf .loop-act__truth--recommendation{background:var(--loop-surface);color:var(--loop-ink);border:1px dashed var(--loop-line-strong);font-style:italic}
.lf .loop-act__truth--work{background:var(--loop-good-soft);color:var(--loop-good)}
.lf .loop-act__truth--external{background:var(--loop-warn-soft);color:var(--loop-warn)}
.lf .loop-act__story{color:var(--loop-ink);font-weight:600;font-size:13px;overflow-wrap:anywhere}
.lf .loop-act__sub{display:block;font-weight:500;color:var(--loop-muted);font-size:12.5px;margin-top:2px}
.lf .loop-act__when{font-size:12px;color:var(--loop-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lf .loop-act--hi{background:var(--loop-warn-soft);border-radius:10px;padding-left:8px;padding-right:8px;margin:4px -6px}
.lf .loop-drawer{border:1px solid var(--loop-line);border-radius:var(--loop-radius-sm);background:var(--loop-surface)}
.lf .loop-drawer__sum{padding:10px 12px;font-weight:650;color:var(--loop-ink);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.lf .loop-drawer__sum::after{content:&#x27;+&#x27;;font-size:18px;color:var(--loop-muted)}
.lf .loop-avatar{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--loop-avatar);color:var(--loop-avatar-ink);font-weight:750;font-size:12px}
/* domain components proposed in the design pass (creator UI only) */
.lf .media{position:relative;border-radius:var(--loop-radius);overflow:hidden;background:linear-gradient(165deg,#1b2a3a 0%,#2c3f52 55%,#5f6d78 100%);color:#fff;aspect-ratio:4/5;max-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.lf.desk .media{aspect-ratio:9/12;max-height:420px}
.lf .media__seg{position:absolute;top:10px;left:10px;display:inline-flex;background:rgba(15,28,42,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px;backdrop-filter:blur(6px)}
.lf .media__seg span{padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:650;color:#dfe7ee}
.lf .media__seg span.on{background:#fff;color:var(--loop-ink)}
.lf .media__badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--loop-ink)}
.lf .media__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--loop-ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.lf .media__bar{height:4px;border-radius:4px;background:rgba(255,255,255,.28);position:relative;margin-top:6px}
.lf .media__bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#fff}
.lf .media__time{display:flex;justify-content:space-between;font-size:11.5px;font-variant-numeric:tabular-nums;color:#e6edf3}
.lf .media__hint{font-size:11.5px;color:#cfd9e2}
.lf .media__scene{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#cfd9e2;margin-bottom:4px}
.lf .vstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.lf .vchip{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;width:84px}
.lf .vchip__thumb{height:52px;border-radius:9px;background:linear-gradient(160deg,#2c3f52,#5f6d78);border:2px solid transparent;position:relative}
.lf .vchip.on .vchip__thumb{border-color:var(--loop-accent)}
.lf .vchip.ghost .vchip__thumb{background:var(--loop-sunken);border:1.5px dashed var(--loop-line-strong)}
.lf .vchip__thumb b{position:absolute;right:4px;bottom:4px;font-size:9.5px;padding:1px 5px;border-radius:5px;background:rgba(255,255,255,.92);color:var(--loop-ink);font-weight:750}
.lf .vchip__l{font-size:11.5px;font-weight:650;color:var(--loop-ink);line-height:1.2}
.lf .vchip__m{font-size:10.5px;color:var(--loop-muted);line-height:1.2}
.lf .req{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--loop-line);display:flex;flex-direction:column;gap:5px}
.lf .req__t{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--loop-muted);margin-bottom:2px}
.lf .req li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;color:var(--loop-body);align-items:baseline}
.lf .req li.req__t{display:block}
.lf .req i{font-style:normal;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--loop-line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--loop-good)}
.lf .req li.done i{background:var(--loop-good-soft);border-color:var(--loop-good)}
.lf .req li.done{color:var(--loop-ink)}
.lf .req li small{color:var(--loop-muted)}
.lf .rung{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-top:1px solid var(--loop-line)}
.lf .rung:first-child,.lf .loop-panel__title + .rung,.lf p + .rung{border-top:none;padding-top:0}
.lf .rung__head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lf .rung__text{margin:0;font-size:13.5px;color:var(--loop-ink);font-weight:600}
.lf .rung__meta{margin:0;font-size:12px;color:var(--loop-muted)}
.lf .rung--held{border-radius:9px;border:1px dashed var(--loop-line-strong);padding:9px 10px;margin-top:6px}
.lf .rung--held .rung__text{font-weight:500;color:var(--loop-body)}
.lf .rung__row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lf .t{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.lf .t--fact{background:var(--loop-neutral-soft);color:var(--loop-neutral)}
.lf .t--obs{background:var(--loop-accent-soft);color:var(--loop-accent)}
.lf .t--int{background:var(--loop-surface);color:var(--loop-ink);border:1px dashed var(--loop-line-strong);font-style:italic}
.lf .t--rec{background:var(--loop-company);color:var(--loop-company-ink)}
.lf .t--held{background:var(--loop-warn-soft);color:var(--loop-warn)}
.lf .spark{width:100%;height:56px;display:block}
.lf .callout{position:absolute;top:-9px;left:-9px;z-index:3;width:22px;height:22px;border-radius:50%;background:var(--loop-ink);color:#fff;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff}
.lf .rel{position:relative}
.lf .jump{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--loop-accent);margin-top:6px}
/* phone shell */
.ph{flex:0 0 340px;width:340px;border:1px solid var(--d-line-strong);border-radius:30px;background:var(--loop-canvas);overflow:hidden;box-shadow:0 18px 48px -24px rgba(15,28,42,.35)}
.ph__cap{font-family:var(--d-font);font-size:12.5px;font-weight:700;color:var(--d-ink);padding:10px 14px 0;text-align:center}
.ph__cap small{display:block;font-weight:500;color:var(--d-faint);font-size:11.5px}
.ph__frame{margin:8px 8px 8px;border-radius:24px;overflow:hidden;background:var(--loop-canvas);border:1px solid var(--loop-line)}
.ph__status{display:flex;justify-content:space-between;font-size:11px;color:var(--loop-muted);padding:6px 16px 0;background:var(--loop-surface)}
.ph__scroll{height:700px;overflow-y:auto;position:relative;background:var(--loop-canvas)}
.lf .loop-mhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;background:var(--loop-surface);border-bottom:1px solid var(--loop-line)}
.lf .loop-sb__menubtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:5px 11px;font-size:13px;font-weight:650;color:var(--loop-ink);background:var(--loop-surface);border:1px solid var(--loop-line-strong);border-radius:var(--loop-radius-sm)}
.lf .loop-sb__menubtn::before{content:&#x27;\2261&#x27;;font-size:18px;line-height:1}
.lf .wordmark{font-weight:800;letter-spacing:-.02em;color:var(--loop-ink);font-size:16px}
.lf .loop-main{padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px}
.lf .titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--loop-muted)}
.lf .actbar{position:sticky;bottom:60px;z-index:6;display:flex;gap:8px;padding:10px 12px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--loop-line)}
.lf .actbar .loop-btn{flex:1}
.lf .actbar__status{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:12.5px;color:var(--loop-body);min-width:0}
.lf .actbar__status b{color:var(--loop-ink);font-size:13px}
.lf .loop-areabar{position:sticky;bottom:0;z-index:7;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--loop-surface);border-top:1px solid var(--loop-line);padding:6px 4px 10px}
.lf .loop-areabar__link{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;font-size:11px;font-weight:500;color:var(--loop-muted)}
.lf .loop-areabar__ico{width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;opacity:.75}
.lf .loop-areabar__link.is-active{color:var(--loop-accent);font-weight:700}
.lf .loop-areabar__link.is-active .loop-areabar__ico{opacity:1;background:var(--loop-accent-soft)}
.lf .sheet{position:absolute;inset:0;z-index:9;background:var(--loop-surface);display:flex;flex-direction:column}
.lf .sheet__sum{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--loop-line);font-weight:700;color:var(--loop-ink);background:var(--loop-surface)}
.lf .sheet__sum span{font-size:13px;font-weight:650;color:var(--loop-accent)}
.lf .sheet__body{padding:14px 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.lf .ev{border:1px solid var(--loop-line);border-radius:var(--loop-radius-sm);overflow:hidden}
.lf .ev__row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 12px;border-top:1px solid var(--loop-line);font-size:12.5px}
.lf .ev__row:first-child{border-top:none}
.lf .ev__row b{display:block;color:var(--loop-ink);font-size:13px}
.lf .ev__row small{display:block;color:var(--loop-muted)}
.lf .ev__val{font-weight:700;color:var(--loop-ink);font-variant-numeric:tabular-nums;text-align:right}
.lf .ev__standing{padding:7px 12px;background:var(--loop-sunken);font-size:12px;color:var(--loop-body);border-top:1px solid var(--loop-line)}
/* mini frames (Raw, two contexts) */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.mini .lf{border:1px solid var(--d-line-strong);border-radius:18px;padding:14px;background:var(--loop-canvas);display:flex;flex-direction:column;gap:10px}
.mini .lf .actbar{position:static;border-radius:10px;border:1px solid var(--loop-line)}
/* desktop shell */
.desk{min-width:1080px;display:grid;grid-template-columns:232px 1fr;background:var(--loop-canvas);font-size:13.5px}
.desk .loop-sidebar{background:var(--loop-rail);color:var(--loop-rail-text);display:flex;flex-direction:column}
.desk .loop-sb__brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--loop-rail-line);color:#fff;font-weight:800;letter-spacing:-.02em}
.desk .loop-sb__os{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--loop-rail-active);border:1px solid var(--loop-rail-line);border-radius:6px;padding:2px 6px}
.desk .loop-sb__group{padding:12px 12px 4px}
.desk .loop-sb__grouplabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--loop-rail-muted);font-weight:700;padding:0 10px 8px}
.desk .loop-sb__link{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--loop-rail-text);font-size:13px;font-weight:500;position:relative}
.desk .loop-sb__link.is-active{background:var(--loop-rail-2);color:#fff;font-weight:650}
.desk .loop-sb__link.is-active::before{content:&#x27;&#x27;;position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--loop-rail-active)}
.desk .loop-sb__ico{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--loop-rail-muted);flex:0 0 16px}
.desk .loop-sb__link.is-active .loop-sb__ico{border-color:var(--loop-rail-active)}
.desk .loop-sb__foot{margin-top:auto;border-top:1px solid var(--loop-rail-line);padding:14px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:#fff}
.desk .loop-sb__foot small{display:block;color:var(--loop-rail-muted);font-size:11px}
.desk .loop-content{display:flex;flex-direction:column;min-width:0}
.desk .loop-appbar{height:56px;display:flex;align-items:center;gap:16px;padding:0 26px;border-bottom:1px solid var(--loop-line);background:rgba(255,255,255,.92)}
.desk .loop-crumbs{font-size:13px;color:var(--loop-muted);display:flex;gap:8px}
.desk .loop-crumbs b{color:var(--loop-ink);font-weight:650}
.desk .loop-crumbs .sep{color:var(--loop-faint)}
.desk .loop-iconbtn{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--loop-line-strong);background:var(--loop-surface);position:relative}
.desk .loop-iconbtn .badge{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--loop-crit);border:2px solid var(--loop-surface)}
.desk .loop-main{padding:26px 28px 40px;display:flex;flex-direction:column;gap:20px}
.desk .compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.desk .compare .media{aspect-ratio:9/13;max-height:380px}
.desk .scrub{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--loop-muted);font-variant-numeric:tabular-nums}
.desk .scrub .media__bar{flex:1;margin:0;background:var(--loop-line)}
.desk .scrub .media__bar i{background:var(--loop-accent)}
.desk .stages{display:flex;flex-direction:column;gap:8px}
.desk .stage{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--loop-line);border-radius:12px;background:var(--loop-surface)}
.desk .stage.on{border-color:var(--loop-accent);background:var(--loop-accent-soft)}
.desk .stage__n{width:26px;height:26px;border-radius:50%;background:var(--loop-neutral-soft);color:var(--loop-neutral);font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.desk .stage.on .stage__n{background:var(--loop-accent);color:#fff}
.desk .stage__t{font-weight:700;color:var(--loop-ink);font-size:13.5px}
.desk .stage__d{font-size:12.5px;color:var(--loop-muted)}
.desk .textarea{border:1px solid var(--loop-line-strong);border-radius:10px;background:var(--loop-surface);padding:10px 12px;min-height:56px;color:var(--loop-faint);font-size:13.5px}
.desk .toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--loop-body)}
.desk .toggle i{width:30px;height:18px;border-radius:999px;background:var(--loop-line-strong);position:relative;display:inline-block}
.desk .toggle i::after{content:&#x27;&#x27;;position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.desk .toggle.on i{background:var(--loop-accent)}.desk .toggle.on i::after{left:14px}

.desk .seg span{padding:6px 10px;color:var(--loop-body)}
.desk .seg span.on{background:var(--loop-accent-soft);color:var(--loop-ink);font-weight:650}
.desk .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.desk .field label{font-weight:650;color:var(--loop-body)}

&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;eyebrow&quot;&gt;Loop · Creator Hub · Mockup 1 of 10 · revision 2 · 2026-09-22&lt;/div&gt;
&lt;h1&gt;The Content Record, through its whole life&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;Mockup #1 tests the claim at the centre of the Creator Hub design: that one Content record — a creator&#x27;s piece of work carried from raw upload to published performance — can be the place Home, Tasks, edit review, approvals, publishing and intelligence all point at. Revision 2 folds in the product review: approvals with provenance that are separate from deliverable completion, brand feedback relayed through EMG, a second production cycle on the same lineage, contextual publishing, a stable region order, and a per-rung epistemic ladder — all on the same page, with no new screens.&lt;/p&gt;
&lt;div class=&quot;note&quot;&gt;Design only. All names, dates and numbers are examples for judging the design. Content, Version, Deliverable, Performance and the other product nouns are the approved &lt;em&gt;product&lt;/em&gt; vocabulary; their authoritative placement is decided in the architecture pass. The record composes campaign, opportunity, work, deliverable, performance and intelligence truth — it owns none of them.&lt;/div&gt;

&lt;!-- ===================================================== --&gt;
&lt;section id=&quot;decisions&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;0 · Revision 2&lt;/div&gt;&lt;h2&gt;Where each product decision landed&lt;/h2&gt;&lt;/header&gt;
&lt;div class=&quot;tbl&quot;&gt;&lt;table&gt;
&lt;tr&gt;&lt;th&gt;Decision&lt;/th&gt;&lt;th&gt;How the record expresses it&lt;/th&gt;&lt;th&gt;See&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;1 · Creator approval ≠ deliverable fulfilment&lt;/td&gt;&lt;td&gt;The deliverable line moves through &lt;i&gt;awaiting content → in production → awaiting your approval → Content approved → Final approved · publish by Fri → Complete&lt;/i&gt;. “Complete” appears only when the obligation is satisfied (here: brand-approved and published by Fri 25 Sep), never when a version is approved.&lt;/td&gt;&lt;td&gt;States 5–8, matrix&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;2 · Approval has provenance&lt;/td&gt;&lt;td&gt;A &lt;b&gt;Needed for Reel 1 of 2&lt;/b&gt; checklist under “Where this fits”, sourced from the campaign/deliverable, lists each requirement with who satisfied it, for which version, when. The header pill says &lt;i&gt;Approved by you&lt;/i&gt; until every requirement is met, then &lt;i&gt;Final&lt;/i&gt;. No universal “Approved”.&lt;/td&gt;&lt;td&gt;States 5–8, callout 4&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;3 · Brand/agency feedback via EMG&lt;/td&gt;&lt;td&gt;State 6: &lt;i&gt;Changes requested · Brand feedback via EMG&lt;/i&gt;. Production shows &lt;i&gt;From: Kona (brand) · relayed by Priya, EMG · refers to v2&lt;/i&gt;. History keeps originator and Loop actor as two facts and links the instruction to the version that answered it.&lt;/td&gt;&lt;td&gt;State 6, history, EMG view&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;4 · New production after completion&lt;/td&gt;&lt;td&gt;The brand feedback starts &lt;b&gt;Production 2&lt;/b&gt; on the same Content and lineage; Production 1 stays completed with its turnaround intact. “Request an edit” on a published piece says so.&lt;/td&gt;&lt;td&gt;States 6–8, history&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;5 · Raw publishing is contextual&lt;/td&gt;&lt;td&gt;Campaign content whose deliverable requires approvals offers no publish action while raw; independent content offers &lt;i&gt;Publish as-is&lt;/i&gt;. The record reads the requirement, it does not invent it.&lt;/td&gt;&lt;td&gt;“Raw, two contexts”&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;6 · Stable region order&lt;/td&gt;&lt;td&gt;Regions never move. When published, the header carries &lt;i&gt;Published · Instagram · 18.4K views · 61% watched to end&lt;/i&gt; and a &lt;i&gt;Jump to performance ↓&lt;/i&gt; link.&lt;/td&gt;&lt;td&gt;State 8&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;7 · Epistemic ladder&lt;/td&gt;&lt;td&gt;“What Loop noticed” and the evidence sheet tag every line as &lt;b&gt;Fact&lt;/b&gt; (source, read time), &lt;b&gt;Observation&lt;/b&gt; (read/derived by Loop, confidence), &lt;b&gt;Interpretation&lt;/b&gt; (inferred, sample, standing) or &lt;b&gt;Proposed&lt;/b&gt; (recommendation). The blanket “not verified” label is gone; “Not yet” remains as a withheld interpretation.&lt;/td&gt;&lt;td&gt;All states, evidence sheet&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;8 · Comparison UX&lt;/td&gt;&lt;td&gt;Kept: same moment, different cut; shared playhead on the phone; side-by-side with one scrubber and &lt;i&gt;Add a note at 0:04&lt;/i&gt; on desktop.&lt;/td&gt;&lt;td&gt;Anatomy, desktop&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;9 · Language&lt;/td&gt;&lt;td&gt;“Production” and “What Loop noticed” throughout. Productions are numbered so future kinds of production (thumbnails, cutdowns, localisation) fit the same panel.&lt;/td&gt;&lt;td&gt;Everywhere&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;10 · Boundary unchanged&lt;/td&gt;&lt;td&gt;Every projected panel names its source in its own words (campaign, production, Loop&#x27;s read, Instagram). Nothing in the record is presented as the record&#x27;s own truth except the version lineage and the creator&#x27;s name for it.&lt;/td&gt;&lt;td&gt;§7 nouns table&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;!-- ===================================================== --&gt;

&lt;p&gt;The record is one page. On a phone it reads top to bottom; every region is a Loop &lt;code&gt;Panel&lt;/code&gt; with an anchor, so a task or notification can land on the right one. Shown in the &lt;b&gt;Creator Review&lt;/b&gt; state, because that is where the record does the most work.&lt;/p&gt;

    &lt;ol class=&quot;callouts&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;b&gt;Loop&#x27;s phone header.&lt;/b&gt; The existing light header with Menu and the person&#x27;s avatar (Profile). Nothing creator-specific.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;b&gt;Trail · title · state.&lt;/b&gt; The trail names the campaign; the title is the creator&#x27;s own name for the piece; the pill is the one lifecycle state, always followed by the fact that put it there. After publishing this row also carries the headline numbers and a “Jump to performance” link — the header gets richer, the page never reorders.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;b&gt;Media preview (a Version, never “the file”).&lt;/b&gt; Plays the selected Version; the segmented control keeps the playhead, so comparison is “same moment, different cut”. “Add a note at 0:04” captures the timestamp for a change request.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;b&gt;Where this fits.&lt;/b&gt; Campaign, Deliverable, Opportunity as three plain, read-only lines — and below them &lt;b&gt;Needed for Reel 1 of 2&lt;/b&gt;: the deliverable&#x27;s own requirements, each ticked with who, which version and when once satisfied. The record reads this list from the campaign context; it never decides what counts as done.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;b&gt;Production.&lt;/b&gt; The current production cycle projected from Work OS: which cycle, its stage, who returned it, their creator-visible note, requested vs expected return. Completed cycles collapse to one line each and are never reopened.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;b&gt;Versions.&lt;/b&gt; The immutable lineage as a strip, the selected one outlined, with the full event history behind one disclosure. Approvals are marks on a version; a new version needs its own.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;7&lt;/span&gt;&lt;div&gt;&lt;b&gt;What Loop noticed.&lt;/b&gt; Each line is tagged with its rung — Fact, Observation, Interpretation, Proposed — and carries its own source, confidence or sample and standing. A rung Loop cannot yet defend is shown as “Not yet”, not omitted and not asserted.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;8&lt;/span&gt;&lt;div&gt;&lt;b&gt;After publishing.&lt;/b&gt; Performance, or an honest “nothing yet” that says what will fill it.&lt;/div&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;9&lt;/span&gt;&lt;div&gt;&lt;b&gt;State-dependent action bar.&lt;/b&gt; Sticky above the five-area bar: one primary and one secondary action for the current state, or a status line when the ball is with EMG or with the brand. Which actions exist is derived from the state and from the deliverable&#x27;s requirements.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;evidence&quot;&gt;
&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;4 · Evidence access&lt;/div&gt;&lt;h2&gt;“View evidence” — four rungs, each with its own standing&lt;/h2&gt;&lt;/header&gt;
&lt;p&gt;Tapping “View evidence” opens Loop&#x27;s context drawer as a full-screen sheet. The sheet is organised by rung, and each rung states its own basis: a Fact its source and read time; an Observation how Loop derived or read it and how confident it is; an Interpretation what it was inferred from, its sample and its standing; a Recommendation that it is proposed and what it rests on. There is no single “verified / not verified” stamp.&lt;/p&gt;
&lt;div class=&quot;anat&quot;&gt;
  &lt;div class=&quot;ph&quot;&gt;&lt;div class=&quot;ph__cap&quot;&gt;Phone · evidence sheet open (Published)&lt;/div&gt;&lt;div class=&quot;ph__frame lf&quot;&gt;&lt;div class=&quot;ph__status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span&gt;●●●&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ph__scroll&quot;&gt;
    &lt;div class=&quot;sheet&quot;&gt;
      &lt;div class=&quot;sheet__sum&quot;&gt;What this rests on &lt;span&gt;Close&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sheet__body&quot;&gt;

      &lt;li&gt;&lt;span class=&quot;num&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;b&gt;Proposed&lt;/b&gt; recommendations name the rung they rest on and can be dismissed or kept; they never change anything by themselves.&lt;/div&gt;&lt;/li&gt;
    &lt;/ol&gt;
    &lt;div class=&quot;note&quot;&gt;When EMG accepts or rejects the interpretation in the Decision Center, only the standing line changes. The creator&#x27;s record needs no other update — the same finding, a different standing.&lt;/div&gt;
